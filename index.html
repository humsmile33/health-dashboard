    // --- HEALTH LOG MODAL (ADD / EDIT) ---
    function HealthLogModal({ isOpen, onClose, initialData, onSave }) {
      if (!isOpen) return null;

      const [formData, setFormData] = useState({
        date: initialData?.dateStr?.split(' ')[0] || new Date().toISOString().split('T')[0],
        time: initialData?.dateStr?.split(' ')[1] || '06:30',
        weight: initialData?.weight || '',
        weightChange: initialData?.weightChange ?? '',
        bmi: initialData?.bmi || '',
        bodyFatPercent: initialData?.bodyFatPercent || '',
        bodyFatKg: initialData?.bodyFatKg || '',
        skeletalMuscleKg: initialData?.skeletalMuscleKg || '',
        skeletalMusclePercent: initialData?.skeletalMusclePercent || '',
        visceralFat: initialData?.visceralFat || '',
        bmr: initialData?.bmr || '',
        metabolicAge: initialData?.metabolicAge || '',
        waterPercent: initialData?.waterPercent || '',
        waterKg: initialData?.waterKg || '',
        muscleKg: initialData?.muscleKg || '',
        boneKg: initialData?.boneKg || '',
        proteinPercent: initialData?.proteinPercent || '',
        ffm: initialData?.ffm || '',
        obesityRate: initialData?.obesityRate || '',
        memo: initialData?.memo || ''
      });

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => {
          const updated = { ...prev, [name]: value };
          if (name === 'weight' && value) {
            const w = parseFloat(value);
            if (w > 0) {
              updated.bmi = (w / (1.68 * 1.68)).toFixed(1);
            }
          }
          return updated;
        });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const dateStr = `${formData.date} ${formData.time}`.trim();
        const row = [
          dateStr,
          formData.weight,
          formData.weightChange || '-',
          formData.bmi || '-',
          formData.bodyFatPercent ? `${formData.bodyFatPercent}%` : '-',
          formData.bodyFatKg || '-',
          formData.skeletalMuscleKg || '-',
          formData.skeletalMusclePercent ? `${formData.skeletalMusclePercent}%` : '-',
          formData.muscleKg || '-',
          formData.waterKg || '-',
          formData.waterPercent ? `${formData.waterPercent}%` : '-',
          formData.visceralFat || '-',
          formData.boneKg || '-',
          formData.bmr || '-',
          formData.proteinPercent ? `${formData.proteinPercent}%` : '-',
          formData.ffm || '-',
          formData.obesityRate ? `${formData.obesityRate}%` : '-',
          formData.metabolicAge || '-',
          formData.memo || ''
        ];
        onSave(row, initialData?.rawIndex);
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-xs">
          <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-xl w-full p-6 overflow-y-auto max-h-[90vh]">
            <div className="flex items-center justify-between pb-3 border-b border-slate-200">
              <h3 className="text-base font-black text-slate-900 flex items-center gap-2">
                <Heart className="w-5 h-5 text-teal-600" />
                <span>{initialData ? '인바디 측정 기록 수정' : '새 인바디 측정 기록 등록'}</span>
              </h3>
              <button onClick={onClose} className="p-1 rounded-lg hover:bg-slate-100 text-slate-400 hover:text-slate-600">
                <X className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 mt-4 text-xs font-bold">
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-600 mb-1">측정 날짜</label>
                  <input
                    type="date"
                    name="date"
                    value={formData.date}
                    onChange={handleChange}
                    required
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-300 font-mono text-xs"
                  />
                </div>
                <div>
                  <label className="block text-slate-600 mb-1">측정 시간</label>
                  <input
                    type="text"
                    name="time"
                    value={formData.time}
                    onChange={handleChange}
                    placeholder="06:30"
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-300 font-mono text-xs"
                  />
                </div>
              </div>

              <div className="grid grid-cols-3 gap-3">
                <div>
                  <label className="block text-slate-600 mb-1">체중 (kg) *</label>
                  <input
                    type="number"
                    step="0.05"
                    name="weight"
                    value={formData.weight}
                    onChange={handleChange}
                    required
                    placeholder="60.85"
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-300 font-mono text-xs text-slate-900 font-black"
                  />
                </div>
                <div>
                  <label className="block text-slate-600 mb-1">체지방률 (%)</label>
                  <input
                    type="number"
                    step="0.1"
                    name="bodyFatPercent"
                    value={formData.bodyFatPercent}
                    onChange={handleChange}
                    placeholder="17.3"
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-300 font-mono text-xs"
                  />
                </div>
                <div>
                  <label className="block text-slate-600 mb-1">골격근량 (kg)</label>
                  <input
                    type="number"
                    step="0.1"
                    name="skeletalMuscleKg"
                    value={formData.skeletalMuscleKg}
                    onChange={handleChange}
                    placeholder="25.2"
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-300 font-mono text-xs"
                  />
                </div>
              </div>

              <div className="grid grid-cols-3 gap-3">
                <div>
                  <label className="block text-slate-600 mb-1">내장지방 레벨</label>
                  <input
                    type="number"
                    step="0.5"
                    name="visceralFat"
                    value={formData.visceralFat}
                    onChange={handleChange}
                    placeholder="7.5"
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-300 font-mono text-xs"
                  />
                </div>
                <div>
                  <label className="block text-slate-600 mb-1">기초대사량 (kcal)</label>
                  <input
                    type="number"
                    name="bmr"
                    value={formData.bmr}
                    onChange={handleChange}
                    placeholder="1362"
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-300 font-mono text-xs"
                  />
                </div>
                <div>
                  <label className="block text-slate-600 mb-1">대사나이 (세)</label>
                  <input
                    type="number"
                    name="metabolicAge"
                    value={formData.metabolicAge}
                    onChange={handleChange}
                    placeholder="32"
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-300 font-mono text-xs"
                  />
                </div>
              </div>

              <div>
                <label className="block text-slate-600 mb-1">측정 메모 및 코칭</label>
                <textarea
                  name="memo"
                  value={formData.memo}
                  onChange={handleChange}
                  rows="2"
                  placeholder="예: 체중 60.85kg/체지방 17.3% 회복, 레이스 체중 범위 유지"
                  className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-300 text-xs font-medium"
                />
              </div>

              <div className="flex justify-end gap-2.5 pt-3 border-t border-slate-200">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-xl border border-slate-300 bg-slate-50 text-slate-700 hover:bg-slate-100"
                >
                  취소
                </button>
                <button
                  type="submit"
                  className="px-4 py-2 rounded-xl bg-teal-600 text-white font-black hover:bg-teal-700 shadow-sm"
                >
                  저장하기
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

// Robust decoding utility to repair UTF-8 byte streams misdecoded as Latin-1/CP-1252 (mojibake)
    function decodeUtf8Bytes(str) {
      if (typeof str !== 'string' || !str) return str;
      if (/[\uAC00-\uD7A3\u3131-\u318E]/.test(str)) return str;
      const hasPotentialMojibake = /[\u0080-\u00FF\u2010-\u203A\u20AC\u2122]/.test(str);
      if (!hasPotentialMojibake) return str;

      const cp1252Map = {
        0x20AC: 0x80, 0x201A: 0x82, 0x0192: 0x83, 0x201E: 0x84, 0x2026: 0x85,
        0x2020: 0x86, 0x2021: 0x87, 0x02C6: 0x88, 0x2030: 0x89, 0x0160: 0x8A,
        0x2039: 0x8B, 0x0152: 0x8C, 0x017D: 0x8E, 0x2018: 0x91, 0x2019: 0x92,
        0x201C: 0x93, 0x201D: 0x94, 0x2022: 0x95, 0x2013: 0x96, 0x2014: 0x97,
        0x02DC: 0x98, 0x2122: 0x99, 0x0161: 0x9A, 0x203A: 0x9B, 0x0153: 0x9C,
        0x017E: 0x9E, 0x0178: 0x9F
      };

      try {
        const bytes = new Uint8Array(str.length);
        for (let i = 0; i < str.length; i++) {
          const code = str.charCodeAt(i);
          if (code <= 0xFF) {
            bytes[i] = code;
          } else if (cp1252Map[code] !== undefined) {
            bytes[i] = cp1252Map[code];
          } else {
            return str;
          }
        }
        return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
      } catch (e) {
        return str;
      }
    }

    function deriveGrade(total) {
      if (total >= 90) return 'S';
      if (total >= 85) return 'A+';
      if (total >= 80) return 'A';
      if (total >= 70) return 'B+';
      if (total >= 60) return 'B';
      return 'C';
    }

    function getGradeTheme(grade) {
      switch (grade) {
        case 'S':
          return {
            bg: 'bg-emerald-600',
            lightBg: 'bg-emerald-50',
            text: 'text-emerald-700',
            border: 'border-emerald-300',
            badge: 'bg-emerald-600 text-white shadow-xs'

        case 'A+':
          return {
            bg: 'bg-indigo-600',
            lightBg: 'bg-indigo-50',
            text: 'text-indigo-700',
            border: 'border-indigo-300',
            badge: 'bg-indigo-600 text-white shadow-xs'

        case 'A':
          return {

            lightBg: 'bg-blue-50',
            text: 'text-blue-700',
            border: 'border-blue-300',
            badge: 'bg-blue-600 text-white shadow-xs'

        case 'B+':

            lightBg: 'bg-amber-50',

        case 'B':

    }

    // --- Custom D3 SVG Trend Chart: Gradual Score & Grade Growth Over Time ---
    function ScoreGradeTrendChart({ records, selectedItemIndex, onSelectItem, metric, sortMode }) {
      const [hoveredIndex, setHoveredIndex] = useState(null);

      const chartData = useMemo(() => {
        if (!records) return [];
        const list = records.filter(r => r.totalScore !== null || r.scoreA !== null);
        return [...list].sort((a, b) => {
          if (sortMode === 'session') {
            return a.sessionNum - b.sessionNum;
          }
          return (a.rawDate || '').localeCompare(b.rawDate || '') || a.sessionNum - b.sessionNum;
        });
      }, [records, sortMode]);

      if (chartData.length === 0) {
        return (
          <div className="h-full flex items-center justify-center text-sm font-bold text-slate-500">
            등록된 점수 및 등급 데이터가 없습니다.
          </div>
        );
      }

      const width = 840;
      const height = 280;
      const margin = { top: 32, right: 70, bottom: 44, left: 45 };
      const innerWidth = width - margin.left - margin.right;
      const innerHeight = height - margin.top - margin.bottom;

      const isSubScore = ['scoreA', 'scoreB', 'scoreC', 'scoreD'].includes(metric);
      const yDomain = isSubScore ? [0, 25] : [60, 100];

      const xScale = d3.scalePoint()
        .domain(chartData.map((d, i) => `${d.session || d.sessionNum}회`))
        .range([0, innerWidth])
        .padding(0.45);

      const yScale = d3.scaleLinear()
        .domain(yDomain)
        .range([innerHeight, 0]);

      const gradeBands = [
        { label: 'S (90~100)', min: 90, max: 100, color: 'rgba(16, 185, 129, 0.09)' },
        { label: 'A+ (85~89)', min: 85, max: 90, color: 'rgba(99, 102, 241, 0.08)' },
        { label: 'A (80~84)', min: 80, max: 85, color: 'rgba(59, 130, 246, 0.07)' },
        { label: 'B+ (70~79)', min: 70, max: 80, color: 'rgba(245, 158, 11, 0.06)' },
      ];

      const createLinePath = (getValue) => {
        const lineGen = d3.line()
          .x((d, i) => xScale(`${d.session || d.sessionNum}회`))
          .y((d) => yScale(getValue(d)))
          .curve(d3.curveMonotoneX);
        return lineGen(chartData);
      };

      const createAreaPath = (getValue) => {
        const areaGen = d3.area()
          .x((d, i) => xScale(`${d.session || d.sessionNum}회`))
          .y0(innerHeight)
          .y1((d) => yScale(getValue(d)))
          .curve(d3.curveMonotoneX);
        return areaGen(chartData);
      };

      const yTicks = yScale.ticks(isSubScore ? 5 : 5);

      return (
        <div className="w-full h-full relative">
          <svg
            viewBox={`0 0 ${width} ${height}`}
            className="w-full h-full overflow-visible select-none"
            preserveAspectRatio="xMidYMid meet"
          >
            <defs>
              <linearGradient id="totalGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#4f46e5" stopOpacity="0.32" />
                <stop offset="100%" stopColor="#4f46e5" stopOpacity="0.01" />
              </linearGradient>
            </defs>

            {!isSubScore && gradeBands.map((band, i) => {
              const yTop = yScale(Math.min(band.max, yDomain[1]));
              const yBottom = yScale(Math.max(band.min, yDomain[0]));
              const h = Math.max(0, yBottom - yTop);
              return (
                <g key={i} transform={`translate(${margin.left}, ${margin.top})`}>
                  <rect
                    x={0}
                    y={yTop}
                    width={innerWidth}
                    height={h}
                    fill={band.color}
                  />
                  <text
                    x={innerWidth + 8}
                    y={yTop + h / 2 + 4}
                    className="text-[10px] font-black fill-slate-700"
                  >
                    {band.label}
                  </text>
                </g>
              );
            })}

            {yTicks.map(tick => (
              <g key={tick} transform={`translate(${margin.left}, ${margin.top + yScale(tick)})`}>
                <line x1={0} x2={innerWidth} stroke="#e2e8f0" strokeDasharray="3 3" />
                <text
                  x={-8}
                  y={4}
                  textAnchor="end"
                  className="text-[11px] font-bold fill-slate-800 font-mono"
                >
                  {tick}점
                </text>
              </g>
            ))}

            <g transform={`translate(${margin.left}, ${margin.top})`}>
              {(metric === 'total' || metric === 'all4') && (
                <path
                  d={createAreaPath(d => d.totalScore || 0)}
                  fill="url(#totalGrad)"
                />
              )}

              {metric === 'all4' && (
                <>
                  <path
                    d={createLinePath(d => (d.scoreA || 0) * 4)}
                    fill="none"
                    stroke="#6366f1"
                    strokeWidth="2"
                    strokeDasharray="4 2"
                    opacity="0.85"
                  />
                  <path
                    d={createLinePath(d => (d.scoreB || 0) * 4)}
                    fill="none"
                    stroke="#0284c7"
                    strokeWidth="2"
                    strokeDasharray="4 2"
                    opacity="0.85"
                  />
                  <path
                    d={createLinePath(d => (d.scoreC || 0) * 4)}
                    fill="none"
                    stroke="#9333ea"
                    strokeWidth="2"
                    strokeDasharray="4 2"
                    opacity="0.85"
                  />
                  <path
                    d={createLinePath(d => (d.scoreD || 0) * 4)}
                    fill="none"
                    stroke="#d97706"
                    strokeWidth="2"
                    strokeDasharray="4 2"
                    opacity="0.85"
                  />
                </>
              )}

              {isSubScore && (
                <path
                  d={createLinePath(d => d[metric] || 0)}
                  fill="none"
                  stroke="#4f46e5"
                  strokeWidth="3"
                />
              )}

              {(metric === 'total' || metric === 'all4') && (
                <path
                  d={createLinePath(d => d.totalScore || 0)}
                  fill="none"
                  stroke="#4338ca"
                  strokeWidth="3.5"
                  strokeLinecap="round"
                />
              )}

              {chartData.map((d, idx) => {
                const xVal = xScale(`${d.session || d.sessionNum}회`);
                const targetScore = isSubScore ? (d[metric] || 0) : (d.totalScore || 0);
                const yVal = yScale(targetScore);
                const isSelected = selectedItemIndex === d.index_;
                const isHovered = hoveredIndex === d.index_;
                const isLast = idx === chartData.length - 1;

                return (
                  <g
                    key={d.index_}
                    className="cursor-pointer"
                    onClick={() => onSelectItem(d.index_)}
                    onMouseEnter={() => setHoveredIndex(d.index_)}
                    onMouseLeave={() => setHoveredIndex(null)}
                  >
                    <line
                      x1={xVal}
                      x2={xVal}
                      y1={yVal}
                      y2={innerHeight}
                      stroke={isSelected ? '#4f46e5' : '#cbd5e1'}
                      strokeDasharray={isSelected ? 'none' : '2 2'}
                      strokeWidth={isSelected ? '2' : '1'}
                    />

                    {(isSelected || isHovered) && (
                      <circle
                        cx={xVal}
                        cy={yVal}
                        r={isSelected ? 11 : 9}
                        fill="#4f46e5"
                        fillOpacity="0.22"
                      />
                    )}

                    <circle
                      cx={xVal}
                      cy={yVal}
                      r={isSelected ? 6.5 : isLast ? 6 : 5}
                      fill={isLast ? '#059669' : isSelected ? '#4338ca' : '#4f46e5'}
                      stroke="#ffffff"
                      strokeWidth="2.5"
                    />

                    <g transform={`translate(${xVal}, ${yVal - 14})`}>
                      <rect
                        x="-20"
                        y="-13"
                        width="40"
                        height="17"
                        rx="4"
                        fill={isSelected ? '#312e81' : isLast ? '#065f46' : '#ffffff'}
                        stroke={isSelected ? '#4338ca' : isLast ? '#059669' : '#cbd5e1'}
                        strokeWidth="1"
                        filter="drop-shadow(0 1px 2px rgba(0,0,0,0.08))"
                      />
                      <text
                        textAnchor="middle"
                        y="-1"
                        className={`text-[11px] font-black font-mono ${
                          isSelected || isLast ? 'fill-white' : 'fill-slate-900'
                        }`}
                      >
                        {targetScore}점
                      </text>
                    </g>

                    {!isSubScore && d.grade && (
                      <text
                        x={xVal}
                        y={yVal + 17}
                        textAnchor="middle"
                        className={`text-[11px] font-black ${
                          d.grade === 'S'
                            ? 'fill-emerald-700'
                            : d.grade === 'A+'
                            ? 'fill-indigo-700'
                            : 'fill-slate-700'
                        }`}
                      >
                        {d.grade}
                      </text>
                    )}

                    <text
                      x={xVal}
                      y={innerHeight + 18}
                      textAnchor="middle"
                      className={`text-xs ${
                        isSelected ? 'font-black fill-indigo-950' : 'font-extrabold fill-slate-800'
                      }`}
                    >
                      {d.session || `${d.sessionNum}회차`}
                    </text>

                    <text
                      x={xVal}
                      y={innerHeight + 32}
                      textAnchor="middle"
                      className={`text-[10px] font-semibold ${
                        isSelected ? 'fill-indigo-700 font-bold' : 'fill-slate-500'
                      }`}
                    >
                      {d.rawDate ? `${d.month}/${d.day}` : ''}
                    </text>
                  </g>
                );
              })}
            </g>
          </svg>

          {hoveredIndex !== null && (
            <div className="absolute top-2 left-14 bg-slate-900/95 text-white p-2.5 rounded-xl shadow-xl text-xs space-y-1 pointer-events-none z-20 border border-slate-700">
              {(() => {
                const h = chartData.find(d => d.index_ === hoveredIndex);
                if (!h) return null;
                return (
                  <>
                    <div className="font-extrabold flex items-center gap-2">
                      <span className="px-1.5 py-0.5 rounded bg-indigo-600 text-[10px]">{h.session}</span>
                      <span>{h.bookTitle}</span>
                      <span className="text-slate-400 font-mono">({h.rawDate})</span>
                    </div>
                    <div className="flex items-center gap-3 pt-1 text-slate-200">
                      <span>총점: <strong className="text-emerald-400 text-sm font-black">{h.totalScore}점</strong></span>
                      <span>성취등급: <strong className="text-indigo-300 font-black">{h.grade}</strong></span>
                      <span>이해 {h.scoreA} · 비판 {h.scoreB} · 내면 {h.scoreC} · 표현 {h.scoreD}</span>
                    </div>
                  </>
                );
              })()}
            </div>
          )}
        </div>
      );
    }

    // --- Custom D3 SVG Bar Chart: Monthly Reading Progress ---
    function MonthlyBarChart({ data, activeFilter, onSelectMonth }) {
      const [hoveredBar, setHoveredBar] = useState(null);

      if (!data || data.length === 0) {
        return (
          <div className="h-full flex items-center justify-center text-sm font-bold text-slate-700">
            월별 기록 데이터가 없습니다.
          </div>
        );
      }

      const width = 380;
      const height = 150;
      const margin = { top: 25, right: 20, bottom: 28, left: 35 };
      const innerWidth = width - margin.left - margin.right;
      const innerHeight = height - margin.top - margin.bottom;

      const maxVal = d3.max(data, d => d.count) || 1;
      const yDomainMax = Math.max(maxVal + 1, 4);

      const xScale = d3
        .scaleBand()
        .domain(data.map(d => d.monthKey))
        .range([0, innerWidth])
        .padding(0.38);

      const yScale = d3
        .scaleLinear()
        .domain([0, yDomainMax])
        .nice()
        .range([innerHeight, 0]);

      const yTicks = yScale.ticks(4);

      return (
        <div className="w-full h-full relative">
          <svg
            viewBox={`0 0 ${width} ${height}`}
            className="w-full h-full overflow-visible"
            preserveAspectRatio="xMidYMid meet"
          >
            {yTicks.map(tick => (
              <g key={tick} transform={`translate(${margin.left}, ${margin.top + yScale(tick)})`}>
                <line x1={0} x2={innerWidth} stroke="#f1f5f9" strokeDasharray="3 3" />
                <text
                  x={-8}
                  y={4}
                  textAnchor="end"
                  className="text-[11px] fill-slate-800 font-extrabold font-mono"
                >
                  {tick}
                </text>
              </g>
            ))}

            <line
              x1={margin.left}
              x2={margin.left + innerWidth}
              y1={margin.top + innerHeight}
              y2={margin.top + innerHeight}
              stroke="#cbd5e1"
              strokeWidth="1.5"
            />

            <g transform={`translate(${margin.left}, ${margin.top})`}>
              {data.map(d => {
                const barX = xScale(d.monthKey);

                return (
                  <g
                    key={d.monthKey}

                    <rect
                      x={barX}
                      y={barY}
                      width={barWidth}
                      height={barHeight}
                      rx={4}
                      className={`transition-all duration-200 ${
                        isSelected
                          ? 'fill-indigo-600'
                          : isHovered
                          ? 'fill-indigo-400'
                          : 'fill-indigo-500/85 hover:fill-indigo-500'
                      }`}
                    />
                    <text
                      x={barX + barWidth / 2}
                      y={barY - 6}
                      textAnchor="middle"
                      className={`text-xs font-black ${
                        isSelected ? 'fill-indigo-800' : 'fill-slate-900'
                      }`}
                    >
                      {d.count}권
                    </text>
                    <text
                      x={barX + barWidth / 2}
                      y={innerHeight + 18}
                      textAnchor="middle"
                      className={`text-xs ${
                        isSelected ? 'fill-indigo-950 font-black' : 'fill-slate-800 font-bold'
                      }`}
                    >
                      {d.label}
                    </text>
                  </g>
                );
              })}
            </g>
          </svg>

          {hoveredBar && (
            <div className="absolute top-1 right-2 bg-slate-900 text-white text-xs font-bold px-2.5 py-1.5 rounded-md shadow-md pointer-events-none z-10">
              {data.find(d => d.monthKey === hoveredBar)?.label}:{' '}

                {data.find(d => d.monthKey === hoveredBar)?.count}권 완독
              </span>

      );

function ReadingDashboardView({ data, updateItem, deleteItem, insertItem, moveItem, followLink, onManualSync, isLiveConnected, lastSyncTime: parentSyncTime, isSyncing: parentIsSyncing, syncNotice: parentSyncNotice, onChangeSection, currentSection }) {
      const [refreshTick, setRefreshTick] = useState(0);

      const cleanData = useMemo(() => {
        if (!data || !Array.isArray(data)) return [];
        return data.map(item => ({
          index_: item.index_,
          row: Array.isArray(item.row)
            ? item.row.map(cell => (typeof cell === 'string' ? decodeUtf8Bytes(cell) : cell))
            : []
        }));
      }, [data, refreshTick]);

      const headerInfo = useMemo(() => {
        if (!cleanData || cleanData.length === 0) return { headerRowIndex: 0, headers: [] };
        const found = cleanData.find(item =>
          item.row &&
          item.row.some(c => typeof c === 'string' && (c.includes('회차') || c.includes('분류') || c.includes('도서명') || c.includes('줄거리')))
        );
        return {
          headerRowIndex: found ? found.index_ : 0,
          headers: found ? found.row : []
        };
      }, [cleanData]);

      const colIndexes = useMemo(() => {
        const headers = headerInfo.headers;
        const findIndex = (predicate, fallback) => {
          const idx = headers.findIndex(c => typeof c === 'string' && predicate(c.toLowerCase()));
          return idx !== -1 ? idx : fallback;
        };
        return {
          session: findIndex(c => c.includes('회차'), 0),
          date: findIndex(c => c.includes('기록일') || c.includes('일자') || c.includes('날짜'), 1),
          title: findIndex(c => c.includes('분류') || c.includes('도서명'), 2),
          author: findIndex(c => c.includes('저자'), 3),
          summary: findIndex(c => c.includes('줄거리'), 4),
          quote: findIndex(c => c.includes('인상 깊은') || c.includes('문장'), 5),
          studentThoughts: findIndex(c => c.includes('느낀 점') || c.includes('느낀점'), 6),
          internalization: findIndex(c => c.includes('나의 생각') || c.includes('달라진 점') || c.includes('내면화'), 7),
          aiAnalysis: findIndex(c => c.includes('ai') || c.includes('강점'), 8),
          tutoringAdvice: findIndex(c => c.includes('지도 조언') || c.includes('보완점'), 9),
          spellingCorrection: findIndex(c => c.includes('맞춤법') || c.includes('교정'), 10),
          kidFeedback: findIndex(c => c.includes('피드백') || c.includes('코멘트'), 11),
          scoreA: findIndex(c => c.includes('텍스트이해') || c.includes('텍스트 이해') || c.includes('a.텍스트'), 12),
          scoreB: findIndex(c => c.includes('비판적사고') || c.includes('비판적 사고') || c.includes('b.비판'), 13),

      const records = useMemo(() => {
        if (!cleanData) return [];
        const parseScore = (val) => {
          if (val === null || val === undefined || val === '') return null;
          const num = typeof val === 'number' ? val : parseFloat(String(val).replace(/[^0-9.]/g, ''));
          return isNaN(num) ? null : num;
        };

        return cleanData
          .filter(item => item.index_ !== headerInfo.headerRowIndex && item.row && item.row.some(cell => cell !== null && cell !== ''))
          .map(item => {
            const row = item.row;
            const rawTitle = row[colIndexes.title] || '';
            let category = '기타';
            let bookTitle = String(rawTitle).trim();

            const catMatch = bookTitle.match(/^\[(.*?)\]\s*(.*)$/);
            if (catMatch) {
              category = catMatch[1].trim();
              bookTitle = catMatch[2].trim();
            }

            const dateStr = row[colIndexes.date] ? String(row[colIndexes.date]).trim() : '';
            let year = null;
            let month = null;
            let day = null;
            let monthKey = '';
            let timestamp = 0;

            if (dateStr) {
              const cleanDate = dateStr.replace(/[\.\/]/g, '-').replace(/\s+/g, '');
              const parts = cleanDate.split('-').filter(Boolean);
              if (parts.length === 3) {
                let y = parseInt(parts[0], 10);
                const m = parseInt(parts[1], 10);
                const d = parseInt(parts[2], 10);
                if (y < 100) y += 2000;
                if (!isNaN(y) && !isNaN(m) && !isNaN(d)) {
                  year = y;
                  month = m;
                  day = d;
                  monthKey = `${year}-${String(month).padStart(2, '0')}`;
                  timestamp = new Date(year, month - 1, day).getTime();
                }
              }
            }

            const rawSession = row[colIndexes.session] ? String(row[colIndexes.session]).trim() : '';
            const sessionMatch = rawSession.match(/\d+/);
            const sessionNum = sessionMatch ? parseInt(sessionMatch[0], 10) : item.index_;

            const scoreA = parseScore(row[colIndexes.scoreA]);
            const scoreB = parseScore(row[colIndexes.scoreB]);
            const scoreC = parseScore(row[colIndexes.scoreC]);
            const scoreD = parseScore(row[colIndexes.scoreD]);
            let totalScore = parseScore(row[colIndexes.totalScore]);
            if (totalScore === null && (scoreA !== null || scoreB !== null || scoreC !== null || scoreD !== null)) {
              totalScore = (scoreA || 0) + (scoreB || 0) + (scoreC || 0) + (scoreD || 0);
            }

            const rawGrade = row[colIndexes.grade] ? String(row[colIndexes.grade]).trim() : '';
            const grade = rawGrade || (totalScore !== null ? deriveGrade(totalScore) : '');

            const originalRawRow = data?.find(d => d.index_ === item.index_)?.row || row;

            return {
              index_: item.index_,
              session: rawSession,
              sessionNum,
              rawDate: dateStr,
              year,
              month,
              day,
              monthKey,
              timestamp,
              fullTitle: rawTitle,

              summary: row[colIndexes.summary] ? String(row[colIndexes.summary]).trim() : '',

              internalization: row[colIndexes.internalization] ? String(row[colIndexes.internalization]).trim() : '',
              aiAnalysis: row[colIndexes.aiAnalysis] ? String(row[colIndexes.aiAnalysis]).trim() : '',
              tutoringAdvice: row[colIndexes.tutoringAdvice] ? String(row[colIndexes.tutoringAdvice]).trim() : '',
              spellingCorrection: row[colIndexes.spellingCorrection] ? String(row[colIndexes.spellingCorrection]).trim() : '',

      const filteredRecords = useMemo(() => {

          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchTitle = r.bookTitle.toLowerCase().includes(q);
            const matchAuthor = r.author.toLowerCase().includes(q);
            const matchSummary = r.summary.toLowerCase().includes(q);
            const matchThoughts = r.studentThoughts.toLowerCase().includes(q);
            const matchAI = r.aiAnalysis.toLowerCase().includes(q);
            if (!matchTitle && !matchAuthor && !matchSummary && !matchThoughts && !matchAI) {
              return false;
            }
          }
          return true;
        });

        return list.sort((a, b) => {
          if (listSortOrder === 'desc') {
            const timeDiff = (b.timestamp || 0) - (a.timestamp || 0);
            if (timeDiff !== 0) return timeDiff;
            const dateComp = (b.rawDate || '').localeCompare(a.rawDate || '');
            return dateComp !== 0 ? dateComp : b.sessionNum - a.sessionNum;
          } else {
            return a.sessionNum - b.sessionNum;

      }, [records, selectedCategory, activeMonthFilter, searchQuery, listSortOrder]);

      const monthlyData = useMemo(() => {
        const map = {};
        records.forEach(r => {
          if (!r.monthKey) return;
          if (!map[r.monthKey]) {
            map[r.monthKey] = {
              monthKey: r.monthKey,
              label: `${r.year}년 ${r.month}월`,
              count: 0,
              books: []
            };
          }
          map[r.monthKey].count += 1;
          map[r.monthKey].books.push(r.bookTitle);

        return Object.values(map).sort((a, b) => a.monthKey.localeCompare(b.monthKey));
      }, [records]);

      const dailyData = useMemo(() => {
        const map = {};
        records.forEach(r => {
          if (!r.rawDate) return;
          if (!map[r.rawDate]) {
            const label = r.month && r.day ? `${r.month}월 ${r.day}일` : r.rawDate;
            map[r.rawDate] = {
              dateStr: r.rawDate,
              label,
              count: 0,
              monthKey: r.monthKey,
              books: []
            };
          }
          map[r.rawDate].count += 1;
          map[r.rawDate].books.push(r.bookTitle);
        });
        return Object.values(map).sort((a, b) => a.dateStr.localeCompare(b.dateStr));
      }, [records]);

      const peakDayInfo = useMemo(() => {
        if (!dailyData || dailyData.length === 0) return '기록 없음';
        const peak = dailyData.reduce((max, d) => (d.count > (max?.count || 0) ? d : max), dailyData[0]);
        return `${peak.label} (${peak.count}권 완독)`;
      }, [dailyData]);

      const stats = useMemo(() => {
        const total = records.length;
        const internalizedCount = records.filter(
          r => r.internalization && r.internalization.trim().length > 0 && !r.internalization.includes('미작성')
        ).length;
        const rawRate = total > 0 ? (internalizedCount / total) * 100 : 0;
        const internalizedRate = Number.isInteger(rawRate) ? String(rawRate) : rawRate.toFixed(1);
        const withFeedbackCount = records.filter(r => r.kidFeedback && r.kidFeedback.trim().length > 0).length;

        const scoredRecords = records.filter(r => r.totalScore !== null);
        const avgScore = scoredRecords.length > 0
          ? (scoredRecords.reduce((acc, r) => acc + r.totalScore, 0) / scoredRecords.length).toFixed(1)
          : '0';
        const maxScoreRec = scoredRecords.reduce((max, r) => (!max || r.totalScore > max.totalScore ? r : max), null);
        const maxScore = maxScoreRec ? maxScoreRec.totalScore : null;
        const maxGrade = maxScoreRec ? maxScoreRec.grade : '-';

        const sessionSorted = [...scoredRecords].sort((a, b) => a.sessionNum - b.sessionNum);
        const firstScored = sessionSorted.length > 0 ? sessionSorted[0] : null;
        const lastScored = sessionSorted.length > 0 ? sessionSorted[sessionSorted.length - 1] : null;

        const initialScore = firstScored ? firstScored.totalScore : null;
        const initialGrade = firstScored ? firstScored.grade : '';

      const [isMobileSidebarOpen, setIsMobileSidebarOpen] = useState(false);

      const [data, setData] = useState(() => {
        try {
          const saved = localStorage.getItem('workout_dashboard_data');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length >= INITIAL_REAL_DATA.length) {
              return parsed;
            }
          }
        } catch (e) {}
        return INITIAL_REAL_DATA;
      });

      // Health Data State
      const [healthData, setHealthData] = useState(() => {
        try {
          const saved = localStorage.getItem('health_dashboard_data');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length >= INITIAL_HEALTH_DATA.length) {
              return parsed;
            }
          }
        } catch (e) {}
        return INITIAL_HEALTH_DATA;
      });

      // Reading & Essay Tutoring Data State
      const [readingData, setReadingData] = useState(() => {
        try {
          const saved = localStorage.getItem('tutoring_reading_dashboard_data_v2');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length >= INITIAL_READING_DATA.length) {
              return parsed;
            }
          }
        } catch (e) {}
        return INITIAL_READING_DATA;
      });

      const [isServerLive, setIsServerLive] = useState(false);
      const [lastSyncTime, setLastSyncTime] = useState('');
      const [isSyncing, setIsSyncing] = useState(false);
      const [syncNotice, setSyncNotice] = useState('');

      const persistData = (newData) => {
        setData(newData);
        try {
          localStorage.setItem('workout_dashboard_data', JSON.stringify(newData));
        } catch (e) {}
      };

      const persistHealthData = (newData) => {
        setHealthData(newData);
        try {
          localStorage.setItem('health_dashboard_data', JSON.stringify(newData));
        } catch (e) {}
      };

      const persistReadingData = (newData) => {

        try {
          localStorage.setItem('tutoring_reading_dashboard_data_v2', JSON.stringify(newData));
        } catch (e) {}
      };

      const updateReadingItem = (index_, updatedRow) => {
        const next = readingData.map(item => item.index_ === index_ ? { ...item, row: updatedRow } : item);
        persistReadingData(next);
      };

      const deleteReadingItem = (indexToDelete) => {
        const next = readingData.filter(item => item.index_ !== indexToDelete);
        persistReadingData(next);
      };

      const insertReadingItem = (targetIndex, newRow) => {
        const maxIdx = readingData.reduce((max, d) => Math.max(max, d.index_ || 0), 0);
        const newItem = { index_: maxIdx + 1, row: newRow };
        const next = [...readingData, newItem];
        persistReadingData(next);
      };

      const moveReadingItem = (fromIdx, toIdx) => {
        console.log('moveReadingItem', fromIdx, toIdx);
      };

      const sendUpdateToServer = async (newData) => {
        if (!isServerLive) return;
        try {
          await fetch('/api/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newData)
          });
        } catch (e) {
          console.warn('[Sync] Failed to post update to server:', e);
        }
      };

      const fetchServerData = async (force = false) => {
        setIsSyncing(true);
        try {
          const url = force ? '/api/sync' : '/api/data';
          const method = force ? 'POST' : 'GET';
          const res = await fetch(url, {
            method,
            headers: { 'Cache-Control': 'no-cache' }
          });

          if (res.ok) {
            const jsonRes = await res.json();
            if (jsonRes.data && Array.isArray(jsonRes.data) && jsonRes.data.length > 0) {
              persistData(jsonRes.data);
            }
            if (jsonRes.health_data && Array.isArray(jsonRes.health_data) && jsonRes.health_data.length > 0) {
              persistHealthData(jsonRes.health_data);
            }
            if (jsonRes.reading_data && Array.isArray(jsonRes.reading_data) && jsonRes.reading_data.length > 0) {
              persistReadingData(jsonRes.reading_data);
            }
            setIsServerLive(true);
            setLastSyncTime(jsonRes.synced_at || new Date().toLocaleTimeString('ko-KR'));
            if (force) {
              setSyncNotice('구글 시트 최신 운동 & 건강 데이터 동기화 완료!');
              setTimeout(() => setSyncNotice(''), 3000);
            }
            return;
          }
        } catch (e) {
          // Local sync server unavailable; fallback to static JSON files
        }

        // Static hosting fallback (e.g. GitHub Pages)
        let didFetchStatic = false;
        try {
          const staticRes = await fetch('./workout_data.json?t=' + Date.now());
          if (staticRes.ok) {
            const staticJson = await staticRes.json();
            if (Array.isArray(staticJson) && staticJson.length > 0) {
              persistData(staticJson);
              didFetchStatic = true;
            }
          }
        } catch (err) {}

        try {
          const healthRes = await fetch('./health_data.json?t=' + Date.now());
          if (healthRes.ok) {
            const healthJson = await healthRes.json();
            if (Array.isArray(healthJson) && healthJson.length > 0) {
              persistHealthData(healthJson);
              didFetchStatic = true;
            }
          }
        } catch (err) {}

        try {
          const readingRes = await fetch('./reading_data.json?t=' + Date.now());
          if (readingRes.ok) {
            const readingJson = await readingRes.json();
            if (Array.isArray(readingJson) && readingJson.length > 0) {
              persistReadingData(readingJson);
              didFetchStatic = true;
            }
          }
        } catch (err) {}

        if (didFetchStatic) {
          setIsServerLive(true);
          setLastSyncTime('정적 배포 동기화 완료');
          if (force) {
            setSyncNotice('최신 배포 데이터 동기화 완료!');
            setTimeout(() => setSyncNotice(''), 3000);
          }
          return;
        }

        setIsServerLive(false);
        setIsSyncing(false);
      };

      useEffect(() => {
        fetchServerData(false);
        const interval = setInterval(() => {
          fetchServerData(false);
        }, 15000);
        return () => clearInterval(interval);
      }, []);

      const updateItem = (index_, newRow) => {
        const updated = data.map(item => {
          if (item.index_ === index_) {
            return { ...item, row: newRow };
          }
          return item;
        });
        persistData(updated);
        sendUpdateToServer(updated);
      };

      const deleteItem = (index_) => {
        const updated = data.filter(item => item.index_ !== index_);
        persistData(updated);
        sendUpdateToServer(updated);
      };

      const insertItem = (targetIndex, newRow) => {
        const maxIndex = data.reduce((max, it) => Math.max(max, it.index_ || 0), 0);
        const newItem = {
          index_: maxIndex + 1,
          row: newRow
        };
        const updated = [...data, newItem];
        persistData(updated);
        sendUpdateToServer(updated);
      };

      const moveItem = (fromIndex, toIndex) => {
        const copy = [...data];
        const [removed] = copy.splice(fromIndex, 1);
        copy.splice(toIndex, 0, removed);
        persistData(copy);
        sendUpdateToServer(copy);
      };

      const followLink = (url) => {
        window.open(url, '_blank');
      };

      const handleResetData = () => {
        if (confirm('구글 시트의 원본 데이터로 초기화하시겠습니까? 로컬에서 수정한 내용은 리셋됩니다.')) {
          localStorage.removeItem('workout_dashboard_data');
          localStorage.removeItem('health_dashboard_data');
          localStorage.removeItem('tutoring_reading_dashboard_data_v2');
          persistData(INITIAL_REAL_DATA);
          persistHealthData(INITIAL_HEALTH_DATA);
          persistReadingData(INITIAL_READING_DATA);
          fetchServerData(true);
        }
      };

      const workoutCount = Math.max(0, data.length - 1);
      const readingCount = useMemo(() => {
        if (!readingData || readingData.length === 0) return 11;
        return readingData.filter(d => d.index_ !== 0 && d.row && d.row.some(c => c)).length || 11;
      }, [readingData]);
      const latestHealthRow = Array.isArray(healthData) && healthData.length > 1 ? healthData[healthData.length - 1] : null;
      const latestWeight = latestHealthRow ? latestHealthRow[1] : '60.85';
      const latestDate = latestHealthRow ? latestHealthRow[0] : '2026-09-25';

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col md:flex-row relative font-sans">
          {/* Notification Toast */}
          {syncNotice && (
            <div className="fixed top-4 right-4 z-50 bg-emerald-600 text-white text-xs font-black px-4 py-2.5 rounded-xl shadow-lg flex items-center gap-2 animate-bounce">
              <CheckCircle2 className="w-4 h-4" />
              <span>{syncNotice}</span>
            </div>
          )}

          {/* Left Sidebar Navigation */}
          <SidebarNavigation
            currentSection={currentSection}
            onChangeSection={setCurrentSection}
            workoutCount={workoutCount}
            latestWeight={latestWeight}
            readingCount={readingCount}
            latestDate={latestDate}
            isLiveConnected={isServerLive}
            lastSyncTime={lastSyncTime}
            isSyncing={isSyncing}
            onManualSync={() => fetchServerData(true)}
            isCollapsed={isSidebarCollapsed}
            onToggleCollapse={() => setIsSidebarCollapsed(!isSidebarCollapsed)}
            isMobileOpen={isMobileSidebarOpen}
            onCloseMobile={() => setIsMobileSidebarOpen(false)}
          />

          {/* Main Content Area */}
          <div className="flex-1 min-w-0 flex flex-col">
            {/* Top Bar for Mobile */}
            <div className="md:hidden sticky top-0 z-30 bg-slate-950 text-white px-4 py-3 flex items-center justify-between border-b border-slate-800 shadow-sm">
              <div className="flex items-center gap-2.5">
                <button
                  onClick={() => setIsMobileSidebarOpen(true)}
                  className="p-2 rounded-xl bg-slate-800 text-slate-200 hover:text-white cursor-pointer"
                >
                  <Menu className="w-4 h-4" />
                </button>
                <div className="flex items-center gap-2">
                  <span className="font-black text-xs text-white">
                    {currentSection === 'workout' ? '🏃 운동 관리' : currentSection === 'health' ? '🩺 건강 종합관리' : '📚 독서 & 논술 지도'}
                  </span>
                  <span className="text-[10px] font-bold text-slate-400">
                    {currentSection === 'workout' ? `(${workoutCount}회)` : currentSection === 'health' ? `(${latestWeight}kg)` : `(${readingCount}회차)`}
                  </span>
                </div>
              </div>

              <div className="flex items-center gap-1.5">
                <button
                  onClick={() => fetchServerData(true)}
                  disabled={isSyncing}
                  className="p-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white cursor-pointer disabled:opacity-60"
                  title="새로고침"
                >
                  <RefreshCw className={`w-3.5 h-3.5 text-emerald-400 ${isSyncing ? 'animate-spin' : ''}`} />
                </button>
              </div>
            </div>

            {/* Active Section View */}
            {currentSection === 'workout' ? (
              <App
                data={data}
                updateItem={updateItem}
                deleteItem={deleteItem}
                insertItem={insertItem}
                moveItem={moveItem}
                followLink={followLink}
                onManualSync={() => fetchServerData(true)}
                isLiveConnected={isServerLive}
                lastServerSyncTime={lastSyncTime}
                isSyncing={isSyncing}
                syncNotice={syncNotice}
                onChangeSection={setCurrentSection}
                currentSection={currentSection}
              />
            ) : currentSection === 'health' ? (
              <HealthDashboardView
                healthData={healthData}
                onUpdateHealthData={persistHealthData}
                onManualSync={() => fetchServerData(true)}
                isLiveConnected={isServerLive}
                lastServerSyncTime={lastSyncTime}
                isSyncing={isSyncing}
                onChangeSection={setCurrentSection}
                currentSection={currentSection}
              />
            ) : (
              <ReadingDashboardView
                data={readingData}
                updateItem={updateReadingItem}
                deleteItem={deleteReadingItem}
                insertItem={insertReadingItem}
                moveItem={moveReadingItem}
                followLink={followLink}
                onManualSync={() => fetchServerData(true)}
                isLiveConnected={isServerLive}
                lastSyncTime={lastSyncTime}
                isSyncing={isSyncing}
                syncNotice={syncNotice}
                onChangeSection={setCurrentSection}
                currentSection={currentSection}
              />
            )}
          </div>

          {/* Floating Helper Toolbar */}
          <div className="fixed bottom-4 right-4 z-40 flex items-center gap-2 bg-white/95 backdrop-blur-md p-2 rounded-2xl shadow-xl border border-slate-300 text-xs font-bold">
            <div className="inline-flex items-center p-0.5 rounded-xl bg-slate-900 text-white shadow-xs">
              <button
                onClick={() => setCurrentSection('workout')}
                className={`px-2.5 py-1.5 rounded-lg transition-all cursor-pointer flex items-center gap-1 font-bold ${
                  currentSection === 'workout' ? 'bg-emerald-600 text-white font-black' : 'text-slate-300 hover:text-white'
                }`}
                title="운동 관리 대시보드로 이동"
              >
                <Dumbbell className="w-3.5 h-3.5 text-emerald-400" />
                <span>운동</span>
              </button>
              <button
                onClick={() => setCurrentSection('health')}
                className={`px-2.5 py-1.5 rounded-lg transition-all cursor-pointer flex items-center gap-1 font-bold ${
                  currentSection === 'health' ? 'bg-teal-600 text-white font-black' : 'text-slate-300 hover:text-white'
                }`}
                title="건강 종합관리 대시보드로 이동"
              >
                <Heart className="w-3.5 h-3.5 text-rose-400" />
                <span>건강</span>
              </button>
              <button
                onClick={() => setCurrentSection('reading')}
                className={`px-2.5 py-1.5 rounded-lg transition-all cursor-pointer flex items-center gap-1 font-bold ${
                  currentSection === 'reading' ? 'bg-indigo-600 text-white font-black' : 'text-slate-300 hover:text-white'
                }`}
                title="독서 & 논술 지도 대시보드로 이동"
              >
                <BookOpen className="w-3.5 h-3.5 text-indigo-300" />
                <span>독서&논술</span>
              </button>
            </div>
            <span className="text-slate-300">|</span>
            <button
              onClick={() => fetchServerData(true)}
              disabled={isSyncing}
              className="px-3 py-1.5 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-800 border border-indigo-200 transition-colors flex items-center gap-1.5 cursor-pointer disabled:opacity-60 font-black"
              title="구글 시트 즉시 동기화"
            >
              <RefreshCw className={`w-3.5 h-3.5 text-indigo-600 ${isSyncing ? 'animate-spin' : ''}`} />
              <span>{isSyncing ? '동기화 중...' : '시트 동기화'}</span>
            </button>
            <span className="text-slate-300">|</span>
            <button
              onClick={handleResetData}
              className="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors flex items-center gap-1 cursor-pointer"
              title="원본 데이터로 리셋"
            >
              <RotateCcw className="w-3.5 h-3.5 text-slate-500" />
              <span>초기화</span>
            </button>
            <span className="text-slate-300">|</span>
            <span className="text-emerald-800 font-black px-2 py-1 bg-emerald-50 rounded-lg flex items-center gap-1 border border-emerald-200">
              <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              {isServerLive ? '구글시트 실시간 연동 ON' : '로컬 모드'}
            </span>
          </div>
        </div>
      );
    }


        const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DashboardContainer />);
  </script>
</body>
</html>
