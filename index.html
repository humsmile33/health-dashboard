    );
    const Menu = ({ className = "w-4 h-4", ...p }) => (

    // --- Reading & Tutoring Icons ---

    const PenTool = ({ className = "w-4 h-4", ...p }) => (

      </svg>

    const UserCheck = ({ className = "w-4 h-4", ...p }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...p}>
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/>
      </svg>
    );

    // --- HELPER UTILITIES ---
    const fixMojibake = (val) => {
      if (val === null || val === undefined) return '';
      const str = String(val).trim();
      if (!str || str === '-') return str;

      if (/[\u0080-\u009FÃÂìëêíïîðñòóôõö÷øùúûüýþÿ]/.test(str)) {
        try {
          const bytes = new Uint8Array([...str].map(c => c.charCodeAt(0) & 0xFF));
          const decoded = new TextDecoder('utf-8', { fatal: false }).decode(bytes);
          if (/[\uAC00-\uD7A3]/.test(decoded)) {
            return decoded.replace(/\0/g, '').trim();
          }
          if (decoded && !decoded.includes('\uFFFD')) {
            return decoded.replace(/\0/g, '').trim();
          }
        } catch (e) {}
        return str.replace(/[\u0080-\u009F]/g, '').trim();
      }
      return str;
    };

    const parseNum = (val) => {
      if (val === null || val === undefined || val === '-' || val === '') return null;
      if (typeof val === 'number') return isNaN(val) ? null : val;
      const cleaned = fixMojibake(String(val))
        .replace(/%/g, '')
        .replace(/,/g, '')
        .replace(/kcal/gi, '')
        .replace(/bpm/gi, '')
        .replace(/스트로크/gi, '')
        .trim();
      const parsed = parseFloat(cleaned);
      return isNaN(parsed) ? null : parsed;
    };

    const normalizeDateStr = (val) => {
      if (val === null || val === undefined || val === '') return '';
      if (typeof val === 'number' || (!isNaN(val) && Number(val) > 30000 && Number(val) < 80000)) {
        const serial = Number(val);
        const utcDays = Math.floor(serial - 25569);
        const d = new Date(utcDays * 86400 * 1000);
        const yyyy = d.getUTCFullYear();
        const mm = String(d.getUTCMonth() + 1).padStart(2, '0');
        const dd = String(d.getUTCDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
      }
      const s = fixMojibake(String(val)).trim();
      const clean = s.split('T')[0].trim();
      const match = clean.match(/^(\d{4})[-./\s년]+(\d{1,2})[-./\s월]+(\d{1,2})/);
      if (match) {
        const y = match[1];
        const m = match[2].padStart(2, '0');
        const d = match[3].padStart(2, '0');
        return `${y}-${m}-${d}`;
      }
      return clean;
    };

    const normalizeTimeStr = (val) => {
      if (val === null || val === undefined || val === '') return '';
      if (typeof val === 'number' && val >= 0 && val <= 1) {
        const totalSec = Math.round(val * 86400);
        const hh = String(Math.floor(totalSec / 3600)).padStart(2, '0');
        const mm = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
        const ss = String(totalSec % 60).padStart(2, '0');
        return `${hh}:${mm}:${ss}`;
      }
      return String(val).trim();
    };

    const parseDurationMin = (val) => {
      if (val === null || val === undefined || val === '-' || val === '') return 0;
      if (typeof val === 'number') return isNaN(val) ? 0 : val;
      const str = fixMojibake(String(val)).trim();
      if (!str) return 0;

      let totalMinutes = 0;
      let hasUnit = false;

      const hourMatch = str.match(/(\d+(?:\.\d+)?)\s*(?:시간|h|hr|hours?)/i);
      if (hourMatch) {
        totalMinutes += parseFloat(hourMatch[1]) * 60;
        hasUnit = true;
      }

      const minMatch = str.match(/(\d+(?:\.\d+)?)\s*(?:분|m|min|mins?)/i);
      if (minMatch) {
        totalMinutes += parseFloat(minMatch[1]);
        hasUnit = true;
      }

      const secMatch = str.match(/(\d+(?:\.\d+)?)\s*(?:초|s|sec|seconds?)/i);
      if (secMatch) {
        totalMinutes += parseFloat(secMatch[1]) / 60;
        hasUnit = true;
      }

      if (hasUnit) {
        return Math.round(totalMinutes * 10) / 10;
      }

      const num = parseFloat(str.replace(/,/g, ''));
      return isNaN(num) ? 0 : num;
    };

    const parseDateSafe = (dateStr, timeStr) => {
      const normDate = normalizeDateStr(dateStr);
      if (!normDate) return new Date(0);
      const dateParts = normDate.split('-').map(Number);
      const year = dateParts[0] || 2026;
      const month = (dateParts[1] || 1) - 1;
      const day = dateParts[2] || 1;

      let hour = 0, min = 0, sec = 0;
      if (timeStr) {
        const normTime = normalizeTimeStr(timeStr);
        const timeParts = String(normTime).trim().split(':').map(Number);
        hour = timeParts[0] || 0;
        min = timeParts[1] || 0;
        sec = timeParts[2] || 0;
      }
      return new Date(year, month, day, hour, min, sec);
    };

    const parseDistanceKm = (str) => {
      if (str === null || str === undefined || str === '-') return null;
      const s = fixMojibake(String(str)).trim();
      if (!s || s === '-') return null;

      if (/(스트로크|세트|세션|회|수심|타|개)/.test(s)) return null;

      const kmMatch = s.match(/(\d+(?:\.\d+)?)\s*km/i);
      if (kmMatch) {
        const num = parseFloat(kmMatch[1]);
        return isNaN(num) ? null : num;
      }

      const mMatch = s.match(/(\d+(?:\.\d+)?)\s*m(?![a-z])/i);
      if (mMatch) {
        const num = parseFloat(mMatch[1]);
        return isNaN(num) ? null : num / 1000;
      }

      return null;
    };

    const extractDistanceMeters = (distStr) => {
      if (!distStr || distStr === '-') return 0;
      const s = fixMojibake(String(distStr)).trim();
      if (/(스트로크|세트|세션|회|수심|타|개)/.test(s)) return 0;
      const kmMatch = s.match(/(\d+(?:\.\d+)?)\s*km/i);
      if (kmMatch) return parseFloat(kmMatch[1]) * 1000;
      const mMatch = s.match(/(\d+(?:\.\d+)?)\s*m(?![a-z])/i);
      if (mMatch) return parseFloat(mMatch[1]);
      return 0;
    };

    const parseSpeedKmH = (str) => {
      if (str === null || str === undefined || str === '-') return null;
      const s = fixMojibake(String(str)).trim();
      if (!s || s === '-') return null;
      if (s.includes('km/h')) {
        const kmhMatch = s.match(/(\d+(?:\.\d+)?)\s*km\/h/i);
        if (kmhMatch) return parseFloat(kmhMatch[1]);
        const num = parseFloat(s.replace(/km\/h/gi, '').trim());
        return isNaN(num) ? null : num;
      }
      const paceMatch = s.match(/(\d+)'(\d+)"/);
      if (paceMatch) {
        const paceSec = parseInt(paceMatch[1], 10) * 60 + parseInt(paceMatch[2], 10);
        if (paceSec > 0) return Math.round((3600 / paceSec) * 100) / 100;
      }
      return null;
    };

    const parsePaceToSec = (str) => {
      if (!str || str === '-') return null;
      const s = String(str).trim();
      const match = s.match(/(\d+)'(\d+)"/);
      if (match) {
        const min = parseInt(match[1], 10);
        const sec = parseInt(match[2], 10);
        return min * 60 + sec;
      }
      return null;
    };

    const formatPaceFromSec = (totalSec) => {
      if (!totalSec || isNaN(totalSec)) return '-';
      const m = Math.floor(totalSec / 60);
      const s = Math.round(totalSec % 60);
      return `${m}'${String(s).padStart(2, '0')}"`;
    };

    const getActivityMeta = (activity) => {
      const name = String(activity || '').trim();
      if (name.includes('사이클') || name.includes('자전거')) {
        return { name, category: '사이클', color: '#10b981', bg: 'bg-emerald-50 text-emerald-700 border-emerald-200', icon: '🚴' };
      }
      if (name.includes('달리기') || name.includes('러닝')) {
        return { name, category: '러닝', color: '#f97316', bg: 'bg-orange-50 text-orange-700 border-orange-200', icon: '🏃' };
      }
      if (name.includes('걷기')) {
        return { name, category: '걷기', color: '#0ea5e9', bg: 'bg-sky-50 text-sky-700 border-sky-200', icon: '🚶' };
      }
      if (name.includes('수영')) {
        return { name, category: '수영', color: '#06b6d4', bg: 'bg-cyan-50 text-cyan-700 border-cyan-200', icon: '🏊' };
      }
      if (name.includes('골프')) {
        return { name, category: '골프', color: '#8b5cf6', bg: 'bg-purple-50 text-purple-700 border-purple-200', icon: '⛳' };
      }
      if (name.includes('근력') || name.includes('웨이트')) {
        return { name, category: '근력', color: '#3b82f6', bg: 'bg-blue-50 text-blue-700 border-blue-200', icon: '🏋️' };
      }
      if (name.includes('다이빙')) {
        return { name, category: '다이빙', color: '#6366f1', bg: 'bg-indigo-50 text-indigo-700 border-indigo-200', icon: '🤿' };
      }
      if (name.includes('탁구')) {
        return { name, category: '구기', color: '#ec4899', bg: 'bg-pink-50 text-pink-700 border-pink-200', icon: '🏓' };
      }
      if (name.includes('계단')) {
        return { name, category: '유산소', color: '#eab308', bg: 'bg-yellow-50 text-yellow-700 border-yellow-200', icon: '🪜' };
      }
      if (name.includes('등산') || name.includes('트레킹') || name.includes('하이킹')) {
        return { name, category: '등산', color: '#15803d', bg: 'bg-emerald-50 text-emerald-800 border-emerald-300', icon: '⛰️' };
      }
      return { name, category: '기타', color: '#64748b', bg: 'bg-slate-50 text-slate-700 border-slate-200', icon: '⚡' };
    };

    const formatDateShort = (val) => {
      if (!val) return '-';
      const s = String(val).trim();
      const datePart = s.includes('T') ? s.split('T')[0] : s;
      const segments = datePart.split('-');
      if (segments.length === 3) {
        return `${parseInt(segments[1], 10)}/${parseInt(segments[2], 10)}`;
      }
      return datePart;
    };

    // --- D3 DAILY WORKOUT VOLUME & CALORIE CHART ---
    function D3DailyVolumeChart({ workouts, height = 260 }) {
      const containerRef = useRef(null);
      const [containerWidth, setContainerWidth] = useState(600);
      const [hoveredDay, setHoveredDay] = useState(null);

      useEffect(() => {
        if (!containerRef.current) return;
        const resizeObserver = new ResizeObserver((entries) => {
          for (let entry of entries) {
            setContainerWidth(entry.contentRect.width);
          }
        });
        resizeObserver.observe(containerRef.current);
        return () => resizeObserver.disconnect();
      }, []);

      const dailyData = useMemo(() => {
        const map = {};
        workouts.forEach(w => {
          if (!w.date) return;
          if (!map[w.date]) {
            map[w.date] = {
              date: w.date,
              dateLabel: formatDateShort(w.date),
              duration: 0,
              calories: 0,
              sessions: 0,
              activities: []
            };
          }
          map[w.date].duration += w.duration || 0;
          if (w.calories) map[w.date].calories += w.calories;
          map[w.date].sessions += 1;
          map[w.date].activities.push(w.activity);
        });

        const list = Object.values(map);
        list.sort((a, b) => parseDateSafe(a.date).getTime() - parseDateSafe(b.date).getTime());
        if (list.length > 0) {
          list[list.length - 1].isLatest = true;
        }
        return list;
      }, [workouts]);

      const margin = { top: 30, right: 24, bottom: 35, left: 45 };
      const innerWidth = Math.max(containerWidth - margin.left - margin.right, 100);
      const innerHeight = Math.max(height - margin.top - margin.bottom, 80);

      const xScale = useMemo(() => {
        return d3.scaleBand()
          .domain(dailyData.map(d => d.date))
          .range([0, innerWidth])
          .padding(0.3);
      }, [dailyData, innerWidth]);

      const maxDuration = d3.max(dailyData, d => d.duration) || 60;
      const yScale = useMemo(() => {
        return d3.scaleLinear()
          .domain([0, maxDuration * 1.25])
          .range([innerHeight, 0])
          .nice();
      }, [maxDuration, innerHeight]);

      return (
        <div ref={containerRef} className="w-full relative select-none">
          {dailyData.length === 0 ? (
            <div className="flex flex-col items-center justify-center h-48 text-slate-400 bg-slate-50/50 rounded-xl border border-dashed border-slate-200">
              <Activity className="w-8 h-8 mb-2 opacity-50 text-slate-400" />
              <p className="text-sm font-medium">표시할 일자별 운동 데이터가 없습니다.</p>
            </div>
          ) : (
            <div className="relative">
              <svg width={containerWidth} height={height} className="overflow-visible">
                <g transform={`translate(${margin.left}, ${margin.top})`}>
                  {yScale.ticks(4).map((tick, i) => (
                    <g key={`d-grid-${i}`} transform={`translate(0, ${yScale(tick)})`}>
                      <line x1={0} x2={innerWidth} stroke="#f1f5f9" strokeDasharray="3 3" />
                      <text x={-8} y={4} textAnchor="end" className="text-xs fill-slate-500 font-mono font-bold">
                        {tick}분
                      </text>
                    </g>
                  ))}

                  {dailyData.map((d, i) => {
                    const x = xScale(d.date);
                    const barWidth = xScale.bandwidth();
                    const y = yScale(d.duration);
                    const barHeight = Math.max(0, innerHeight - y);
                    const isHovered = hoveredDay && hoveredDay.date === d.date;

                    return (
                      <g
                        key={d.date}
                        className="cursor-pointer"
                        onMouseEnter={() => setHoveredDay(d)}
                        onMouseLeave={() => setHoveredDay(null)}
                      >
                        {isHovered && (
                          <rect
                            x={x - 4}
                            y={0}
                            width={barWidth + 8}
                            height={innerHeight}
                            fill="#f8fafc"
                            rx={6}
                          />
                        )}

                        <rect
                          x={x}
                          y={y}
                          width={barWidth}
                          height={barHeight}
                          fill={d.isLatest ? '#059669' : isHovered ? '#047857' : '#10b981'}
                          stroke={d.isLatest ? '#047857' : 'none'}
                          strokeWidth={d.isLatest ? 1.5 : 0}
                          rx={4}
                          className="transition-colors duration-150"
                        />

                        {d.isLatest && (
                          <text
                            x={x + barWidth / 2}
                            y={Math.max(y - 18, -12)}
                            textAnchor="middle"
                            className="text-[10px] fill-emerald-800 font-black tracking-tight"
                          >
                            최신
                          </text>
                        )}

                        <text
                          x={x + barWidth / 2}
                          y={y - 6}
                          textAnchor="middle"
                          className={`text-xs font-mono font-bold ${
                            d.isLatest ? 'fill-emerald-950 font-black' : isHovered ? 'fill-slate-900 font-black' : 'fill-slate-600'
                          }`}
                        >
                          {d.duration.toFixed(0)}m
                        </text>

                        {(dailyData.length <= 16 || i % 2 === 0 || d.isLatest || i === dailyData.length - 1) && (
                          <text
                            x={x + barWidth / 2}
                            y={innerHeight + 18}
                            textAnchor="middle"
                            className={`text-xs transition-colors font-bold ${
                              d.isLatest ? 'fill-emerald-950 font-black underline' : isHovered ? 'fill-slate-950 font-black' : 'fill-slate-600'
                            }`}
                          >
                            {d.dateLabel}
                          </text>
                        )}
                      </g>
                    );
                  })}
                </g>
              </svg>

              {hoveredDay && (
                <div
                  style={{
                    position: 'absolute',
                    left: Math.min(Math.max((xScale(hoveredDay.date) || 0) + margin.left - 70, 8), containerWidth - 180),
                    top: Math.max((yScale(hoveredDay.duration) || 0) + margin.top - 95, 4)
                  }}
                  className="pointer-events-none bg-slate-900/95 backdrop-blur text-white text-sm p-3 rounded-xl shadow-xl border border-slate-700/60 z-20 min-w-[175px]"
                >
                  <div className="font-bold text-slate-100 border-b border-slate-700/80 pb-1.5 mb-2 flex justify-between items-center">
                    <span className="text-sm font-extrabold">{hoveredDay.date}</span>
                    <span className="text-xs text-emerald-300 font-black px-1.5 py-0.5 rounded bg-emerald-900/50">{hoveredDay.sessions}개 세션</span>
                  </div>
                  <div className="space-y-1.5">
                    <div className="flex justify-between text-slate-200">
                      <span className="font-semibold">총 운동 시간:</span>
                      <span className="font-extrabold text-emerald-400 font-mono text-sm">{hoveredDay.duration.toFixed(1)} 분</span>
                    </div>
                    {hoveredDay.calories > 0 && (
                      <div className="flex justify-between text-slate-200">
                        <span className="font-semibold">소모 칼로리:</span>
                        <span className="font-extrabold text-amber-300 font-mono text-sm">{hoveredDay.calories.toLocaleString()} kcal</span>
                      </div>
                    )}
                    <div className="text-xs text-slate-300 font-medium truncate pt-1.5 border-t border-slate-800">
                      🏃 {Array.from(new Set(hoveredDay.activities)).join(', ')}
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // --- D3 WORKOUT CUMULATIVE DURATION & COUNT BAR CHART ---
    function D3WorkoutBarChart({ activityStats, selectedActivity, onSelectActivity, height = 260 }) {
      const containerRef = useRef(null);
      const [containerWidth, setContainerWidth] = useState(600);
      const [hoveredBar, setHoveredBar] = useState(null);

      useEffect(() => {
        if (!containerRef.current) return;
        const observer = new ResizeObserver((entries) => {
          for (let entry of entries) {
            setContainerWidth(entry.contentRect.width);
          }
        });
        observer.observe(containerRef.current);
        return () => observer.disconnect();
      }, []);

      const chartData = useMemo(() => {
        return activityStats.slice(0, 8);
      }, [activityStats]);

      const margin = { top: 20, right: 24, bottom: 45, left: 90 };
      const innerWidth = Math.max(containerWidth - margin.left - margin.right, 100);
      const innerHeight = Math.max(height - margin.top - margin.bottom, 80);

      const yScale = useMemo(() => {
        return d3.scaleBand()
          .domain(chartData.map(d => d.activity))
          .range([0, innerHeight])
          .padding(0.24);
      }, [chartData, innerHeight]);

      const maxDuration = d3.max(chartData, d => d.totalDuration) || 100;
      const xScale = useMemo(() => {
        return d3.scaleLinear()
          .domain([0, maxDuration * 1.15])
          .range([0, innerWidth])
          .nice();
      }, [maxDuration, innerWidth]);

      return (
        <div ref={containerRef} className="w-full relative select-none">
          {chartData.length === 0 ? (
            <div className="flex flex-col items-center justify-center h-48 text-slate-400 bg-slate-50/50 rounded-xl border border-dashed border-slate-200">
              <Dumbbell className="w-8 h-8 mb-2 opacity-40 text-slate-400" />
              <p className="text-xs font-medium">운동 데이터가 없습니다.</p>
            </div>
          ) : (
            <div className="relative">
              <svg width={containerWidth} height={height} className="overflow-visible">
                <g transform={`translate(${margin.left}, ${margin.top})`}>
                  {xScale.ticks(5).map((tick, i) => (
                    <g key={`x-tick-${i}`} transform={`translate(${xScale(tick)}, 0)`}>
                      <line y1={0} y2={innerHeight} stroke="#f1f5f9" strokeDasharray="3 3" />
                      <text y={innerHeight + 20} textAnchor="middle" className="text-xs fill-slate-500 font-mono font-bold">
                        {tick}분
                      </text>
                    </g>
                  ))}

                  {chartData.map((d) => {
                    const y = yScale(d.activity);
                    const barWidth = xScale(d.totalDuration);
                    const isSelected = selectedActivity === d.activity;
                    const isHovered = hoveredBar === d.activity;
                    const meta = getActivityMeta(d.activity);

                    return (
                      <g
                        key={d.activity}
                        className="cursor-pointer transition-all duration-150"
                        onClick={() => onSelectActivity(isSelected ? '전체' : d.activity)}
                        onMouseEnter={() => setHoveredBar(d.activity)}
                        onMouseLeave={() => setHoveredBar(null)}
                      >
                        <text
                          x={-10}
                          y={y + yScale.bandwidth() / 2 + 5}
                          textAnchor="end"
                          className={`text-sm transition-colors ${
                            isSelected || isHovered ? 'font-black fill-slate-950 text-sm' : 'font-bold fill-slate-700'
                          }`}
                        >
                          {meta.icon} {d.activity}
                        </text>

                        <rect
                          x={0}
                          y={y}
                          width={innerWidth}
                          height={yScale.bandwidth()}
                          fill="#f8fafc"
                          rx={5}
                        />

                        <rect
                          x={0}
                          y={y}
                          width={barWidth}
                          height={yScale.bandwidth()}
                          fill={meta.color}
                          opacity={isSelected || !selectedActivity || selectedActivity === '전체' ? 1 : 0.4}
                          rx={5}
                          className="transition-all duration-200"
                        />

                        <text
                          x={barWidth + 8}
                          y={y + yScale.bandwidth() / 2 + 5}
                          className="text-xs sm:text-sm font-mono font-extrabold fill-slate-800"
                        >
                          {d.totalDuration.toFixed(1)}분 <span className="text-xs font-bold fill-slate-500 font-sans">({d.count}회)</span>
                        </text>
                      </g>
                    );
                  })}
                </g>
              </svg>
            </div>
          )}
        </div>
      );
    }

    // --- D3 ACTIVITY PROGRESS & IMPROVEMENT OVER TIME CHART ---
    function D3ActivityProgressChart({ records, activityName, height = 240 }) {
      const containerRef = useRef(null);
      const [containerWidth, setContainerWidth] = useState(600);
      const [hoveredPoint, setHoveredPoint] = useState(null);

      useEffect(() => {
        if (!containerRef.current) return;
        const observer = new ResizeObserver((entries) => {
          for (let entry of entries) {
            setContainerWidth(entry.contentRect.width);
          }
        });
        observer.observe(containerRef.current);
        return () => observer.disconnect();
      }, []);

      const filtered = useMemo(() => {
        const list = records.filter(r => {
          if (activityName === '전체') return true;
          return r.activity === activityName;
        });
        return [...list].sort((a, b) => {
          const tA = parseDateSafe(a.date, a.time).getTime();
          const tB = parseDateSafe(b.date, b.time).getTime();
          return tA - tB;
        });
      }, [records, activityName]);

      const margin = { top: 20, right: 35, bottom: 40, left: 45 };
      const innerWidth = Math.max(containerWidth - margin.left - margin.right, 100);
      const innerHeight = Math.max(height - margin.top - margin.bottom, 80);

      const metricType = useMemo(() => {
        const hasSpeed = filtered.some(r => r.speedNum !== null && !isNaN(r.speedNum));
        const hasDistance = filtered.some(r => r.distanceKm !== null && !isNaN(r.distanceKm));
        const hasCalories = filtered.some(r => r.calories !== null && !isNaN(r.calories));

        if (hasSpeed) return { key: 'speed', label: '속도 (km/h)', unit: 'km/h', color: '#10b981' };
        if (hasDistance) return { key: 'distance', label: '거리 (km)', unit: 'km', color: '#f97316' };
        if (hasCalories && !activityName.includes('사이클') && !activityName.includes('달리기')) {
          return { key: 'calories', label: '칼로리 (kcal)', unit: 'kcal', color: '#8b5cf6' };
        }
        return { key: 'duration', label: '운동 시간 (분)', unit: '분', color: '#3b82f6' };
      }, [filtered, activityName]);

      const chartData = useMemo(() => {
        const validItems = [];
        filtered.forEach((r) => {
          let val = null;
          if (metricType.key === 'speed') {
            if (r.speedNum !== null && !isNaN(r.speedNum)) val = r.speedNum;
          } else if (metricType.key === 'distance') {
            if (r.distanceKm !== null && !isNaN(r.distanceKm)) val = r.distanceKm;
          } else if (metricType.key === 'calories') {
            if (r.calories !== null && !isNaN(r.calories)) val = r.calories;
          } else {
            if (r.duration !== null && !isNaN(r.duration)) val = r.duration;
          }

          if (val !== null) {
            validItems.push({
              id: r.index_,
              date: r.date,
              time: r.time,
              dateLabel: formatDateShort(r.date),
              activity: r.activity,
              duration: r.duration,
              calories: r.calories,
              distanceStr: r.distanceOrSet,
              speedStr: r.speedOrPace,
              hr: r.heartRate,
              val,
              index: validItems.length
            });
          }
        });
        return validItems;
      }, [filtered, metricType]);

      const xScale = useMemo(() => {
        if (chartData.length <= 1) return () => innerWidth / 2;
        return d3.scalePoint()
          .domain(chartData.map((_, i) => i))
          .range([0, innerWidth])
          .padding(0.2);
      }, [chartData, innerWidth]);

      const yScale = useMemo(() => {
        const vals = chartData.map(d => d.val).filter(v => v !== null && !isNaN(v));
        if (vals.length === 0) return d3.scaleLinear().domain([0, 10]).range([innerHeight, 0]);
        const min = d3.min(vals) || 0;
        const max = d3.max(vals) || 10;
        const padding = (max - min) * 0.25 || (max * 0.2) || 2;
        return d3.scaleLinear()
          .domain([Math.max(0, min - padding), max + padding])
          .range([innerHeight, 0])
          .nice();
      }, [chartData, innerHeight]);

      const lineGen = useMemo(() => {
        return d3.line()
          .x((d, i) => xScale(i))
          .y(d => yScale(d.val))
          .curve(d3.curveMonotoneX);
      }, [xScale, yScale]);

      const areaGen = useMemo(() => {
        return d3.area()
          .x((d, i) => xScale(i))
          .y0(innerHeight)
          .y1(d => yScale(d.val))
          .curve(d3.curveMonotoneX);
      }, [xScale, yScale, innerHeight]);

      return (
        <div ref={containerRef} className="w-full relative select-none">
          {chartData.length === 0 ? (
            <div className="flex flex-col items-center justify-center h-48 text-slate-400 bg-slate-50/50 rounded-xl border border-dashed border-slate-200">
              <Activity className="w-8 h-8 mb-2 opacity-40 text-slate-400" />
              <p className="text-xs font-medium">선택된 종목의 추이 데이터가 없습니다.</p>
            </div>
          ) : (
            <div className="relative">
              <svg width={containerWidth} height={height} className="overflow-visible">
                <defs>
                  <linearGradient id="workoutGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor={metricType.color} stopOpacity="0.25" />
                    <stop offset="100%" stopColor={metricType.color} stopOpacity="0.01" />
                  </linearGradient>
                </defs>

                <g transform={`translate(${margin.left}, ${margin.top})`}>
                  {yScale.ticks(4).map((tick, i) => (
                    <g key={`prog-grid-${i}`} transform={`translate(0, ${yScale(tick)})`}>
                      <line x1={0} x2={innerWidth} stroke="#f1f5f9" strokeDasharray="3 3" />
                      <text x={-8} y={4} textAnchor="end" className="text-xs fill-slate-500 font-mono font-bold">
                        {tick.toLocaleString()}
                      </text>
                    </g>
                  ))}

                  {chartData.length > 1 && (
                    <>
                      <path d={areaGen(chartData)} fill="url(#workoutGrad)" />
                      <path
                        d={lineGen(chartData)}
                        fill="none"
                        stroke={metricType.color}
                        strokeWidth="2.5"
                        strokeLinecap="round"
                        strokeLinejoin="round"
                      />
                    </>
                  )}

                  {chartData.map((d, i) => {
                    const cx = chartData.length === 1 ? innerWidth / 2 : xScale(i);
                    const cy = yScale(d.val);
                    const isHovered = hoveredPoint && hoveredPoint.index === i;

                    return (
                      <g key={`pt-${i}`}>
                        {isHovered && (
                          <line x1={cx} y1={0} x2={cx} y2={innerHeight} stroke="#cbd5e1" strokeDasharray="2 2" />
                        )}
                        <circle
                          cx={cx}
                          cy={cy}
                          r={isHovered ? 6 : 4}
                          fill="#ffffff"
                          stroke={metricType.color}
                          strokeWidth={isHovered ? 3 : 2}
                          className="cursor-pointer transition-all duration-150"
                        />
                        <rect
                          x={cx - (innerWidth / Math.max(chartData.length, 1)) / 2}
                          y={0}
                          width={innerWidth / Math.max(chartData.length, 1)}
                          height={innerHeight + margin.bottom}
                          fill="transparent"
                          className="cursor-pointer"
                          onMouseEnter={() => setHoveredPoint({ ...d, cx, cy })}
                          onMouseLeave={() => setHoveredPoint(null)}
                        />
                        <text
                          x={cx}
                          y={innerHeight + 18}
                          textAnchor="middle"
                          className={`text-xs transition-colors font-bold ${
                            isHovered ? 'fill-slate-950 font-black' : 'fill-slate-600'
                          }`}
                        >
                          {d.dateLabel}
                        </text>
                      </g>
                    );
                  })}
                </g>
              </svg>

              {hoveredPoint && (
                <div
                  style={{
                    position: 'absolute',
                    left: Math.min(Math.max(hoveredPoint.cx + margin.left - 80, 8), containerWidth - 180),
                    top: Math.max(hoveredPoint.cy + margin.top - 80, 0)
                  }}
                  className="pointer-events-none bg-slate-900/90 backdrop-blur text-white text-sm p-3 rounded-xl shadow-xl border border-slate-700/60 z-20 min-w-[170px]"
                >
                  <div className="font-bold text-slate-100 border-b border-slate-700 pb-1.5 mb-1.5 flex justify-between">
                    <span>{hoveredPoint.date} {hoveredPoint.time ? hoveredPoint.time.slice(0, 5) : ''}</span>
                    <span className="text-xs text-slate-400 font-mono font-bold">#{hoveredPoint.index + 1}</span>
                  </div>
                  <div className="space-y-1">
                    <div className="text-emerald-400 font-extrabold flex justify-between text-sm">
                      <span>{hoveredPoint.activity}</span>
                      <span>{hoveredPoint.duration}분</span>
                    </div>
                    {hoveredPoint.speedStr && hoveredPoint.speedStr !== '-' && (
                      <div className="text-sky-300 text-xs font-semibold">속도/페이스: {hoveredPoint.speedStr}</div>
                    )}
                    {hoveredPoint.distanceStr && hoveredPoint.distanceStr !== '-' && (
                      <div className="text-amber-300 text-xs font-semibold">거리/세트: {hoveredPoint.distanceStr}</div>
                    )}
                    {hoveredPoint.calories && (
                      <div className="text-rose-300 text-xs font-semibold">칼로리: {hoveredPoint.calories} kcal</div>
                    )}
                    {hoveredPoint.hr && (
                      <div className="text-slate-300 text-xs font-semibold">심박수: {hoveredPoint.hr} bpm</div>
                    )}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // --- D3 HEART RATE DISTRIBUTION HELPER ---
    function D3HeartRateDistribution({ records, height = 240 }) {
      const containerRef = useRef(null);
      const [containerWidth, setContainerWidth] = useState(600);
      const [hoveredHr, setHoveredHr] = useState(null);

      useEffect(() => {
        if (!containerRef.current) return;
        const observer = new ResizeObserver((entries) => {
          for (let entry of entries) {
            setContainerWidth(entry.contentRect.width);
          }
        });
        observer.observe(containerRef.current);
        return () => observer.disconnect();
      }, []);

      const hrRecords = useMemo(() => {
        return records.filter(r => r.heartRate !== null && !isNaN(r.heartRate));
      }, [records]);

      const margin = { top: 20, right: 30, bottom: 35, left: 45 };
      const innerWidth = Math.max(containerWidth - margin.left - margin.right, 100);
      const innerHeight = Math.max(height - margin.top - margin.bottom, 80);

      const xScale = useMemo(() => {
        return d3.scalePoint()
          .domain(hrRecords.map((_, i) => i))
          .range([0, innerWidth])
          .padding(0.2);
      }, [hrRecords, innerWidth]);

      const yScale = useMemo(() => {
        const vals = hrRecords.map(d => d.heartRate);
        if (vals.length === 0) return d3.scaleLinear().domain([80, 160]).range([innerHeight, 0]);
        const min = Math.max(d3.min(vals) - 10, 60);
        const max = d3.max(vals) + 15;
        return d3.scaleLinear().domain([min, max]).range([innerHeight, 0]).nice();
      }, [hrRecords, innerHeight]);

      return (
        <div ref={containerRef} className="w-full relative select-none">
          {hrRecords.length === 0 ? (
            <div className="flex flex-col items-center justify-center h-48 text-slate-400 bg-slate-50/50 rounded-xl border border-dashed border-slate-200">
              <HeartPulse className="w-8 h-8 mb-2 opacity-40 text-slate-400" />
              <p className="text-xs font-medium">심박수 기록 데이터가 없습니다.</p>
            </div>
          ) : (
            <svg width={containerWidth} height={height} className="overflow-visible">
              <g transform={`translate(${margin.left}, ${margin.top})`}>
                <rect x={0} y={yScale(140)} width={innerWidth} height={Math.max(0, yScale(100) - yScale(140))} fill="#fef2f2" opacity={0.6} />
                <text x={innerWidth - 4} y={yScale(135)} textAnchor="end" className="text-xs fill-rose-600 font-bold">유산소/지방연소 구간 (100~140 bpm)</text>

                {yScale.ticks(4).map((tick, i) => (
                  <g key={`hr-grid-${i}`} transform={`translate(0, ${yScale(tick)})`}>
                    <line x1={0} x2={innerWidth} stroke="#f1f5f9" strokeDasharray="3 3" />
                    <text x={-8} y={4} textAnchor="end" className="text-xs fill-slate-500 font-mono font-bold">
                      {tick}
                    </text>
                  </g>
                ))}

                {hrRecords.length > 1 && (
                  <path
                    d={d3.line().x((_, i) => xScale(i)).y(d => yScale(d.heartRate)).curve(d3.curveMonotoneX)(hrRecords)}
                    fill="none"
                    stroke="#f43f5e"
                    strokeWidth="2.5"
                    strokeLinecap="round"
                  />
                )}

                {hrRecords.map((d, i) => {
                  const cx = xScale(i);
                  const cy = yScale(d.heartRate);
                  const isHovered = hoveredHr && hoveredHr.index === i;
                  const showLabel = hrRecords.length <= 12 || i % Math.ceil(hrRecords.length / 10) === 0 || i === hrRecords.length - 1;
                  return (
                    <g
                      key={`hr-pt-${i}`}
                      className="cursor-pointer"
                      onMouseEnter={() => setHoveredHr({ ...d, cx, cy, index: i })}
                      onMouseLeave={() => setHoveredHr(null)}
                    >
                      <circle
                        cx={cx}
                        cy={cy}
                        r={isHovered ? 6.5 : 4.5}
                        fill={isHovered ? '#f43f5e' : '#ffffff'}
                        stroke="#f43f5e"
                        strokeWidth={isHovered ? 3 : 2.5}
                        className="transition-all duration-150"
                      />
                      {showLabel && (
                        <text x={cx} y={innerHeight + 18} textAnchor="middle" className="text-xs fill-slate-600 font-bold">
                          {formatDateShort(d.date)}
                        </text>
                      )}
                    </g>
                  );
                })}
              </g>
            </svg>
          )}

          {hoveredHr && (
            <div
              style={{
                position: 'absolute',
                left: Math.min(Math.max(hoveredHr.cx + margin.left - 75, 8), containerWidth - 170),
                top: Math.max(hoveredHr.cy + margin.top - 70, 0)
              }}
              className="pointer-events-none bg-slate-900/95 backdrop-blur text-white text-xs p-2.5 rounded-xl shadow-xl border border-slate-700/60 z-20 min-w-[150px]"
            >
              <div className="font-bold text-slate-200 border-b border-slate-700 pb-1 mb-1 flex justify-between">
                <span>{hoveredHr.date}</span>
                <span className="text-slate-400 font-mono">{hoveredHr.time ? hoveredHr.time.slice(0, 5) : ''}</span>
              </div>
              <div className="flex justify-between text-rose-300 font-bold">
                <span>{hoveredHr.activity}</span>
                <span className="font-mono text-sm font-black text-rose-400">{hoveredHr.heartRate} bpm</span>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App({ data, updateItem, deleteItem, insertItem, moveItem, followLink, onManualSync, isLiveConnected, lastServerSyncTime, isSyncing, syncNotice, onChangeSection, currentSection }) {
      const [activeTab, setActiveTab] = useState('overview');
      const [triathlonGoal, setTriathlonGoal] = useState('sprint');
      const [selectedMonth, setSelectedMonth] = useState('all');
      const [selectedSportFilter, setSelectedSportFilter] = useState('전체');
      const [searchQuery, setSearchQuery] = useState('');
      const [sortOrder, setSortOrder] = useState('desc');

      const [lastSyncTime, setLastSyncTime] = useState(() => lastServerSyncTime || new Date().toLocaleTimeString('ko-KR'));
      const [isRefreshing, setIsRefreshing] = useState(false);
      const [refreshPulse, setRefreshPulse] = useState(0);

      useEffect(() => {
        if (lastServerSyncTime) {
          setLastSyncTime(lastServerSyncTime);
        }
      }, [lastServerSyncTime]);
      
      const [isWorkoutModalOpen, setIsWorkoutModalOpen] = useState(false);
      const [editingWorkoutIndex, setEditingWorkoutIndex] = useState(null);
      const [workoutFormData, setWorkoutFormData] = useState({
        date: '',
        time: '',
        activity: '실외 사이클',
        duration: '',
        calories: '',
        distanceOrSet: '',
        speedOrPace: '',
        heartRate: '',
        memo: ''
      });

      const handleForceRefresh = () => {
        setIsRefreshing(true);
        setRefreshPulse((prev) => prev + 1);
        if (onManualSync) {
          onManualSync();
        }
        setTimeout(() => {
          setLastSyncTime(new Date().toLocaleTimeString('ko-KR'));
          setIsRefreshing(false);
        }, 400);
      };

      const { headerRow, parsedWorkouts, rawHeaderIndex, latestLoggedDate } = useMemo(() => {
        if (!Array.isArray(data) || data.length === 0) {
          return { headerRow: [], parsedWorkouts: [], rawHeaderIndex: 0, latestLoggedDate: '' };
        }

        let headerIdx = 0;
        for (let i = 0; i < data.length; i++) {
          const row = data[i]?.row;
          if (Array.isArray(row) && row.some(cell => typeof cell === 'string' && (cell.includes('운동 종목') || cell.includes('운동 시간') || cell.includes('소모 칼로리') || cell.includes('날짜')))) {
            headerIdx = i;
            break;
          }
        }

        const headers = data[headerIdx]?.row || [];

        const colMap = {
          date: headers.findIndex(h => /날짜|일자|date/i.test(String(h))),
          time: headers.findIndex(h => /시간|time/i.test(String(h))),
          activity: headers.findIndex(h => /운동\s*종목|종목|activity|sport/i.test(String(h))),
          duration: headers.findIndex(h => /운동\s*시간|duration/i.test(String(h))),
          calories: headers.findIndex(h => /소모\s*칼로리|칼로리|kcal|cal/i.test(String(h))),
          distance: headers.findIndex(h => /거리|세트|횟수|dist/i.test(String(h))),
          speed: headers.findIndex(h => /속도|페이스|speed|pace/i.test(String(h))),
          heartRate: headers.findIndex(h => /심박수|hr|bpm/i.test(String(h))),
          memo: headers.findIndex(h => /메모|비고|특이사항|memo|note/i.test(String(h)))
        };

        const cDate = colMap.date >= 0 ? colMap.date : 0;
        const cTime = colMap.time >= 0 ? colMap.time : 1;
        const cAct = colMap.activity >= 0 ? colMap.activity : 2;
        const cDur = colMap.duration >= 0 ? colMap.duration : 3;
        const cCal = colMap.calories >= 0 ? colMap.calories : 4;
        const cDist = colMap.distance >= 0 ? colMap.distance : 5;
        const cSpd = colMap.speed >= 0 ? colMap.speed : 6;
        const cHr = colMap.heartRate >= 0 ? colMap.heartRate : 7;
        const cMemo = colMap.memo >= 0 ? colMap.memo : 8;

        const workouts = [];

        for (let i = 0; i < data.length; i++) {
          if (i === headerIdx) continue;
          const item = data[i];
          if (!item || !Array.isArray(item.row)) continue;
          const r = item.row;
          if (r.every(c => c === null || c === undefined || c === '')) continue;

          const dateRaw = r[cDate];
          const date = normalizeDateStr(dateRaw);
          const timeRaw = r[cTime];
          const time = normalizeTimeStr(timeRaw);
          const activity = fixMojibake(r[cAct] ? String(r[cAct]).trim() : '운동');
          const duration = parseDurationMin(r[cDur]);
          const calories = parseNum(r[cCal]);
          const distanceOrSet = r[cDist] !== undefined && r[cDist] !== null ? fixMojibake(String(r[cDist]).trim()) : '-';
          const speedOrPace = r[cSpd] !== undefined && r[cSpd] !== null ? fixMojibake(String(r[cSpd]).trim()) : '-';
          const heartRate = parseNum(r[cHr]);
          const memo = r[cMemo] !== undefined && r[cMemo] !== null ? fixMojibake(String(r[cMemo]).trim()) : '-';

          const distanceKm = parseDistanceKm(distanceOrSet);
          const speedNum = parseSpeedKmH(speedOrPace);
          const paceSec = parsePaceToSec(speedOrPace);

          workouts.push({
            index_: item.index_,
            rawIndex: i,
            rawRow: r,
            date,
            time,
            activity,
            duration,
            calories,
            distanceOrSet,
            speedOrPace,
            heartRate,
            memo,
            distanceKm,
            speedNum,
            paceSec
          });
        }

        workouts.sort((a, b) => {
          const tA = parseDateSafe(a.date, a.time).getTime();
          const tB = parseDateSafe(b.date, b.time).getTime();
          return tA - tB;
        });

        const latestDate = workouts.length > 0 ? workouts[workouts.length - 1].date : '';

        return {
          headerRow: headers,
          parsedWorkouts: workouts,
          rawHeaderIndex: headerIdx,
          latestLoggedDate: latestDate
        };
      }, [data, refreshPulse]);

      const availableMonths = useMemo(() => {
        const set = new Set();
        parsedWorkouts.forEach(w => {
          if (w.date && w.date.length >= 7) {
            set.add(w.date.substring(0, 7));
          }
        });
        return Array.from(set).sort().reverse();
      }, [parsedWorkouts]);

      const realTodayStr = useMemo(() => {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }, []);

      const todayTargetDate = useMemo(() => {
        const hasRealToday = parsedWorkouts.some(w => w.date === realTodayStr);
        return hasRealToday ? realTodayStr : latestLoggedDate;
      }, [parsedWorkouts, realTodayStr, latestLoggedDate]);

      const todayWorkouts = useMemo(() => {
        if (!todayTargetDate) return [];
        return parsedWorkouts.filter(w => w.date === todayTargetDate);
      }, [parsedWorkouts, todayTargetDate]);

      const monthFilteredWorkouts = useMemo(() => {
        if (selectedMonth === 'all') return parsedWorkouts;
        if (selectedMonth === 'today') {
          return parsedWorkouts.filter(w => w.date === todayTargetDate);
        }
        return parsedWorkouts.filter(w => w.date && w.date.startsWith(selectedMonth));
      }, [parsedWorkouts, selectedMonth, todayTargetDate]);

      const currentMonthTitle = useMemo(() => {
        if (selectedMonth === 'all') return '종합';
        if (selectedMonth === 'today') return '오늘(당일)';
        const p = selectedMonth.split('-');
        return `${parseInt(p[1] || 0, 10)}월`;
      }, [selectedMonth]);

      const {
        totalWorkoutSessions,
        totalWorkoutMinutes,
        totalCaloriesBurned,
        totalDistanceKm,
        activityStats,
        uniqueActivities,
        improvementHighlights,
        latestDateStr,
        dateRangeLabel
      } = useMemo(() => {
        const list = monthFilteredWorkouts;
        const totalSessions = list.length;
        let totalMins = 0;
        let totalCals = 0;
        let totalDist = 0;
        const map = {};

        list.forEach(w => {
          totalMins += w.duration || 0;
          if (w.calories) totalCals += w.calories;
          if (w.distanceKm) totalDist += w.distanceKm;

          if (!map[w.activity]) {
            map[w.activity] = {
              activity: w.activity,
              count: 0,
              totalDuration: 0,
              totalCalories: 0,
              totalDistanceKm: 0,
              maxSpeed: null,
              bestPaceSec: null,
              bestPaceStr: null,
              avgHeartRate: null,
              heartRateSum: 0,
              heartRateCount: 0,
              records: []
            };
          }

          const item = map[w.activity];
          item.count += 1;
          item.totalDuration += w.duration || 0;
          if (w.calories) item.totalCalories += w.calories;
          if (w.distanceKm) item.totalDistanceKm += w.distanceKm;
          if (w.speedNum && (item.maxSpeed === null || w.speedNum > item.maxSpeed)) {
            item.maxSpeed = w.speedNum;
          }
          if (w.paceSec && (item.bestPaceSec === null || w.paceSec < item.bestPaceSec)) {
            item.bestPaceSec = w.paceSec;
            item.bestPaceStr = w.speedOrPace;
          }
          if (w.heartRate) {
            item.heartRateSum += w.heartRate;
            item.heartRateCount += 1;
          }
          item.records.push(w);
        });

        const stats = Object.values(map).map(s => ({
          ...s,
          avgHeartRate: s.heartRateCount > 0 ? Math.round(s.heartRateSum / s.heartRateCount) : null
        }));

        stats.sort((a, b) => b.totalDuration - a.totalDuration);

        const highlights = [];

        const sortedChronological = [...list].sort((a, b) => parseDateSafe(a.date, a.time).getTime() - parseDateSafe(b.date, b.time).getTime());
        const finalSession = sortedChronological.length > 0 ? sortedChronological[sortedChronological.length - 1] : null;
        const latestDate = finalSession ? finalSession.date : '-';

        const latestDayWorkouts = list.filter(w => w.date === latestDate);
        if (latestDayWorkouts.length > 0) {
          const activitiesSummary = latestDayWorkouts.map(w => `${w.activity}(${w.duration.toFixed(0)}분)`).join(', ');
          const bestMemo = latestDayWorkouts.find(w => w.memo && w.memo !== '-')?.memo || '최신 운동 세션 완료';
          highlights.push({
            title: `최신 기록일 (${latestDate}): ${latestDayWorkouts.map(w => w.activity).join(' & ')}`,
            desc: `${bestMemo} · 총 ${latestDayWorkouts.reduce((s, c) => s + c.duration, 0).toFixed(1)}분 트레이닝 (${activitiesSummary})`,
            icon: '🌟',
            tag: '실시간 최신 반영'
          });
        }

        const cycling = stats.find(s => s.activity.includes('사이클') || s.activity.includes('자전거'));
        if (cycling) {
          highlights.push({
            title: cycling.maxSpeed ? `사이클 최고 속도 ${cycling.maxSpeed.toFixed(2)} km/h 달성` : `사이클 누적 ${cycling.totalDuration.toFixed(1)}분 트레이닝`,
            desc: `누적 ${cycling.count}회 세션, 총 ${cycling.totalDuration.toFixed(1)}분 트레이닝 (총 ${cycling.totalDistanceKm.toFixed(1)}km 완주) · 9/19~9/21 연속 템포 라이딩 유지`,
            icon: '🚴',
            tag: '속도 & 지구력 향상'
          });
        }

        const run = stats.find(s => s.activity.includes('달리기') || s.activity.includes('러닝'));
        if (run) {
          highlights.push({
            title: run.bestPaceStr ? `달리기 최고 페이스 ${run.bestPaceStr.replace(/\s+/g, ' ')} 달성 (6분대 진입)` : `달리기 총 ${run.totalDistanceKm.toFixed(1)}km 완주`,
            desc: `누적 ${run.count}회 러닝 세션, 총 ${run.totalDuration.toFixed(1)}분 트레이닝 (누적 ${run.totalDistanceKm.toFixed(2)}km 완주) · 9/18 템포 러닝 최고 기록 경신`,
            icon: '🏃',
            tag: '페이스 & 심폐 지구력'
          });
        }

        const hike = stats.find(s => s.activity.includes('등산') || s.activity.includes('트레킹'));
        if (hike) {
          highlights.push({
            title: `등산 누적 거리 ${hike.totalDistanceKm.toFixed(2)}km 완등`,
            desc: `총 ${hike.count}회 등산 트레킹 완수, 누적 ${hike.totalDuration.toFixed(0)}분 코스 주파`,
            icon: '⛰️',
            tag: '고강도 유산소'
          });
        }

        const swim = stats.find(s => s.activity.includes('수영'));
        if (swim) {
          highlights.push({
            title: swim.bestPaceStr ? `수영 최고 페이스 ${swim.bestPaceStr.replace(/\s+/g, ' ')} 기록` : `수영 누적 ${swim.count}회 완수`,
            desc: `누적 ${swim.count}회 수영 훈련, 총 ${(swim.totalDistanceKm * 1000).toFixed(0)}m 완영 (${swim.totalDuration.toFixed(1)}분)`,
            icon: '🏊',
            tag: '페이스 향상'
          });
        }

        const golf = stats.find(s => s.activity.includes('골프'));
        if (golf) {
          highlights.push({
            title: `골프 연습 총 ${golf.count}회 세션 완수`,
            desc: `누적 ${golf.totalDuration.toFixed(1)}분 연습 완료, 총 ${golf.totalCalories.toLocaleString()} kcal 소모`,
            icon: '⛳',
            tag: '집중도 트레이닝'
          });
        }

        const uniqueActs = ['전체', ...stats.map(s => s.activity)];

        let rangeStr = '-';
        if (list.length > 0) {
          const d1 = list[0].date;
          const d2 = list[list.length - 1].date;
          const p1 = d1.split('-');
          const p2 = d2.split('-');
          if (d1 === d2) {
            rangeStr = `${parseInt(p1[1] || 0, 10)}월 ${parseInt(p1[2] || 0, 10)}일`;
          } else {
            rangeStr = `${parseInt(p1[1] || 0, 10)}월 ${parseInt(p1[2] || 0, 10)}일 ~ ${parseInt(p2[1] || 0, 10)}월 ${parseInt(p2[2] || 0, 10)}일`;
          }
        }

        return {
          totalWorkoutSessions: totalSessions,
          totalWorkoutMinutes: totalMins,
          totalCaloriesBurned: totalCals,
          totalDistanceKm: totalDist,
          activityStats: stats,
          uniqueActivities: uniqueActs,
          improvementHighlights: highlights,
          latestDateStr: latestDate,
          dateRangeLabel: rangeStr
        };
      }, [monthFilteredWorkouts]);

      const triathlonAnalysis = useMemo(() => {
        let maxSwimDistanceM = 0;
        let bestSwimPaceSec = null;
        let bestSwimPaceStr = '-';
        let swimSessionsCount = 0;

        let maxCycleDistanceKm = 0;
        let maxCycleSpeedKmH = 0;
        let cycleSessionsCount = 0;

        let maxRunDistanceKm = 0;
        let bestRunPaceSec = null;
        let bestRunPaceStr = '-';
        let runSessionsCount = 0;

        parsedWorkouts.forEach((w) => {
          const act = String(w.activity || '');
          const distStr = String(w.distanceOrSet || '');
          const speedStr = String(w.speedOrPace || '');
          const memoStr = String(w.memo || '');

          let swimMeters = 0;
          const mMatch = distStr.match(/(\d+(?:\.\d+)?)\s*m(?![a-z])/i);
          if (mMatch) {
            swimMeters = parseFloat(mMatch[1]);
          } else if (w.distanceKm) {
            swimMeters = Math.round(w.distanceKm * 1000);
          }
          if (!swimMeters && memoStr) {
            const memoMMatch = memoStr.match(/(\d+)\s*m/i);
            if (memoMMatch) swimMeters = parseFloat(memoMMatch[1]);
          }

          let cycleDist = 0;
          if (w.distanceKm) {
            cycleDist = w.distanceKm;
          } else {
            const kmMatch = distStr.match(/(\d+(?:\.\d+)?)\s*km/i);
            if (kmMatch) cycleDist = parseFloat(kmMatch[1]);
          }

          let cycleSpeed = 0;
          if (w.speedNum) {
            cycleSpeed = w.speedNum;
          } else {
            const speedMatch = speedStr.match(/(\d+(?:\.\d+)?)\s*km\/h/i);
            if (speedMatch) cycleSpeed = parseFloat(speedMatch[1]);
          }

          let runDist = 0;
          if (w.distanceKm) {
            runDist = w.distanceKm;
          } else {
            const kmMatch = distStr.match(/(\d+(?:\.\d+)?)\s*km/i);
            if (kmMatch) runDist = parseFloat(kmMatch[1]);
          }

          let pSec = w.paceSec || parsePaceToSec(speedStr);

          if (act.includes('수영')) {
            swimSessionsCount++;
            if (swimMeters > maxSwimDistanceM) maxSwimDistanceM = swimMeters;
            if (pSec && (bestSwimPaceSec === null || pSec < bestSwimPaceSec)) {
              bestSwimPaceSec = pSec;
              bestSwimPaceStr = speedStr;
            }
          } else if (act.includes('사이클') || act.includes('자전거')) {
            cycleSessionsCount++;
            if (cycleDist > maxCycleDistanceKm) maxCycleDistanceKm = cycleDist;
            if (cycleSpeed > maxCycleSpeedKmH) maxCycleSpeedKmH = cycleSpeed;
          } else if (act.includes('달리기') || act.includes('러닝')) {
            runSessionsCount++;
            if (runDist > maxRunDistanceKm) maxRunDistanceKm = runDist;
            if (pSec && (bestRunPaceSec === null || pSec < bestRunPaceSec)) {
              bestRunPaceSec = pSec;
              bestRunPaceStr = speedStr;
            }
          }
        });

        if (maxSwimDistanceM === 0) maxSwimDistanceM = 500;
        if (maxCycleDistanceKm === 0) maxCycleDistanceKm = 18.24;
        if (maxRunDistanceKm === 0) maxRunDistanceKm = 5.67;

        const targets = triathlonGoal === 'sprint'
          ? {
              title: '철인3종 스프린트 코스 (Sprint Triathlon) - 중기 1차 목표',
              subtitle: '입문 및 첫 완주 목표: 수영 750m + 사이클 20km + 달리기 5km',
              swimDistM: 750,
              swimPaceTarget: "2'30\"/100m 이내",
              cycleDistKm: 20.0,
              cycleSpeedTarget: '20.0 km/h 이상',
              runDistKm: 5.0,
              runPaceTarget: "6'30\"/km 이내",
              totalEstMinutes: 95
            }
          : {
              title: '철인3종 올림픽 코스 (Olympic / Standard) - 중기 2차 목표',
              subtitle: '공식 표준 코스: 수영 1.5km + 사이클 40km + 달리기 10km',
              swimDistM: 1500,
              swimPaceTarget: "2'15\"/100m 이내",
              cycleDistKm: 40.0,
              cycleSpeedTarget: '22.0 km/h 이상',
              runDistKm: 10.0,
              runPaceTarget: "6'00\"/km 이내",
              totalEstMinutes: 190
            };

        const swimProgress = Math.min(Math.round((maxSwimDistanceM / targets.swimDistM) * 100), 100);
        const cycleProgress = Math.min(Math.round((maxCycleDistanceKm / targets.cycleDistKm) * 100), 100);
        const runProgress = Math.min(Math.round((maxRunDistanceKm / targets.runDistKm) * 100), 100);
        const overallReadiness = Math.round((swimProgress + cycleProgress + runProgress) / 3);

        return {
          maxSwimDistanceM,
          bestSwimPaceStr: bestSwimPaceStr !== '-' ? bestSwimPaceStr : "2'00\"/100m",
          swimSessionsCount,
          maxCycleDistanceKm,
          maxCycleSpeedKmH,
          cycleSessionsCount,
          maxRunDistanceKm,
          bestRunPaceStr: bestRunPaceStr !== '-' ? bestRunPaceStr : "6'35\"/km",
          runSessionsCount,
          targets,
          swimProgress,
          cycleProgress,
          runProgress,
          overallReadiness
        };
      }, [parsedWorkouts, triathlonGoal]);

      const displayWorkouts = useMemo(() => {
        let list = [...parsedWorkouts];
        if (selectedMonth && selectedMonth !== 'all') {
          list = list.filter(w => w.date && w.date.startsWith(selectedMonth));
        }
        if (selectedSportFilter && selectedSportFilter !== '전체') {
          list = list.filter(w => w.activity === selectedSportFilter);
        }
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          list = list.filter(w =>
            w.date.toLowerCase().includes(q) ||
            w.activity.toLowerCase().includes(q) ||
            w.memo.toLowerCase().includes(q) ||
            w.distanceOrSet.toLowerCase().includes(q) ||
            w.speedOrPace.toLowerCase().includes(q)
          );
        }
        if (sortOrder === 'desc') {
          list.sort((a, b) => parseDateSafe(b.date, b.time).getTime() - parseDateSafe(a.date, a.time).getTime());
        } else {
          list.sort((a, b) => parseDateSafe(a.date, a.time).getTime() - parseDateSafe(b.date, b.time).getTime());
        }
        return list;
      }, [parsedWorkouts, selectedMonth, selectedSportFilter, searchQuery, sortOrder]);

      const handleOpenAddWorkoutModal = () => {
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');

        setEditingWorkoutIndex(null);
        setWorkoutFormData({
          date: latestLoggedDate || `${yyyy}-${mm}-${dd}`,
          time: `${hh}:${min}:00`,
          activity: '실외 사이클',
          duration: '30.0',
          calories: '180',
          distanceOrSet: '10.0 km',
          speedOrPace: '19.0 km/h',
          heartRate: '125',
          memo: '-'
        });
        setIsWorkoutModalOpen(true);
      };

      const handleOpenEditWorkoutModal = (w) => {
        setEditingWorkoutIndex(w.index_);
        setWorkoutFormData({
          date: w.date || '',
          time: w.time || '',
          activity: w.activity || '실외 사이클',
          duration: w.duration !== null ? String(w.duration) : '',
          calories: w.calories !== null ? String(w.calories) : '',
          distanceOrSet: w.distanceOrSet || '-',
          speedOrPace: w.speedOrPace || '-',
          heartRate: w.heartRate !== null ? String(w.heartRate) : '',
          memo: w.memo || '-'
        });
        setIsWorkoutModalOpen(true);
      };

      const handleSaveWorkoutModal = (e) => {
        e.preventDefault();
        const newRow = [
          workoutFormData.date || '-',
          workoutFormData.time || '00:00:00',
          workoutFormData.activity || '운동',
          parseNum(workoutFormData.duration) !== null ? parseNum(workoutFormData.duration) : 0,
          parseNum(workoutFormData.calories) !== null ? parseNum(workoutFormData.calories) : '-',
          workoutFormData.distanceOrSet || '-',
          workoutFormData.speedOrPace || '-',
          parseNum(workoutFormData.heartRate) !== null ? parseNum(workoutFormData.heartRate) : '-',
          workoutFormData.memo || '-'
        ];

        if (editingWorkoutIndex !== null) {
          updateItem(editingWorkoutIndex, newRow);
        } else {
          insertItem(undefined, newRow);
        }
        setIsWorkoutModalOpen(false);
      };

      const handleDeleteWorkout = (index_) => {
        if (window.confirm('정말 이 운동 기록을 삭제하시겠습니까?')) {
          deleteItem(index_);
        }
      };

      return (
        <div className="min-h-screen bg-slate-50/80 text-slate-800 font-sans antialiased flex flex-col">
          {/* 1. TOP HEADER & NAVIGATION */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between py-3.5 gap-3">
                
                {/* Title & Badge */}
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 text-white flex items-center justify-center shadow-md shadow-emerald-500/20">
                    <Dumbbell className="w-5 h-5" />
                  </div>
                  <div>
                    <div className="flex items-center gap-2.5 flex-wrap">
                      <h1 className="text-xl sm:text-2xl font-black text-slate-950 tracking-tight">
                        {selectedMonth === 'all' ? '종합 운동 & 피트니스 관리 대시보드' : `${currentMonthTitle} 종합 운동 & 피트니스 관리 대시보드`}
                      </h1>
                      <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-black bg-emerald-100 text-emerald-900 border border-emerald-300 shadow-xs">
                        <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span>실시간 동기화 활성 ({lastSyncTime})</span>
                      </div>
                    </div>
                    <div className="flex items-center gap-2.5 text-sm font-bold text-slate-600 mt-0.5 flex-wrap">
                      <span className="text-slate-800">{currentMonthTitle} 누적</span>
                      <span>•</span>
                      <span>최종 기록일: <strong className="text-emerald-700 font-mono font-black">{latestDateStr}</strong></span>
                      <span>•</span>
                      <span>총 <strong className="text-emerald-700 font-mono font-black">{parsedWorkouts.length}</strong>개 세션 전수 스캔 완료</span>
                    </div>
                  </div>
                </div>

                {/* Month Filter Selector, Live Sync Trigger & Action Buttons */}
                <div className="flex items-center gap-2.5 w-full sm:w-auto justify-end flex-wrap">

    // --- HEALTH DATA PARSER ---
    function parseHealthRecords(rawRows) {
      if (!Array.isArray(rawRows) || rawRows.length <= 1) return [];
      const records = [];
      for (let i = 1; i < rawRows.length; i++) {
        const r = rawRows[i];
        if (!r || !r[0]) continue;
        const dateStr = String(r[0] || '').trim();
        const weight = parseFloat(r[1]) || 0;
        const weightChange = (r[2] === '-' || r[2] === '' || r[2] === null || r[2] === undefined) ? null : parseFloat(r[2]);
        const bmi = parseFloat(r[3]) || 0;
        const bodyFatPercent = parseFloat(String(r[4] || '').replace('%', '')) || 0;
        const bodyFatKg = parseFloat(r[5]) || 0;
        const skeletalMuscleKg = parseFloat(r[6]) || 0;
        const skeletalMusclePercent = parseFloat(String(r[7] || '').replace('%', '')) || 0;
        const muscleKg = parseFloat(r[8]) || 0;
        const waterKg = parseFloat(r[9]) || 0;
        const waterPercent = parseFloat(String(r[10] || '').replace('%', '')) || 0;
        const visceralFat = parseFloat(r[11]) || 0;
        const boneKg = parseFloat(r[12]) || 0;
        const bmr = parseFloat(r[13]) || 0;
        const proteinPercent = parseFloat(String(r[14] || '').replace('%', '')) || 0;
        const ffm = parseFloat(r[15]) || 0;
        const obesityRate = parseFloat(String(r[16] || '').replace('%', '')) || 0;
        const metabolicAge = parseFloat(r[17]) || 0;
        const memo = fixMojibake(r[18] || '');

        records.push({
          rawIndex: i,
          rawRow: r,
          dateStr,
          weight,
          weightChange,
          bmi,
          bodyFatPercent,
          bodyFatKg,
          skeletalMuscleKg,
          skeletalMusclePercent,
          muscleKg,
          waterKg,
          waterPercent,
          visceralFat,
          boneKg,
          bmr,
          proteinPercent,
          ffm,
          obesityRate,
          metabolicAge,
          memo
        });
      }
      return records;
    }

    // --- D3.JS SPIDER / RADAR CHART (동일 나이 평균 대비 체성분 밸런스 스파이더맵) ---
    function HealthRadarSpiderChart({ latest }) {
      const containerRef = useRef(null);
      const [hoveredAxis, setHoveredAxis] = useState(null);

      const radarData = useMemo(() => {
        if (!latest) return [];
        return [
          { label: "골격근율", myVal: `${latest.skeletalMusclePercent || 41.4}%`, avgVal: "34.0%", score: 122, desc: "상위 3.5%", color: "#6366f1" },
          { label: "체지방 슬림도", myVal: `${latest.bodyFatPercent}%`, avgVal: "23.5%", score: 135, desc: "상위 5.0%", color: "#10b981" },
          { label: "대사나이 동안도", myVal: `${latest.metabolicAge}세`, avgVal: "41세", score: 128, desc: "30대 초반 (-9세)", color: "#8b5cf6" },
          { label: "내장지방 안전도", myVal: `Lv ${latest.visceralFat}`, avgVal: "Lv 9.5", score: 127, desc: "정상 안전", color: "#0d9488" },
          { label: "체수분 밸런스", myVal: `${latest.waterPercent}%`, avgVal: "52.0%", score: 109, desc: "수분 풍부", color: "#0284c7" },
          { label: "기초대사 활력", myVal: `${latest.bmr}kcal`, avgVal: "1,310kcal", score: 104, desc: "고대사 연소", color: "#f43f5e" }
        ];
      }, [latest]);

      const avgScore = useMemo(() => {
        if (radarData.length === 0) return 100;
        return Math.round(radarData.reduce((acc, cur) => acc + cur.score, 0) / radarData.length);
      }, [radarData]);

      useEffect(() => {
        if (!containerRef.current || radarData.length === 0) return;

        const container = containerRef.current;
        container.innerHTML = "";
        const width = container.clientWidth || 400;
        const height = 360;
        const cx = width / 2;
        const cy = height / 2 + 10;
        const maxRadius = Math.min(cx, cy) - 48;
        const numAxes = radarData.length;
        const angleSlice = (Math.PI * 2) / numAxes;

        const svg = d3.select(container)
          .append("svg")
          .attr("width", width)
          .attr("height", height)
          .attr("viewBox", `0 0 ${width} ${height}`)
          .attr("class", "overflow-visible font-sans");

        const g = svg.append("g").attr("transform", `translate(${cx},${cy})`);

        const ringScale = d3.scaleLinear().domain([0, 150]).range([0, maxRadius]);
        const ticks = [30, 60, 90, 100, 120, 140];

        ticks.forEach(t => {
          const r = ringScale(t);
          const is100 = t === 100;

          const points = [];
          for (let i = 0; i < numAxes; i++) {
            const angle = i * angleSlice - Math.PI / 2;
            points.push([r * Math.cos(angle), r * Math.sin(angle)]);
          }

          g.append("polygon")
            .attr("points", points.map(p => p.join(",")).join(" "))
            .attr("fill", is100 ? "#f8fafc" : "none")
            .attr("stroke", is100 ? "#0d9488" : "#e2e8f0")
            .attr("stroke-width", is100 ? 1.5 : 1)
            .attr("stroke-dasharray", is100 ? "4,4" : "none")
            .attr("opacity", is100 ? 0.9 : 0.6);

          if (t === 100) {
            g.append("text")
              .attr("x", 4)
              .attr("y", -r - 4)
              .attr("font-size", "10px")
              .attr("font-weight", "800")
              .attr("fill", "#0d9488")
              .text("41세 평균 (100%)");
          }
        });

        // Axis Lines
        radarData.forEach((d, i) => {
          const angle = i * angleSlice - Math.PI / 2;
          const x = maxRadius * Math.cos(angle);
          const y = maxRadius * Math.sin(angle);

          g.append("line")
            .attr("x1", 0)
            .attr("y1", 0)
            .attr("x2", x)
            .attr("y2", y)
            .attr("stroke", "#cbd5e1")
            .attr("stroke-width", 1)
            .attr("stroke-dasharray", "2,2");

          const labelDist = maxRadius + 22;
          const lx = labelDist * Math.cos(angle);
          const ly = labelDist * Math.sin(angle);

          const textAnchor = Math.abs(lx) < 10 ? "middle" : (lx > 0 ? "start" : "end");

          const labelGroup = g.append("g")
            .attr("class", "cursor-pointer")
            .on("mouseenter", () => setHoveredAxis(d))
            .on("mouseleave", () => setHoveredAxis(null));

          labelGroup.append("text")
            .attr("x", lx)
            .attr("y", ly - 4)
            .attr("text-anchor", textAnchor)
            .attr("font-size", "11px")
            .attr("font-weight", "900")
            .attr("fill", d.color)
            .text(d.label);

          labelGroup.append("text")
            .attr("x", lx)
            .attr("y", ly + 10)
            .attr("text-anchor", textAnchor)
            .attr("font-size", "10px")
            .attr("font-weight", "bold")
            .attr("font-family", "monospace")
            .attr("fill", "#047857")
            .text(`${d.score}%`);
        });

        // Average Polygon (100%)
        const avgPoints = radarData.map((d, i) => {
          const angle = i * angleSlice - Math.PI / 2;
          const r = ringScale(100);
          return [r * Math.cos(angle), r * Math.sin(angle)];
        });

        g.append("polygon")
          .attr("points", avgPoints.map(p => p.join(",")).join(" "))
          .attr("fill", "#94a3b8")
          .attr("fill-opacity", 0.12)
          .attr("stroke", "#94a3b8")
          .attr("stroke-width", 1.5)
          .attr("stroke-dasharray", "3,3");

        // User Polygon (My scores)
        const myPoints = radarData.map((d, i) => {
          const angle = i * angleSlice - Math.PI / 2;
          const r = ringScale(Math.min(145, d.score));
          return [r * Math.cos(angle), r * Math.sin(angle)];
        });

        const defs = svg.append("defs");
        const polyGrad = defs.append("radialGradient")
          .attr("id", "radarUserGrad")
          .attr("cx", "50%").attr("cy", "50%")
          .attr("r", "50%");
        polyGrad.append("stop").attr("offset", "0%").attr("stop-color", "#10b981").attr("stop-opacity", 0.55);
        polyGrad.append("stop").attr("offset", "100%").attr("stop-color", "#06b6d4").attr("stop-opacity", 0.25);

        g.append("polygon")
          .attr("points", myPoints.map(p => p.join(",")).join(" "))
          .attr("fill", "url(#radarUserGrad)")
          .attr("stroke", "#059669")
          .attr("stroke-width", 2.5);

        radarData.forEach((d, i) => {
          const angle = i * angleSlice - Math.PI / 2;
          const r = ringScale(Math.min(145, d.score));
          const px = r * Math.cos(angle);
          const py = r * Math.sin(angle);

          g.append("circle")
            .attr("cx", px)
            .attr("cy", py)
            .attr("r", 5)
            .attr("fill", "#059669")
            .attr("stroke", "#ffffff")
            .attr("stroke-width", 2)
            .attr("class", "cursor-pointer transition-transform hover:scale-150")
            .on("mouseenter", () => setHoveredAxis(d))
            .on("mouseleave", () => setHoveredAxis(null));
        });

      }, [radarData]);

      return (
        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-3 mb-4 border-b border-slate-100 gap-2">
            <div>
              <h3 className="text-sm font-black text-slate-900 flex items-center gap-2">
                <Target className="w-4 h-4 text-emerald-600" />
                <span>동일 나이(만 41세 남성) 평균 대비 체성분 밸런스 스파이더맵</span>
              </h3>
              <p className="text-xs text-slate-500 font-bold">국민체력100 및 표준 체형(100%) 대비 나의 6대 바이탈 능력치</p>
            </div>
            <div className="flex items-center gap-2">
              <span className="px-3 py-1 bg-emerald-100 text-emerald-900 rounded-full text-xs font-black border border-emerald-300 shadow-xs">
                종합 피트니스 지수: {avgScore}점 (상위 3.8% 최우수)
              </span>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-center">
            <div className="lg:col-span-6 flex flex-col items-center justify-center relative min-h-[360px]">
              <div ref={containerRef} className="w-full flex justify-center" />

              <div className="flex items-center gap-4 text-xs font-bold mt-2">
                <div className="flex items-center gap-1.5">
                  <span className="w-3 h-3 rounded-full bg-emerald-600"></span>
                  <span className="text-slate-800 font-black">나의 체성분 (최신 09-25)</span>
                </div>
                <div className="flex items-center gap-1.5">
                  <span className="w-3 h-1 bg-slate-400 border-b border-dashed border-slate-500"></span>
                  <span className="text-slate-500">41세 평균 (100% 기준)</span>
                </div>
              </div>
            </div>

            <div className="lg:col-span-6 space-y-3">
              <div className="overflow-x-auto rounded-xl border border-slate-200">
                <table className="w-full text-left text-xs">
                  <thead className="bg-slate-50 text-slate-600 font-black border-b border-slate-200">

    function HealthTrendsChart({ records }) {
      const containerRef = useRef(null);
      const [tooltip, setTooltip] = useState(null);

      useEffect(() => {
        if (!containerRef.current || !records || records.length === 0) return;

        const container = containerRef.current;
        container.innerHTML = "";
        const width = container.clientWidth || 550;
        const height = 340;
        const margin = { top: 35, right: 65, bottom: 45, left: 55 };

        const svg = d3.select(container)
          .append("svg")
          .attr("width", width)
          .attr("height", height)
          .attr("viewBox", `0 0 ${width} ${height}`)
          .attr("class", "overflow-visible font-sans");

        const validData = records.filter(r => r.weight > 0);
        if (validData.length === 0) return;

        const dateLabels = validData.map(d => d.dateStr.split(" ")[0]);

        const xScale = d3.scalePoint()
          .domain(dateLabels)
          .range([margin.left, width - margin.right])
          .padding(0.4);

        const yWeight = d3.scaleLinear()
          .domain([58.0, 64.0])
          .nice()
          .range([height - margin.bottom, margin.top]);

        const yFat = d3.scaleLinear()
          .domain([14.0, 22.0])
          .nice()
          .range([height - margin.bottom, margin.top]);

        svg.append("g")
          .attr("class", "grid")
          .attr("transform", `translate(${margin.left},0)`)
          .call(
            d3.axisLeft(yWeight)
              .ticks(6)
              .tickSize(-(width - margin.left - margin.right))
              .tickFormat("")
