            {activeTab === 'trends' && (
              <div className="space-y-6">
                <div className="bg-white rounded-2xl p-5 sm:p-6 border border-slate-200/80 shadow-xs">
                  <div className="flex items-center justify-between mb-4">
                    <div>
                      <h2 className="text-base sm:text-lg font-black text-slate-950 flex items-center gap-2">
                        <BarChart3 className="w-5 h-5 text-emerald-600 stroke-[2.5]" />
                        일자별 총 운동 시간(분) 및 칼로리 추이
                      </h2>
                      <p className="text-xs sm:text-sm font-bold text-slate-500 mt-1">
                        {currentMonthTitle} 일자별 트레이닝 부하 및 세션 누적 지속 시간 변화
                      </p>
                    </div>
                  </div>
                  <div className="py-2">
                    <D3DailyVolumeChart workouts={monthFilteredWorkouts} height={280} />
                  </div>
                </div>

                <div className="bg-white rounded-2xl p-5 sm:p-6 border border-slate-200 shadow-sm">
                  <div className="flex items-center justify-between mb-4">
                    <div>
                      <h3 className="text-base sm:text-lg font-black text-slate-950 flex items-center gap-2">
                        <HeartPulse className="w-5 h-5 text-rose-500 stroke-[2.5]" />
                        세션별 평균 심박수(bpm) 모니터링
                      </h3>
                      <p className="text-xs sm:text-sm font-bold text-slate-500 mt-1">측정된 운동 세션의 심박 반응 및 유산소/고강도 구간</p>
                    </div>
                  </div>
                  <div className="py-2">
                    <D3HeartRateDistribution records={monthFilteredWorkouts} height={240} />
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* 3. MODAL: ADD / EDIT WORKOUT LOG */}
          {isWorkoutModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs overflow-y-auto">
              <div className="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 border border-slate-100 my-8">
                <div className="flex items-center justify-between border-b border-slate-100 pb-4 mb-5">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center">
                      <Dumbbell className="w-4 h-4" />
                    </div>
                    <div>
                      <h3 className="text-lg font-black text-slate-950">
                        {editingWorkoutIndex !== null ? '운동 기록 수정' : '신규 운동 기록 등록'}
                      </h3>
                      <p className="text-xs sm:text-sm font-bold text-slate-500">운동 세부 정보를 입력하면 스프레드시트에 즉시 동기화됩니다.</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setIsWorkoutModalOpen(false)}
                    className="p-2 text-slate-500 hover:text-slate-800 rounded-lg cursor-pointer"
                  >
                    <X className="w-5 h-5 stroke-[2.5]" />
                  </button>
                </div>

                <form onSubmit={handleSaveWorkoutModal} className="space-y-4">
                  <div className="grid grid-cols-2 gap-3.5">
                    <div>
                      <label className="block text-sm font-bold text-slate-800 mb-1.5">
                        운동 일자 (YYYY-MM-DD) *
                      </label>
                      <input
                        type="date"
                        required
                        value={workoutFormData.date}
                        onChange={(e) => setWorkoutFormData({ ...workoutFormData, date: e.target.value })}
                        className="w-full px-3.5 py-2.5 text-sm font-semibold text-slate-900 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-slate-800 mb-1.5">
                        시작 시간 (HH:MM:SS)
                      </label>
                      <input
                        type="text"
                        value={workoutFormData.time}
                        onChange={(e) => setWorkoutFormData({ ...workoutFormData, time: e.target.value })}
                        placeholder="06:30:00"
                        className="w-full px-3.5 py-2.5 text-sm font-semibold text-slate-900 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3.5">
                    <div>
                      <label className="block text-sm font-bold text-slate-800 mb-1.5">
                        운동 종목 *
                      </label>
                      <input
                        type="text"
                        required
                        value={workoutFormData.activity}
                        onChange={(e) => setWorkoutFormData({ ...workoutFormData, activity: e.target.value })}
                        placeholder="실외 사이클, 실외 달리기 등"
                        className="w-full px-3.5 py-2.5 text-sm font-semibold text-slate-900 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-slate-800 mb-1.5">
                        운동 시간 (분) *
                      </label>
                      <input
                        type="number"
                        step="0.1"
                        required
                        value={workoutFormData.duration}
                        onChange={(e) => setWorkoutFormData({ ...workoutFormData, duration: e.target.value })}
                        placeholder="25.0"
                        className="w-full px-3.5 py-2.5 text-sm font-semibold text-slate-900 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none font-mono"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3.5">
                    <div>
                      <label className="block text-sm font-bold text-slate-800 mb-1.5">
                        거리 / 세트 / 횟수
                      </label>
                      <input
                        type="text"
                        value={workoutFormData.distanceOrSet}
                        onChange={(e) => setWorkoutFormData({ ...workoutFormData, distanceOrSet: e.target.value })}
                        placeholder="예: 5.67 km, 3세트, 300 m"
                        className="w-full px-3.5 py-2.5 text-sm font-semibold text-slate-900 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-slate-800 mb-1.5">
                        속도 / 페이스
                      </label>
                      <input
                        type="text"
                        value={workoutFormData.speedOrPace}
                        onChange={(e) => setWorkoutFormData({ ...workoutFormData, speedOrPace: e.target.value })}
                        placeholder={'예: 18.53 km/h, 7\'21"/km'}
                        className="w-full px-3.5 py-2.5 text-sm font-semibold text-slate-900 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3.5">
                    <div>
                      <label className="block text-sm font-bold text-slate-800 mb-1.5">
                        소모 칼로리 (kcal)
                      </label>
                      <input
                        type="number"
                        step="1"
                        value={workoutFormData.calories}
                        onChange={(e) => setWorkoutFormData({ ...workoutFormData, calories: e.target.value })}
                        placeholder="180"
                        className="w-full px-3.5 py-2.5 text-sm font-semibold text-slate-900 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none font-mono"
                      />
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-slate-800 mb-1.5">
                        평균 심박수 (bpm)
                      </label>
                      <input
                        type="number"
                        step="1"
                        value={workoutFormData.heartRate}
                        onChange={(e) => setWorkoutFormData({ ...workoutFormData, heartRate: e.target.value })}
                        placeholder="125"
                        className="w-full px-3.5 py-2.5 text-sm font-semibold text-slate-900 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none font-mono"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-sm font-bold text-slate-800 mb-1.5">
                      메모 및 특이사항
                    </label>
                    <input
                      type="text"
                      value={workoutFormData.memo}
                      onChange={(e) => setWorkoutFormData({ ...workoutFormData, memo: e.target.value })}
                      placeholder="예: 아침 공복 유산소, 시원한 날씨"
                      className="w-full px-3.5 py-2.5 text-sm font-semibold text-slate-900 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                    />
                  </div>

                  <div className="flex items-center justify-end gap-3 pt-5 border-t border-slate-200">
                    <button
                      type="button"
                      onClick={() => setIsWorkoutModalOpen(false)}
                      className="px-4.5 py-2.5 text-sm font-bold text-slate-700 hover:bg-slate-100 rounded-xl transition-colors cursor-pointer"
                    >
                      취소
                    </button>
                    <button
                      type="submit"
                      className="px-6 py-2.5 text-sm sm:text-base font-black text-white bg-emerald-600 hover:bg-emerald-700 active:scale-98 rounded-xl shadow-md transition-all cursor-pointer"
                    >
                      {editingWorkoutIndex !== null ? '변경사항 저장' : '새 운동 기록 저장'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- HEALTH DATA PARSER ---
    function parseHealthRecords(rawRows) {
      if (!Array.isArray(rawRows) || rawRows.length <= 1) return [];
      const records = [];
      for (let i = 1; i < rawRows.length; i++) {
        const r = rawRows[i];
        if (!r || !r[0]) continue;
        const dateStr = String(r[0] || '').trim();
        const weight = parseFloat(r[1]) || 0;
        const weightChange = (r[2] === '-' || r[2] === '' || r[2] === null || r[2] === undefined) ? null : parseFloat(r[2]);
        const bmi = parseFloat(r[3]) || 0;
        const bodyFatPercent = parseFloat(String(r[4] || '').replace('%', '')) || 0;
        const bodyFatKg = parseFloat(r[5]) || 0;
        const skeletalMuscleKg = parseFloat(r[6]) || 0;
        const skeletalMusclePercent = parseFloat(String(r[7] || '').replace('%', '')) || 0;
        const muscleKg = parseFloat(r[8]) || 0;
        const waterKg = parseFloat(r[9]) || 0;
        const waterPercent = parseFloat(String(r[10] || '').replace('%', '')) || 0;
        const visceralFat = parseFloat(r[11]) || 0;
        const boneKg = parseFloat(r[12]) || 0;
        const bmr = parseFloat(r[13]) || 0;
        const proteinPercent = parseFloat(String(r[14] || '').replace('%', '')) || 0;
        const ffm = parseFloat(r[15]) || 0;
        const obesityRate = parseFloat(String(r[16] || '').replace('%', '')) || 0;
        const metabolicAge = parseFloat(r[17]) || 0;
        const memo = fixMojibake(r[18] || '');

        records.push({
          rawIndex: i,
          rawRow: r,
          dateStr,
          weight,
          weightChange,
          bmi,
          bodyFatPercent,
          bodyFatKg,
          skeletalMuscleKg,
          skeletalMusclePercent,
          muscleKg,
          waterKg,
          waterPercent,
          visceralFat,
          boneKg,
          bmr,
          proteinPercent,
          ffm,
          obesityRate,
          metabolicAge,
          memo
        });
      }
      return records;
    }

    // --- D3.JS INTERACTIVE HEALTH TRENDS CHART ---
    function HealthTrendsChart({ records }) {
      const containerRef = useRef(null);
      const [tooltip, setTooltip] = useState(null);

      useEffect(() => {
        if (!containerRef.current || !records || records.length === 0) return;

        const container = containerRef.current;
        container.innerHTML = "";
        const width = container.clientWidth || 800;
        const height = 340;
        const margin = { top: 35, right: 65, bottom: 45, left: 55 };

        const svg = d3.select(container)
          .append("svg")
          .attr("width", width)
          .attr("height", height)
          .attr("viewBox", `0 0 ${width} ${height}`)
          .attr("class", "overflow-visible font-sans");

        const validData = records.filter(r => r.weight > 0);
        if (validData.length === 0) return;

        const dateLabels = validData.map(d => d.dateStr.split(" ")[0]);

        const xScale = d3.scalePoint()
          .domain(dateLabels)
          .range([margin.left, width - margin.right])
          .padding(0.4);

        const yWeight = d3.scaleLinear()
          .domain([58.0, 64.0])
          .nice()
          .range([height - margin.bottom, margin.top]);

        const yFat = d3.scaleLinear()
          .domain([14.0, 22.0])
          .nice()
          .range([height - margin.bottom, margin.top]);

        svg.append("g")
          .attr("class", "grid")
          .attr("transform", `translate(${margin.left},0)`)
          .call(
            d3.axisLeft(yWeight)
              .ticks(6)
              .tickSize(-(width - margin.left - margin.right))
              .tickFormat("")
          )
          .call(g => g.select(".domain").remove())
          .call(g => g.selectAll(".tick line").attr("stroke", "#f1f5f9").attr("stroke-dasharray", "3,3"));

        const bandTop = yWeight(61.5);
        const bandBottom = yWeight(60.5);
        svg.append("rect")
          .attr("x", margin.left)
          .attr("y", bandTop)
          .attr("width", width - margin.left - margin.right)
          .attr("height", bandBottom - bandTop)
          .attr("fill", "#10b981")
          .attr("fill-opacity", 0.08);

        svg.append("text")
          .attr("x", width - margin.right - 10)
          .attr("y", bandTop + 14)
          .attr("text-anchor", "end")
          .attr("font-size", "11px")
          .attr("font-weight", "800")
          .attr("fill", "#059669")
          .text("최적 레이스 체중존 (60.5 ~ 61.5kg)");

        svg.append("g")
          .attr("transform", `translate(${margin.left},0)`)
          .call(d3.axisLeft(yWeight).ticks(6).tickFormat(d => `${d}kg`))
          .call(g => g.select(".domain").attr("stroke", "#cbd5e1"))
          .call(g => g.selectAll(".tick text").attr("fill", "#047857").attr("font-weight", "bold").attr("font-size", "11px"));

        svg.append("g")
          .attr("transform", `translate(${width - margin.right},0)`)
          .call(d3.axisRight(yFat).ticks(5).tickFormat(d => `${d}%`))
          .call(g => g.select(".domain").attr("stroke", "#cbd5e1"))
          .call(g => g.selectAll(".tick text").attr("fill", "#d97706").attr("font-weight", "bold").attr("font-size", "11px"));

        svg.append("g")
          .attr("transform", `translate(0,${height - margin.bottom})`)
          .call(d3.axisBottom(xScale))
          .call(g => g.select(".domain").attr("stroke", "#cbd5e1"))
          .call(g => g.selectAll(".tick text").attr("fill", "#475569").attr("font-weight", "bold").attr("font-size", "11px"));

        const defs = svg.append("defs");
        const weightGradient = defs.append("linearGradient")
          .attr("id", "healthWeightGrad")
          .attr("x1", "0%").attr("y1", "0%")
          .attr("x2", "0%").attr("y2", "100%");
        weightGradient.append("stop").attr("offset", "0%").attr("stop-color", "#10b981").attr("stop-opacity", 0.35);
        weightGradient.append("stop").attr("offset", "100%").attr("stop-color", "#10b981").attr("stop-opacity", 0.0);

        const weightArea = d3.area()
          .x(d => xScale(d.dateStr.split(" ")[0]))
          .y0(height - margin.bottom)
          .y1(d => yWeight(d.weight))
          .curve(d3.curveMonotoneX);

        svg.append("path")
          .datum(validData)
          .attr("fill", "url(#healthWeightGrad)")
          .attr("d", weightArea);

        const weightLine = d3.line()
          .x(d => xScale(d.dateStr.split(" ")[0]))
          .y(d => yWeight(d.weight))
          .curve(d3.curveMonotoneX);

        svg.append("path")
          .datum(validData)
          .attr("fill", "none")
          .attr("stroke", "#059669")
          .attr("stroke-width", 3)
          .attr("d", weightLine);

        const fatData = validData.filter(d => d.bodyFatPercent > 0);
        if (fatData.length > 0) {
          const fatLine = d3.line()
            .x(d => xScale(d.dateStr.split(" ")[0]))
            .y(d => yFat(d.bodyFatPercent))
            .curve(d3.curveMonotoneX);

          svg.append("path")
            .datum(fatData)
            .attr("fill", "none")
            .attr("stroke", "#d97706")
            .attr("stroke-width", 2.5)
            .attr("stroke-dasharray", "4,3")
            .attr("d", fatLine);
        }

        svg.selectAll(".circle-weight")
          .data(validData)
          .enter()
          .append("circle")
          .attr("cx", d => xScale(d.dateStr.split(" ")[0]))
          .attr("cy", d => yWeight(d.weight))
          .attr("r", 5)
          .attr("fill", "#059669")
          .attr("stroke", "#ffffff")
          .attr("stroke-width", 2)
          .attr("class", "cursor-pointer transition-transform hover:scale-125")
          .on("mouseenter", (e, d) => {
            const rect = container.getBoundingClientRect();
            setTooltip({
              x: e.clientX - rect.left,
              y: e.clientY - rect.top,
              data: d
            });
          })
          .on("mouseleave", () => setTooltip(null));

        svg.selectAll(".circle-fat")
          .data(fatData)
          .enter()
          .append("circle")
          .attr("cx", d => xScale(d.dateStr.split(" ")[0]))
          .attr("cy", d => yFat(d.bodyFatPercent))
          .attr("r", 4)
          .attr("fill", "#d97706")
          .attr("stroke", "#ffffff")
          .attr("stroke-width", 2)
          .attr("class", "cursor-pointer transition-transform hover:scale-125")
          .on("mouseenter", (e, d) => {
            const rect = container.getBoundingClientRect();
            setTooltip({
              x: e.clientX - rect.left,
              y: e.clientY - rect.top,
              data: d
            });
          })
          .on("mouseleave", () => setTooltip(null));

      }, [records]);

      return (
        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs relative">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-3 mb-2 border-b border-slate-100 gap-2">
            <div>
              <h3 className="text-sm font-black text-slate-900 flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                체성분 다차원 시계열 추이 (체중 vs 체지방률)
              </h3>
              <p className="text-xs text-slate-500 font-bold">측정 일자별 레이스 체중 진입과 체지방 감량 곡선</p>
            </div>
            <div className="flex items-center gap-4 text-xs font-bold">
              <div className="flex items-center gap-1.5">
                <span className="w-3 h-3 rounded-full bg-emerald-600"></span>
                <span className="text-slate-700">체중 (kg)</span>
              </div>
              <div className="flex items-center gap-1.5">
                <span className="w-3 h-1 bg-amber-500 border-b border-dashed border-amber-600"></span>
                <span className="text-slate-700">체지방률 (%)</span>
              </div>
              <div className="flex items-center gap-1.5">
                <span className="w-3 h-2 bg-emerald-200/80 rounded-xs"></span>
                <span className="text-emerald-800 text-[11px]">레이스 체중존</span>
              </div>
            </div>
          </div>

          <div ref={containerRef} className="w-full relative min-h-[340px]" />

          {tooltip && (
            <div
              className="absolute z-30 bg-slate-950/95 text-white p-3 rounded-xl shadow-xl pointer-events-none text-xs border border-slate-800 transform -translate-x-1/2 -translate-y-full mb-3 min-w-[210px]"
              style={{ left: `${tooltip.x}px`, top: `${tooltip.y}px` }}
            >
              <div className="font-mono font-black text-emerald-400 border-b border-slate-800 pb-1 mb-1.5 flex items-center justify-between">
                <span>{tooltip.data.dateStr}</span>
                <span className="text-[10px] text-slate-400">인바디 기록</span>
              </div>
              <div className="space-y-1 font-mono">
                <div className="flex justify-between">
                  <span className="text-slate-400">체중:</span>
                  <span className="font-bold text-white">{tooltip.data.weight} kg</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-slate-400">체지방률:</span>
                  <span className="font-bold text-amber-400">{tooltip.data.bodyFatPercent}% ({tooltip.data.bodyFatKg}kg)</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-slate-400">골격근량:</span>

              {tooltip.data.memo && (

                  {tooltip.data.memo}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function HealthLogModal({ isOpen, onClose, initialData, onSave }) {
      if (!isOpen) return null;

      const [formData, setFormData] = useState({
        date: initialData?.dateStr?.split(' ')[0] || new Date().toISOString().split('T')[0],
        time: initialData?.dateStr?.split(' ')[1] || '06:30',
        weight: initialData?.weight || '',
        weightChange: initialData?.weightChange ?? '',
        bmi: initialData?.bmi || '',
        bodyFatPercent: initialData?.bodyFatPercent || '',
        bodyFatKg: initialData?.bodyFatKg || '',
        skeletalMuscleKg: initialData?.skeletalMuscleKg || '',
        skeletalMusclePercent: initialData?.skeletalMusclePercent || '',
        visceralFat: initialData?.visceralFat || '',

        waterPercent: initialData?.waterPercent || '',
        waterKg: initialData?.waterKg || '',
        muscleKg: initialData?.muscleKg || '',
        boneKg: initialData?.boneKg || '',
        proteinPercent: initialData?.proteinPercent || '',
        ffm: initialData?.ffm || '',
        obesityRate: initialData?.obesityRate || '',
        memo: initialData?.memo || ''
      });

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => {
          const updated = { ...prev, [name]: value };
          if (name === 'weight' && value) {
            const w = parseFloat(value);
            if (w > 0) {
              updated.bmi = (w / (1.68 * 1.68)).toFixed(1);
            }
          }
          return updated;
        });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const dateStr = `${formData.date} ${formData.time}`.trim();
        const row = [
          dateStr,
          formData.weight,
          formData.weightChange || '-',
          formData.bmi || '-',
          formData.bodyFatPercent ? `${formData.bodyFatPercent}%` : '-',
          formData.bodyFatKg || '-',
          formData.skeletalMuscleKg || '-',
          formData.skeletalMusclePercent ? `${formData.skeletalMusclePercent}%` : '-',
          formData.muscleKg || '-',
          formData.waterKg || '-',
          formData.waterPercent ? `${formData.waterPercent}%` : '-',
          formData.visceralFat || '-',
          formData.boneKg || '-',
          formData.bmr || '-',
          formData.proteinPercent ? `${formData.proteinPercent}%` : '-',
          formData.ffm || '-',
          formData.obesityRate ? `${formData.obesityRate}%` : '-',
          formData.metabolicAge || '-',
          formData.memo || ''

        onSave(row, initialData?.rawIndex);

                <div>

              <div className="grid grid-cols-3 gap-3">

                      <div className={`p-1.5 rounded-lg ${isActive ? 'bg-white/20' : 'bg-slate-800 text-slate-400'}`}>
                        <Icon className="w-4 h-4" />
                      </div>
                      {!isCollapsed && (
                        <div className="min-w-0">
                          <div className="font-black text-xs truncate leading-tight">{item.label}</div>
                          <div className={`text-[10px] truncate ${isActive ? 'text-white/80' : 'text-slate-400'}`}>
                            {item.desc}
                          </div>
                        </div>
                      )}
                    </div>
                    {!isCollapsed && (
                      <span className={`text-[10px] font-black font-mono px-2 py-0.5 rounded-full border ${item.badgeColor}`}>
                        {item.badge}
                      </span>
                    )}
                  </button>
                );
              })}
            </div>
          </div>

          {/* Sidebar Footer */}
          <div className="pt-4 border-t border-slate-800 space-y-2">
            {!isCollapsed && (
              <div className="p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-[11px] space-y-1.5">
                <div className="flex items-center justify-between">
                  <span className="text-slate-400 font-medium">구글 시트 연동</span>
                  <span className="inline-flex items-center gap-1 text-emerald-400 font-black">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    {isLiveConnected ? '실시간 ON' : '정적 최신'}
                  </span>
                </div>
                <div className="text-[10px] text-slate-400 font-mono truncate">
                  최근 동기화: {lastSyncTime || '방금 전'}
                </div>
              </div>
            )}

            <button
              onClick={onManualSync}
              disabled={isSyncing}
              className={`w-full p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold flex items-center justify-center gap-2 cursor-pointer disabled:opacity-60 transition-colors`}
              title="데이터 동기화 새로고침"
            >
              <RefreshCw className={`w-3.5 h-3.5 text-emerald-400 ${isSyncing ? 'animate-spin' : ''}`} />
              {!isCollapsed && <span>{isSyncing ? '동기화 중...' : '데이터 새로고침'}</span>}
            </button>

            <a
              href="https://docs.google.com/spreadsheets/d/1prXk269ik5JTbghA5UZbh3uW56pMrzGhqnNtkrm3YKw/edit?usp=sharing"
              target="_blank"
              rel="noopener noreferrer"
              className="w-full p-2 rounded-xl bg-emerald-950/60 hover:bg-emerald-900/60 border border-emerald-800/40 text-emerald-300 text-[11px] font-bold flex items-center justify-center gap-1.5 cursor-pointer"
            >
              <FileSpreadsheet className="w-3.5 h-3.5" />
              {!isCollapsed && <span>구글 시트 원본</span>}
              <ArrowUpRight className="w-3 h-3 text-emerald-400" />
            </a>
          </div>
        </div>
      );

      return (
        <>
          {/* Desktop Left Sidebar */}
          <aside className={`transition-all duration-300 shrink-0 sticky top-0 h-screen z-40 bg-slate-950 text-slate-100 flex flex-col border-r border-slate-800 shadow-xl hidden md:flex ${
            isCollapsed ? 'w-20' : 'w-64'
          }`}>
            {renderContent()}
          </aside>

          {/* Mobile Drawer Overlay */}
          {isMobileOpen && (
            <div className="fixed inset-0 z-50 md:hidden flex">
              <div className="fixed inset-0 bg-black/60 backdrop-blur-xs" onClick={onCloseMobile} />
              <aside className="relative w-64 bg-slate-950 text-slate-100 flex flex-col h-full z-10 shadow-2xl">
                {renderContent()}
              </aside>
            </div>
          )}
        </>
      );
    }



    // --- DASHBOARD CONTAINER COMPONENT (WRAPPER) ---
    function DashboardContainer() {
      const [currentSection, setCurrentSection] = useState('workout'); // 'workout' | 'health'
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(false);
      const [isMobileSidebarOpen, setIsMobileSidebarOpen] = useState(false);

      // Workout Data State
      const [data, setData] = useState(() => {
        try {
          const saved = localStorage.getItem('workout_dashboard_data');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length >= INITIAL_REAL_DATA.length) {
              return parsed;
            }
          }
        } catch (e) {}
        return INITIAL_REAL_DATA;
      });

      // Health Data State
      const [healthData, setHealthData] = useState(() => {
        try {
          const saved = localStorage.getItem('health_dashboard_data');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length >= INITIAL_HEALTH_DATA.length) {
              return parsed;
            }
          }
        } catch (e) {}
        return INITIAL_HEALTH_DATA;
      });

      const [isServerLive, setIsServerLive] = useState(false);
      const [lastSyncTime, setLastSyncTime] = useState('');
      const [isSyncing, setIsSyncing] = useState(false);
      const [syncNotice, setSyncNotice] = useState('');

      const persistData = (newData) => {
        setData(newData);
        try {
          localStorage.setItem('workout_dashboard_data', JSON.stringify(newData));
        } catch (e) {}
      };

      const persistHealthData = (newData) => {
        setHealthData(newData);
        try {
          localStorage.setItem('health_dashboard_data', JSON.stringify(newData));
        } catch (e) {}
      };

      const sendUpdateToServer = async (newData) => {
        if (!isServerLive) return;
        try {
          await fetch('/api/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newData)
          });
        } catch (e) {
          console.warn('[Sync] Failed to post update to server:', e);
        }
      };

      const fetchServerData = async (force = false) => {
        setIsSyncing(true);
        try {
          const url = force ? '/api/sync' : '/api/data';
          const method = force ? 'POST' : 'GET';
          const res = await fetch(url, {
            method,
            headers: { 'Cache-Control': 'no-cache' }
          });

          if (res.ok) {
            const jsonRes = await res.json();
            if (jsonRes.data && Array.isArray(jsonRes.data) && jsonRes.data.length > 0) {
              persistData(jsonRes.data);
            }
            if (jsonRes.health_data && Array.isArray(jsonRes.health_data) && jsonRes.health_data.length > 0) {
              persistHealthData(jsonRes.health_data);
            }
            setIsServerLive(true);
            setLastSyncTime(jsonRes.synced_at || new Date().toLocaleTimeString('ko-KR'));
            if (force) {
              setSyncNotice('구글 시트 최신 운동 & 건강 데이터 동기화 완료!');
              setTimeout(() => setSyncNotice(''), 3000);
            }
            return;
          }
        } catch (e) {
          // Local sync server unavailable; fallback to static JSON files
        }

        // Static hosting fallback (e.g. GitHub Pages)
        let didFetchStatic = false;
        try {
          const staticRes = await fetch('./workout_data.json?t=' + Date.now());
          if (staticRes.ok) {
            const staticJson = await staticRes.json();
            if (Array.isArray(staticJson) && staticJson.length > 0) {
              persistData(staticJson);
              didFetchStatic = true;
            }
          }
        } catch (err) {}

        try {
          const healthRes = await fetch('./health_data.json?t=' + Date.now());
          if (healthRes.ok) {
            const healthJson = await healthRes.json();
            if (Array.isArray(healthJson) && healthJson.length > 0) {
              persistHealthData(healthJson);
              didFetchStatic = true;
            }
          }
        } catch (err) {}

        if (didFetchStatic) {
          setIsServerLive(true);
          setLastSyncTime('정적 배포 동기화 완료');
          if (force) {
            setSyncNotice('최신 배포 데이터 동기화 완료!');
            setTimeout(() => setSyncNotice(''), 3000);
          }
          return;
        }

        setIsServerLive(false);
        setIsSyncing(false);
      };

      useEffect(() => {
        fetchServerData(false);
        const interval = setInterval(() => {
          fetchServerData(false);
        }, 15000);
        return () => clearInterval(interval);
      }, []);

      const updateItem = (index_, newRow) => {
        const updated = data.map(item => {
          if (item.index_ === index_) {
            return { ...item, row: newRow };
          }
          return item;
        });
        persistData(updated);
        sendUpdateToServer(updated);
      };

      const deleteItem = (index_) => {
        const updated = data.filter(item => item.index_ !== index_);
        persistData(updated);
        sendUpdateToServer(updated);
      };

      const insertItem = (targetIndex, newRow) => {
        const maxIndex = data.reduce((max, it) => Math.max(max, it.index_ || 0), 0);
        const newItem = {
          index_: maxIndex + 1,
          row: newRow
        };
        const updated = [...data, newItem];
        persistData(updated);
        sendUpdateToServer(updated);
      };

      const moveItem = (fromIndex, toIndex) => {
        const copy = [...data];
        const [removed] = copy.splice(fromIndex, 1);
        copy.splice(toIndex, 0, removed);
        persistData(copy);
        sendUpdateToServer(copy);
      };

      const followLink = (url) => {
        window.open(url, '_blank');
      };

      const handleResetData = () => {
        if (confirm('구글 시트의 원본 데이터로 초기화하시겠습니까? 로컬에서 수정한 내용은 리셋됩니다.')) {
          localStorage.removeItem('workout_dashboard_data');
          localStorage.removeItem('health_dashboard_data');
          persistData(INITIAL_REAL_DATA);
          persistHealthData(INITIAL_HEALTH_DATA);
          fetchServerData(true);
        }
      };

      const workoutCount = Math.max(0, data.length - 1);
      const latestHealthRow = Array.isArray(healthData) && healthData.length > 1 ? healthData[healthData.length - 1] : null;
      const latestWeight = latestHealthRow ? latestHealthRow[1] : '60.85';
      const latestDate = latestHealthRow ? latestHealthRow[0] : '2026-09-25';

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col md:flex-row relative font-sans">
          {/* Notification Toast */}
          {syncNotice && (
            <div className="fixed top-4 right-4 z-50 bg-emerald-600 text-white text-xs font-black px-4 py-2.5 rounded-xl shadow-lg flex items-center gap-2 animate-bounce">
              <CheckCircle2 className="w-4 h-4" />
              <span>{syncNotice}</span>
            </div>
          )}

          {/* Left Sidebar Navigation */}
          <SidebarNavigation
            currentSection={currentSection}
            onChangeSection={setCurrentSection}
            workoutCount={workoutCount}
            latestWeight={latestWeight}
            latestDate={latestDate}
            isLiveConnected={isServerLive}
            lastSyncTime={lastSyncTime}
            isSyncing={isSyncing}
            onManualSync={() => fetchServerData(true)}
            isCollapsed={isSidebarCollapsed}
            onToggleCollapse={() => setIsSidebarCollapsed(!isSidebarCollapsed)}
            isMobileOpen={isMobileSidebarOpen}
            onCloseMobile={() => setIsMobileSidebarOpen(false)}
          />

          {/* Main Content Area */}
          <div className="flex-1 min-w-0 flex flex-col">
            {/* Top Bar for Mobile */}
            <div className="md:hidden sticky top-0 z-30 bg-slate-950 text-white px-4 py-3 flex items-center justify-between border-b border-slate-800 shadow-sm">
              <div className="flex items-center gap-2.5">
                <button
                  onClick={() => setIsMobileSidebarOpen(true)}
                  className="p-2 rounded-xl bg-slate-800 text-slate-200 hover:text-white cursor-pointer"
                >
                  <Menu className="w-4 h-4" />
                </button>
                <div className="flex items-center gap-2">
                  <span className="font-black text-xs text-white">
                    {currentSection === 'workout' ? '🏃 운동 관리' : '🩺 건강 종합관리'}
                  </span>
                  <span className="text-[10px] font-bold text-slate-400">
                    {currentSection === 'workout' ? `(${workoutCount}회)` : `(${latestWeight}kg)`}
                  </span>
                </div>
              </div>

              <div className="flex items-center gap-1.5">
                <button
                  onClick={() => fetchServerData(true)}
                  disabled={isSyncing}
                  className="p-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white cursor-pointer disabled:opacity-60"
                  title="새로고침"
                >
                  <RefreshCw className={`w-3.5 h-3.5 text-emerald-400 ${isSyncing ? 'animate-spin' : ''}`} />
                </button>
              </div>
            </div>

            {/* Active Section View */}
            {currentSection === 'workout' ? (
              <App
                data={data}
                updateItem={updateItem}
                deleteItem={deleteItem}
                insertItem={insertItem}
                moveItem={moveItem}
                followLink={followLink}
                onManualSync={() => fetchServerData(true)}
                isLiveConnected={isServerLive}
                lastServerSyncTime={lastSyncTime}
                isSyncing={isSyncing}
                syncNotice={syncNotice}
              />
            ) : (
              <HealthDashboardView
                healthData={healthData}
                onUpdateHealthData={persistHealthData}
                onManualSync={() => fetchServerData(true)}
                isLiveConnected={isServerLive}
                lastServerSyncTime={lastSyncTime}
                isSyncing={isSyncing}
              />
            )}
          </div>

          {/* Floating Helper Toolbar */}
          <div className="fixed bottom-4 right-4 z-40 flex items-center gap-2 bg-white/95 backdrop-blur-md p-2 rounded-2xl shadow-xl border border-slate-300 text-xs font-bold">
            <button
              onClick={() => setCurrentSection(currentSection === 'workout' ? 'health' : 'workout')}
              className="px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white transition-colors flex items-center gap-1.5 cursor-pointer font-black shadow-xs"
              title="대시보드 전환"
            >
              {currentSection === 'workout' ? (
                <>
                  <Heart className="w-3.5 h-3.5 text-rose-400" />
                  <span>건강관리로 전환</span>
                </>
              ) : (
                <>
                  <Dumbbell className="w-3.5 h-3.5 text-emerald-400" />
                  <span>운동관리로 전환</span>
                </>
              )}
            </button>
            <span className="text-slate-300">|</span>
            <button
              onClick={() => fetchServerData(true)}
              disabled={isSyncing}
              className="px-3 py-1.5 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-800 border border-indigo-200 transition-colors flex items-center gap-1.5 cursor-pointer disabled:opacity-60 font-black"
              title="구글 시트 즉시 동기화"
            >
              <RefreshCw className={`w-3.5 h-3.5 text-indigo-600 ${isSyncing ? 'animate-spin' : ''}`} />
              <span>{isSyncing ? '동기화 중...' : '시트 동기화'}</span>
            </button>
            <span className="text-slate-300">|</span>
            <button
              onClick={handleResetData}
              className="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors flex items-center gap-1 cursor-pointer"
              title="원본 데이터로 리셋"
            >
              <RotateCcw className="w-3.5 h-3.5 text-slate-500" />
              <span>초기화</span>
            </button>
            <span className="text-slate-300">|</span>
            <span className="text-emerald-800 font-black px-2 py-1 bg-emerald-50 rounded-lg flex items-center gap-1 border border-emerald-200">
              <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              {isServerLive ? '구글시트 실시간 연동 ON' : '로컬 모드'}
            </span>
          </div>
        </div>
      );
    }


        const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DashboardContainer />);
  </script>
</body>
</html>
