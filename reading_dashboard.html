    // Robust decoding utility to repair UTF-8 byte streams misdecoded as Latin-1/CP-1252 (mojibake)
    function decodeUtf8Bytes(str) {
      if (typeof str !== 'string' || !str) return str;
      if (/[\uAC00-\uD7A3\u3131-\u318E]/.test(str)) return str;
      const hasPotentialMojibake = /[\u0080-\u00FF\u2010-\u203A\u20AC\u2122]/.test(str);
      if (!hasPotentialMojibake) return str;

      const cp1252Map = {
        0x20AC: 0x80, 0x201A: 0x82, 0x0192: 0x83, 0x201E: 0x84, 0x2026: 0x85,
        0x2020: 0x86, 0x2021: 0x87, 0x02C6: 0x88, 0x2030: 0x89, 0x0160: 0x8A,
        0x2039: 0x8B, 0x0152: 0x8C, 0x017D: 0x8E, 0x2018: 0x91, 0x2019: 0x92,
        0x201C: 0x93, 0x201D: 0x94, 0x2022: 0x95, 0x2013: 0x96, 0x2014: 0x97,
        0x02DC: 0x98, 0x2122: 0x99, 0x0161: 0x9A, 0x203A: 0x9B, 0x0153: 0x9C,
        0x017E: 0x9E, 0x0178: 0x9F
      };

      try {
        const bytes = new Uint8Array(str.length);
        for (let i = 0; i < str.length; i++) {
          const code = str.charCodeAt(i);
          if (code <= 0xFF) {
            bytes[i] = code;
          } else if (cp1252Map[code] !== undefined) {
            bytes[i] = cp1252Map[code];
          } else {
            return str;
          }
        }
        return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
      } catch (e) {
        return str;
      }
    }

    function deriveGrade(total) {
      if (total >= 90) return 'S';
      if (total >= 85) return 'A+';
      if (total >= 80) return 'A';
      if (total >= 70) return 'B+';
      if (total >= 60) return 'B';
      return 'C';
    }

    function getGradeTheme(grade) {
      switch (grade) {
        case 'S':
          return {
            bg: 'bg-emerald-600',
            lightBg: 'bg-emerald-50',
            text: 'text-emerald-700',
            border: 'border-emerald-300',
            badge: 'bg-emerald-600 text-white shadow-xs'
          };
        case 'A+':
          return {
            bg: 'bg-indigo-600',
            lightBg: 'bg-indigo-50',
            text: 'text-indigo-700',
            border: 'border-indigo-300',
            badge: 'bg-indigo-600 text-white shadow-xs'
          };
        case 'A':
          return {
            bg: 'bg-blue-600',
            lightBg: 'bg-blue-50',
            text: 'text-blue-700',
            border: 'border-blue-300',
            badge: 'bg-blue-600 text-white shadow-xs'
          };
        case 'B+':
          return {
            bg: 'bg-amber-600',
            lightBg: 'bg-amber-50',
            text: 'text-amber-700',
            border: 'border-amber-300',
            badge: 'bg-amber-600 text-white shadow-xs'
          };
        case 'B':
          return {
            bg: 'bg-orange-500',
            lightBg: 'bg-orange-50',
            text: 'text-orange-700',
            border: 'border-orange-300',
            badge: 'bg-orange-500 text-white'
          };
        default:
          return {
            bg: 'bg-slate-600',
            lightBg: 'bg-slate-50',
            text: 'text-slate-700',
            border: 'border-slate-300',
            badge: 'bg-slate-600 text-white'
          };
      }
    }

    // --- Custom D3 SVG Trend Chart: Gradual Score & Grade Growth Over Time ---
    function ScoreGradeTrendChart({ records, selectedItemIndex, onSelectItem, metric, sortMode }) {
      const [hoveredIndex, setHoveredIndex] = useState(null);

      const chartData = useMemo(() => {
        if (!records) return [];
        const list = records.filter(r => r.totalScore !== null || r.scoreA !== null);
        return [...list].sort((a, b) => {
          if (sortMode === 'session') {
            return a.sessionNum - b.sessionNum;
          }
          return (a.rawDate || '').localeCompare(b.rawDate || '') || a.sessionNum - b.sessionNum;
        });
      }, [records, sortMode]);

      if (chartData.length === 0) {
        return (
          <div className="h-full flex items-center justify-center text-sm font-bold text-slate-500">
            등록된 점수 및 등급 데이터가 없습니다.
          </div>
        );
      }

      const width = 840;
      const height = 280;
      const margin = { top: 32, right: 70, bottom: 44, left: 45 };
      const innerWidth = width - margin.left - margin.right;
      const innerHeight = height - margin.top - margin.bottom;

      const isSubScore = ['scoreA', 'scoreB', 'scoreC', 'scoreD'].includes(metric);
      const yDomain = isSubScore ? [0, 25] : [60, 100];

      const xScale = d3.scalePoint()
        .domain(chartData.map((d, i) => `${d.session || d.sessionNum}회`))
        .range([0, innerWidth])
        .padding(0.45);

      const yScale = d3.scaleLinear()
        .domain(yDomain)
        .range([innerHeight, 0]);

      const gradeBands = [
        { label: 'S (90~100)', min: 90, max: 100, color: 'rgba(16, 185, 129, 0.09)' },
        { label: 'A+ (85~89)', min: 85, max: 90, color: 'rgba(99, 102, 241, 0.08)' },
        { label: 'A (80~84)', min: 80, max: 85, color: 'rgba(59, 130, 246, 0.07)' },
        { label: 'B+ (70~79)', min: 70, max: 80, color: 'rgba(245, 158, 11, 0.06)' },
      ];

      const createLinePath = (getValue) => {
        const lineGen = d3.line()
          .x((d, i) => xScale(`${d.session || d.sessionNum}회`))
          .y((d) => yScale(getValue(d)))
          .curve(d3.curveMonotoneX);
        return lineGen(chartData);
      };

      const createAreaPath = (getValue) => {
        const areaGen = d3.area()
          .x((d, i) => xScale(`${d.session || d.sessionNum}회`))
          .y0(innerHeight)
          .y1((d) => yScale(getValue(d)))
          .curve(d3.curveMonotoneX);
        return areaGen(chartData);
      };

      const yTicks = yScale.ticks(isSubScore ? 5 : 5);

      return (
        <div className="w-full h-full relative">
          <svg
            viewBox={`0 0 ${width} ${height}`}
            className="w-full h-full overflow-visible select-none"
            preserveAspectRatio="xMidYMid meet"
          >
            <defs>
              <linearGradient id="totalGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#4f46e5" stopOpacity="0.32" />
                <stop offset="100%" stopColor="#4f46e5" stopOpacity="0.01" />
              </linearGradient>
            </defs>

            {!isSubScore && gradeBands.map((band, i) => {
              const yTop = yScale(Math.min(band.max, yDomain[1]));
              const yBottom = yScale(Math.max(band.min, yDomain[0]));
              const h = Math.max(0, yBottom - yTop);
              return (
                <g key={i} transform={`translate(${margin.left}, ${margin.top})`}>
                  <rect
                    x={0}
                    y={yTop}
                    width={innerWidth}
                    height={h}
                    fill={band.color}
                  />
                  <text
                    x={innerWidth + 8}
                    y={yTop + h / 2 + 4}
                    className="text-[10px] font-black fill-slate-700"
                  >
                    {band.label}
                  </text>
                </g>
              );
            })}

            {yTicks.map(tick => (

                <line x1={0} x2={innerWidth} stroke="#e2e8f0" strokeDasharray="3 3" />
                <text
                  x={-8}
                  y={4}

                  className="text-[11px] font-bold fill-slate-800 font-mono"
                >
                  {tick}점

            <g transform={`translate(${margin.left}, ${margin.top})`}>

              )}

              {metric === 'all4' && (
                <>
                  <path

                    fill="none"
                    stroke="#6366f1"
                    strokeWidth="2"
                    strokeDasharray="4 2"
                    opacity="0.85"
                  />
                  <path
                    d={createLinePath(d => (d.scoreB || 0) * 4)}
                    fill="none"
                    stroke="#0284c7"
                    strokeWidth="2"
                    strokeDasharray="4 2"
                    opacity="0.85"
                  />
                  <path
                    d={createLinePath(d => (d.scoreC || 0) * 4)}
                    fill="none"
                    stroke="#9333ea"
                    strokeWidth="2"
                    strokeDasharray="4 2"
                    opacity="0.85"
                  />
                  <path
                    d={createLinePath(d => (d.scoreD || 0) * 4)}
                    fill="none"
                    stroke="#d97706"
                    strokeWidth="2"
                    strokeDasharray="4 2"
                    opacity="0.85"
                  />

              {isSubScore && (
                <path
                  d={createLinePath(d => d[metric] || 0)}
                  fill="none"
                  stroke="#4f46e5"

                />
              )}

              {(metric === 'total' || metric === 'all4') && (
                <path
                  d={createLinePath(d => d.totalScore || 0)}
                  fill="none"
                  stroke="#4338ca"
                  strokeWidth="3.5"
                  strokeLinecap="round"
                />
              )}

              {chartData.map((d, idx) => {
                const xVal = xScale(`${d.session || d.sessionNum}회`);
                const targetScore = isSubScore ? (d[metric] || 0) : (d.totalScore || 0);
                const yVal = yScale(targetScore);
                const isSelected = selectedItemIndex === d.index_;
                const isHovered = hoveredIndex === d.index_;
                const isLast = idx === chartData.length - 1;

                return (
                  <g
                    key={d.index_}
                    className="cursor-pointer"
                    onClick={() => onSelectItem(d.index_)}
                    onMouseEnter={() => setHoveredIndex(d.index_)}
                    onMouseLeave={() => setHoveredIndex(null)}
                  >
                    <line
                      x1={xVal}
                      x2={xVal}
                      y1={yVal}
                      y2={innerHeight}
                      stroke={isSelected ? '#4f46e5' : '#cbd5e1'}
                      strokeDasharray={isSelected ? 'none' : '2 2'}
                      strokeWidth={isSelected ? '2' : '1'}
                    />

                    {(isSelected || isHovered) && (
                      <circle
                        cx={xVal}
                        cy={yVal}
                        r={isSelected ? 11 : 9}
                        fill="#4f46e5"
                        fillOpacity="0.22"
                      />
                    )}

                    <circle
                      cx={xVal}
                      cy={yVal}
                      r={isSelected ? 6.5 : isLast ? 6 : 5}
                      fill={isLast ? '#059669' : isSelected ? '#4338ca' : '#4f46e5'}
                      stroke="#ffffff"
                      strokeWidth="2.5"
                    />

                    <g transform={`translate(${xVal}, ${yVal - 14})`}>
                      <rect
                        x="-20"
                        y="-13"
                        width="40"
                        height="17"
                        rx="4"
                        fill={isSelected ? '#312e81' : isLast ? '#065f46' : '#ffffff'}
                        stroke={isSelected ? '#4338ca' : isLast ? '#059669' : '#cbd5e1'}
                        strokeWidth="1"
                        filter="drop-shadow(0 1px 2px rgba(0,0,0,0.08))"
                      />
                      <text
                        textAnchor="middle"
                        y="-1"
                        className={`text-[11px] font-black font-mono ${
                          isSelected || isLast ? 'fill-white' : 'fill-slate-900'
                        }`}
                      >
                        {targetScore}점
                      </text>
                    </g>

                    {!isSubScore && d.grade && (
                      <text
                        x={xVal}
                        y={yVal + 17}
                        textAnchor="middle"
                        className={`text-[11px] font-black ${
                          d.grade === 'S'
                            ? 'fill-emerald-700'
                            : d.grade === 'A+'
                            ? 'fill-indigo-700'
                            : 'fill-slate-700'
                        }`}
                      >
                        {d.grade}
                      </text>
                    )}

                    <text
                      x={xVal}
                      y={innerHeight + 18}
                      textAnchor="middle"
                      className={`text-xs ${
                        isSelected ? 'font-black fill-indigo-950' : 'font-extrabold fill-slate-800'
                      }`}
                    >
                      {d.session || `${d.sessionNum}회차`}
                    </text>

                    <text
                      x={xVal}
                      y={innerHeight + 32}
                      textAnchor="middle"
                      className={`text-[10px] font-semibold ${
                        isSelected ? 'fill-indigo-700 font-bold' : 'fill-slate-500'
                      }`}
                    >
                      {d.rawDate ? `${d.month}/${d.day}` : ''}
                    </text>
                  </g>
                );
              })}
            </g>
          </svg>

          {hoveredIndex !== null && (
            <div className="absolute top-2 left-14 bg-slate-900/95 text-white p-2.5 rounded-xl shadow-xl text-xs space-y-1 pointer-events-none z-20 border border-slate-700">
              {(() => {
                const h = chartData.find(d => d.index_ === hoveredIndex);
                if (!h) return null;
                return (
                  <>
                    <div className="font-extrabold flex items-center gap-2">
                      <span className="px-1.5 py-0.5 rounded bg-indigo-600 text-[10px]">{h.session}</span>
                      <span>{h.bookTitle}</span>
                      <span className="text-slate-400 font-mono">({h.rawDate})</span>
                    </div>
                    <div className="flex items-center gap-3 pt-1 text-slate-200">
                      <span>총점: <strong className="text-emerald-400 text-sm font-black">{h.totalScore}점</strong></span>
                      <span>성취등급: <strong className="text-indigo-300 font-black">{h.grade}</strong></span>
                      <span>이해 {h.scoreA} · 비판 {h.scoreB} · 내면 {h.scoreC} · 표현 {h.scoreD}</span>
                    </div>
                  </>
                );
              })()}
            </div>
          )}
        </div>
      );
    }

    // --- Custom D3 SVG Bar Chart: Monthly Reading Progress ---
    function MonthlyBarChart({ data, activeFilter, onSelectMonth }) {
      const [hoveredBar, setHoveredBar] = useState(null);

      if (!data || data.length === 0) {
        return (
          <div className="h-full flex items-center justify-center text-sm font-bold text-slate-700">
            월별 기록 데이터가 없습니다.
          </div>
        );
      }

      const width = 380;
      const height = 150;
      const margin = { top: 25, right: 20, bottom: 28, left: 35 };
      const innerWidth = width - margin.left - margin.right;
      const innerHeight = height - margin.top - margin.bottom;

      const maxVal = d3.max(data, d => d.count) || 1;
      const yDomainMax = Math.max(maxVal + 1, 4);

      const xScale = d3
        .scaleBand()
        .domain(data.map(d => d.monthKey))
        .range([0, innerWidth])
        .padding(0.38);

      const yScale = d3
        .scaleLinear()
        .domain([0, yDomainMax])
        .nice()
        .range([innerHeight, 0]);

      const yTicks = yScale.ticks(4);

      return (
        <div className="w-full h-full relative">
          <svg
            viewBox={`0 0 ${width} ${height}`}
            className="w-full h-full overflow-visible"
            preserveAspectRatio="xMidYMid meet"
          >
            {yTicks.map(tick => (
              <g key={tick} transform={`translate(${margin.left}, ${margin.top + yScale(tick)})`}>
                <line x1={0} x2={innerWidth} stroke="#f1f5f9" strokeDasharray="3 3" />
                <text
                  x={-8}
                  y={4}
                  textAnchor="end"
                  className="text-[11px] fill-slate-800 font-extrabold font-mono"
                >
                  {tick}
                </text>
              </g>
            ))}

            <line
              x1={margin.left}
              x2={margin.left + innerWidth}
              y1={margin.top + innerHeight}
              y2={margin.top + innerHeight}
              stroke="#cbd5e1"
              strokeWidth="1.5"
            />

            <g transform={`translate(${margin.left}, ${margin.top})`}>
              {data.map(d => {
                const barX = xScale(d.monthKey);
                const barY = yScale(d.count);
                const barWidth = xScale.bandwidth();
                const barHeight = Math.max(innerHeight - barY, 2);
                const isSelected = activeFilter === d.monthKey;
                const isHovered = hoveredBar === d.monthKey;

                return (
                  <g
                    key={d.monthKey}
                    className="cursor-pointer group"
                    onClick={() => onSelectMonth(d.monthKey)}
                    onMouseEnter={() => setHoveredBar(d.monthKey)}
                    onMouseLeave={() => setHoveredBar(null)}
                  >
                    <rect
                      x={barX}
                      y={barY}
                      width={barWidth}
                      height={barHeight}
                      rx={4}
                      className={`transition-all duration-200 ${
                        isSelected
                          ? 'fill-indigo-600'
                          : isHovered
                          ? 'fill-indigo-400'
                          : 'fill-indigo-500/85 hover:fill-indigo-500'
                      }`}
                    />
                    <text
                      x={barX + barWidth / 2}
                      y={barY - 6}
                      textAnchor="middle"
                      className={`text-xs font-black ${
                        isSelected ? 'fill-indigo-800' : 'fill-slate-900'
                      }`}
                    >
                      {d.count}권
                    </text>
                    <text
                      x={barX + barWidth / 2}
                      y={innerHeight + 18}
                      textAnchor="middle"
                      className={`text-xs ${
                        isSelected ? 'fill-indigo-950 font-black' : 'fill-slate-800 font-bold'
                      }`}
                    >
                      {d.label}
                    </text>
                  </g>
                );
              })}
            </g>
          </svg>

          {hoveredBar && (
            <div className="absolute top-1 right-2 bg-slate-900 text-white text-xs font-bold px-2.5 py-1.5 rounded-md shadow-md pointer-events-none z-10">
              {data.find(d => d.monthKey === hoveredBar)?.label}:{' '}
              <span className="font-extrabold text-indigo-300">
                {data.find(d => d.monthKey === hoveredBar)?.count}권 완독
              </span>
            </div>
          )}
        </div>
      );
    }

    // --- Main App Component ---
    function App({ data, updateItem, deleteItem, insertItem, moveItem, followLink, onManualSync, isLiveConnected, lastSyncTime: parentSyncTime, isSyncing: parentIsSyncing }) {
      const [refreshTick, setRefreshTick] = useState(0);

      const cleanData = useMemo(() => {
        if (!data || !Array.isArray(data)) return [];
        return data.map(item => ({
          index_: item.index_,
          row: Array.isArray(item.row)
            ? item.row.map(cell => (typeof cell === 'string' ? decodeUtf8Bytes(cell) : cell))
            : []
        }));
      }, [data, refreshTick]);

      const headerInfo = useMemo(() => {
        if (!cleanData || cleanData.length === 0) return { headerRowIndex: 0, headers: [] };
        const found = cleanData.find(item =>
          item.row &&
          item.row.some(c => typeof c === 'string' && (c.includes('회차') || c.includes('분류') || c.includes('도서명') || c.includes('줄거리')))
        );
        return {
          headerRowIndex: found ? found.index_ : 0,
          headers: found ? found.row : []
        };
      }, [cleanData]);

      const colIndexes = useMemo(() => {
        const headers = headerInfo.headers;
        const findIndex = (predicate, fallback) => {
          const idx = headers.findIndex(c => typeof c === 'string' && predicate(c.toLowerCase()));
          return idx !== -1 ? idx : fallback;
        };
        return {
          session: findIndex(c => c.includes('회차'), 0),
          date: findIndex(c => c.includes('기록일') || c.includes('일자') || c.includes('날짜'), 1),
          title: findIndex(c => c.includes('분류') || c.includes('도서명'), 2),
          author: findIndex(c => c.includes('저자'), 3),
          summary: findIndex(c => c.includes('줄거리'), 4),
          quote: findIndex(c => c.includes('인상 깊은') || c.includes('문장'), 5),
          studentThoughts: findIndex(c => c.includes('느낀 점') || c.includes('느낀점'), 6),
          internalization: findIndex(c => c.includes('나의 생각') || c.includes('달라진 점') || c.includes('내면화'), 7),
          aiAnalysis: findIndex(c => c.includes('ai') || c.includes('강점'), 8),
          tutoringAdvice: findIndex(c => c.includes('지도 조언') || c.includes('보완점'), 9),
          spellingCorrection: findIndex(c => c.includes('맞춤법') || c.includes('교정'), 10),
          kidFeedback: findIndex(c => c.includes('피드백') || c.includes('코멘트'), 11),
          scoreA: findIndex(c => c.includes('텍스트이해') || c.includes('텍스트 이해') || c.includes('a.텍스트'), 12),
          scoreB: findIndex(c => c.includes('비판적사고') || c.includes('비판적 사고') || c.includes('b.비판'), 13),
          scoreC: findIndex(c => c.includes('가치내면화') || c.includes('가치 내면화') || c.includes('c.가치'), 14),
          scoreD: findIndex(c => c.includes('표현정밀도') || c.includes('표현 정밀도') || c.includes('d.표현'), 15),
          totalScore: findIndex(c => c.includes('총점'), 16),
          grade: findIndex(c => c.includes('성취등급') || c.includes('등급'), 17)
        };
      }, [headerInfo]);

      const records = useMemo(() => {
        if (!cleanData) return [];
        const parseScore = (val) => {
          if (val === null || val === undefined || val === '') return null;
          const num = typeof val === 'number' ? val : parseFloat(String(val).replace(/[^0-9.]/g, ''));
          return isNaN(num) ? null : num;
        };

        return cleanData
          .filter(item => item.index_ !== headerInfo.headerRowIndex && item.row && item.row.some(cell => cell !== null && cell !== ''))
          .map(item => {
            const row = item.row;
            const rawTitle = row[colIndexes.title] || '';
            let category = '기타';
            let bookTitle = String(rawTitle).trim();

            const catMatch = bookTitle.match(/^\[(.*?)\]\s*(.*)$/);
            if (catMatch) {
              category = catMatch[1].trim();
              bookTitle = catMatch[2].trim();
            }

            const dateStr = row[colIndexes.date] ? String(row[colIndexes.date]).trim() : '';
            let year = null;
            let month = null;
            let day = null;
            let monthKey = '';
            let timestamp = 0;

            if (dateStr) {
              const cleanDate = dateStr.replace(/[\.\/]/g, '-').replace(/\s+/g, '');
              const parts = cleanDate.split('-').filter(Boolean);
              if (parts.length === 3) {
                let y = parseInt(parts[0], 10);
                const m = parseInt(parts[1], 10);
                const d = parseInt(parts[2], 10);
                if (y < 100) y += 2000;
                if (!isNaN(y) && !isNaN(m) && !isNaN(d)) {
                  year = y;
                  month = m;
                  day = d;
                  monthKey = `${year}-${String(month).padStart(2, '0')}`;
                  timestamp = new Date(year, month - 1, day).getTime();
                }
              }
            }

            const rawSession = row[colIndexes.session] ? String(row[colIndexes.session]).trim() : '';
            const sessionMatch = rawSession.match(/\d+/);
            const sessionNum = sessionMatch ? parseInt(sessionMatch[0], 10) : item.index_;

            const scoreA = parseScore(row[colIndexes.scoreA]);
            const scoreB = parseScore(row[colIndexes.scoreB]);
            const scoreC = parseScore(row[colIndexes.scoreC]);
            const scoreD = parseScore(row[colIndexes.scoreD]);
            let totalScore = parseScore(row[colIndexes.totalScore]);
            if (totalScore === null && (scoreA !== null || scoreB !== null || scoreC !== null || scoreD !== null)) {
              totalScore = (scoreA || 0) + (scoreB || 0) + (scoreC || 0) + (scoreD || 0);
            }

            const rawGrade = row[colIndexes.grade] ? String(row[colIndexes.grade]).trim() : '';
            const grade = rawGrade || (totalScore !== null ? deriveGrade(totalScore) : '');

            const originalRawRow = data?.find(d => d.index_ === item.index_)?.row || row;

            return {
              index_: item.index_,
              session: rawSession,
              sessionNum,
              rawDate: dateStr,
              year,
              month,
              day,
              monthKey,
              timestamp,
              fullTitle: rawTitle,
              category,
              bookTitle,
              author: row[colIndexes.author] ? String(row[colIndexes.author]).trim() : '',
              summary: row[colIndexes.summary] ? String(row[colIndexes.summary]).trim() : '',
              quote: row[colIndexes.quote] ? String(row[colIndexes.quote]).trim() : '',
              studentThoughts: row[colIndexes.studentThoughts] ? String(row[colIndexes.studentThoughts]).trim() : '',
              internalization: row[colIndexes.internalization] ? String(row[colIndexes.internalization]).trim() : '',
              aiAnalysis: row[colIndexes.aiAnalysis] ? String(row[colIndexes.aiAnalysis]).trim() : '',
              tutoringAdvice: row[colIndexes.tutoringAdvice] ? String(row[colIndexes.tutoringAdvice]).trim() : '',
              spellingCorrection: row[colIndexes.spellingCorrection] ? String(row[colIndexes.spellingCorrection]).trim() : '',
              kidFeedback: row[colIndexes.kidFeedback] ? String(row[colIndexes.kidFeedback]).trim() : '',
              scoreA,
              scoreB,
              scoreC,
              scoreD,
              totalScore,
              grade,
              originalRow: originalRawRow
            };
          });
      }, [cleanData, data, headerInfo, colIndexes, refreshTick]);

      const [selectedItemIndex, setSelectedItemIndex] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('전체');
      const [activeMonthFilter, setActiveMonthFilter] = useState(null);
      const [listSortOrder, setListSortOrder] = useState('desc');
      const [trendMetric, setTrendMetric] = useState('total');
      const [trendSortMode, setTrendSortMode] = useState('session');

      const [isEditModalOpen, setIsEditModalOpen] = useState(false);
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [deleteConfirmIndex, setDeleteConfirmIndex] = useState(null);
      const [activeTab, setActiveTab] = useState('all');

      const [localIsSyncing, setLocalIsSyncing] = useState(false);
      const isSyncing = parentIsSyncing !== undefined ? parentIsSyncing : localIsSyncing;
      const [localLastSyncTime, setLocalLastSyncTime] = useState(() => {
        const d = new Date();
        return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
      });
      const lastSyncTime = parentSyncTime || localLastSyncTime;
      const [syncNotice, setSyncNotice] = useState('');

      const latestRecord = useMemo(() => {
        if (!records || records.length === 0) return null;
        return [...records].sort((a, b) => {
          const sA = a.sessionNum || 0;
          const sB = b.sessionNum || 0;
          if (sA !== sB) return sB - sA;
          const tA = a.timestamp || 0;
          const tB = b.timestamp || 0;
          if (tA !== tB) return tB - tA;
          return b.index_ - a.index_;
        })[0];
      }, [records]);

      const prevLatestRecordIndexRef = useRef(null);

      const handleManualSync = async () => {
        setActiveMonthFilter(null);
        setSelectedCategory('전체');
        setSearchQuery('');
        setListSortOrder('desc');

        if (onManualSync) {
          try {
            await onManualSync();
          } catch (e) {
            console.error('Manual sync failed:', e);
          }
          return;
        }

        setLocalIsSyncing(true);
        setSyncNotice('');
        setRefreshTick(prev => prev + 1);

        const d = new Date();
        const nowStr = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
        setLocalLastSyncTime(nowStr);

        let targetIndex = null;
        let targetSession = '';
        let targetTitle = '';
        let validCount = 0;

        if (data && Array.isArray(data)) {
          const validItems = data.filter(item =>
            item.index_ !== headerInfo.headerRowIndex &&
            item.row &&
            item.row.some(c => c !== null && c !== '')
          );
          validCount = validItems.length;

          const sorted = [...validItems].sort((a, b) => {
            const sA = parseInt(String(a.row?.[colIndexes.session] || '').replace(/\D/g, ''), 10) || a.index_;
            const sB = parseInt(String(b.row?.[colIndexes.session] || '').replace(/\D/g, ''), 10) || b.index_;
            if (sA !== sB) return sB - sA;
            return b.index_ - a.index_;
          });

          if (sorted.length > 0) {
            targetIndex = sorted[0].index_;
            targetSession = String(sorted[0].row?.[colIndexes.session] || `${sorted[0].index_}회차`);
            const rawT = String(sorted[0].row?.[colIndexes.title] || '');
            targetTitle = rawT.replace(/^\[.*?\]\s*/, '').trim() || rawT;
          }
        }

        if (targetIndex !== null) {
          setSelectedItemIndex(targetIndex);
        }

        setTimeout(() => {
          setIsSyncing(false);
          setSyncNotice(`시트 최신 데이터 실시간 동기화 완료: 총 ${validCount}건 연결됨 (최신: ${targetSession} "${targetTitle}" · ${nowStr})`);
          setTimeout(() => {
            setSyncNotice('');
          }, 3500);
        }, 200);
      };

      const prevSignatureRef = useRef('');
      useEffect(() => {
        if (!data || !Array.isArray(data)) return;
        const signature = `${data.length}_${data.map(d => `${d.index_}:${d.row?.[0] || ''}:${d.row?.[2] || ''}:${d.row?.[16] || ''}`).join('|')}`;
        if (prevSignatureRef.current && prevSignatureRef.current !== signature) {
          setRefreshTick(t => t + 1);
          const d = new Date();
          const nowStr = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
          setLastSyncTime(nowStr);
          setSyncNotice(`스프레드시트 최신 변경사항이 즉시 반영되었습니다. (${nowStr})`);
          setTimeout(() => setSyncNotice(''), 3000);
        }
        prevSignatureRef.current = signature;
      }, [data]);

      useEffect(() => {
        const onWindowFocus = () => {
          setRefreshTick(t => t + 1);
        };
        window.addEventListener('focus', onWindowFocus);
        document.addEventListener('visibilitychange', onWindowFocus);
        return () => {
          window.removeEventListener('focus', onWindowFocus);
          document.removeEventListener('visibilitychange', onWindowFocus);
        };
      }, []);

      useEffect(() => {
        if (!records || records.length === 0) {
          setSelectedItemIndex(null);
          prevLatestRecordIndexRef.current = null;
          return;
        }

        if (!latestRecord) return;

        if (
          selectedItemIndex === null ||
          !records.some(r => r.index_ === selectedItemIndex) ||
          (prevLatestRecordIndexRef.current !== null && prevLatestRecordIndexRef.current !== latestRecord.index_)
        ) {
          setSelectedItemIndex(latestRecord.index_);
        }

        prevLatestRecordIndexRef.current = latestRecord.index_;
      }, [records, latestRecord, selectedItemIndex]);

      const selectedRecord = useMemo(() => {
        return records.find(r => r.index_ === selectedItemIndex) || null;
      }, [records, selectedItemIndex]);

      const categories = useMemo(() => {
        const set = new Set();
        records.forEach(r => {
          if (r.category) set.add(r.category);
        });
        return ['전체', ...Array.from(set)];
      }, [records]);

      const filteredRecords = useMemo(() => {
        const list = records.filter(r => {
          if (selectedCategory !== '전체' && r.category !== selectedCategory) return false;
          if (activeMonthFilter && r.monthKey !== activeMonthFilter) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchTitle = r.bookTitle.toLowerCase().includes(q);
            const matchAuthor = r.author.toLowerCase().includes(q);
            const matchSummary = r.summary.toLowerCase().includes(q);
            const matchThoughts = r.studentThoughts.toLowerCase().includes(q);
            const matchAI = r.aiAnalysis.toLowerCase().includes(q);
            if (!matchTitle && !matchAuthor && !matchSummary && !matchThoughts && !matchAI) {
              return false;
            }
          }
          return true;
        });

        return list.sort((a, b) => {
          if (listSortOrder === 'desc') {
            const timeDiff = (b.timestamp || 0) - (a.timestamp || 0);
            if (timeDiff !== 0) return timeDiff;
            const dateComp = (b.rawDate || '').localeCompare(a.rawDate || '');
            return dateComp !== 0 ? dateComp : b.sessionNum - a.sessionNum;
          } else {
            return a.sessionNum - b.sessionNum;
          }
        });
      }, [records, selectedCategory, activeMonthFilter, searchQuery, listSortOrder]);

      const monthlyData = useMemo(() => {
        const map = {};
        records.forEach(r => {
          if (!r.monthKey) return;
          if (!map[r.monthKey]) {
            map[r.monthKey] = {
              monthKey: r.monthKey,
              label: `${r.year}년 ${r.month}월`,
              count: 0,
              books: []
            };
          }
          map[r.monthKey].count += 1;
          map[r.monthKey].books.push(r.bookTitle);
        });
        return Object.values(map).sort((a, b) => a.monthKey.localeCompare(b.monthKey));
      }, [records]);

      const dailyData = useMemo(() => {
        const map = {};
        records.forEach(r => {
          if (!r.rawDate) return;
          if (!map[r.rawDate]) {
            const label = r.month && r.day ? `${r.month}월 ${r.day}일` : r.rawDate;
            map[r.rawDate] = {
              dateStr: r.rawDate,
              label,
              count: 0,
              monthKey: r.monthKey,
              books: []
            };
          }
          map[r.rawDate].count += 1;
          map[r.rawDate].books.push(r.bookTitle);
        });
        return Object.values(map).sort((a, b) => a.dateStr.localeCompare(b.dateStr));
      }, [records]);

      const peakDayInfo = useMemo(() => {
        if (!dailyData || dailyData.length === 0) return '기록 없음';
        const peak = dailyData.reduce((max, d) => (d.count > (max?.count || 0) ? d : max), dailyData[0]);
        return `${peak.label} (${peak.count}권 완독)`;
      }, [dailyData]);

      const stats = useMemo(() => {
        const total = records.length;
        const internalizedCount = records.filter(
          r => r.internalization && r.internalization.trim().length > 0 && !r.internalization.includes('미작성')
        ).length;
        const rawRate = total > 0 ? (internalizedCount / total) * 100 : 0;
        const internalizedRate = Number.isInteger(rawRate) ? String(rawRate) : rawRate.toFixed(1);
        const withFeedbackCount = records.filter(r => r.kidFeedback && r.kidFeedback.trim().length > 0).length;

        const scoredRecords = records.filter(r => r.totalScore !== null);
        const avgScore = scoredRecords.length > 0
          ? (scoredRecords.reduce((acc, r) => acc + r.totalScore, 0) / scoredRecords.length).toFixed(1)
          : '0';
        const maxScoreRec = scoredRecords.reduce((max, r) => (!max || r.totalScore > max.totalScore ? r : max), null);
        const maxScore = maxScoreRec ? maxScoreRec.totalScore : null;
        const maxGrade = maxScoreRec ? maxScoreRec.grade : '-';

        const sessionSorted = [...scoredRecords].sort((a, b) => a.sessionNum - b.sessionNum);
        const firstScored = sessionSorted.length > 0 ? sessionSorted[0] : null;
        const lastScored = sessionSorted.length > 0 ? sessionSorted[sessionSorted.length - 1] : null;

        const initialScore = firstScored ? firstScored.totalScore : null;
        const initialGrade = firstScored ? firstScored.grade : '';

        let scoreGrowthText = '변동 없음';
        if (firstScored && lastScored && firstScored !== lastScored) {
          const growth = Math.round((lastScored.totalScore - firstScored.totalScore) * 10) / 10;
          if (growth > 0) {
            scoreGrowthText = `+${growth}점 상승 ↑`;
          } else if (growth < 0) {
            scoreGrowthText = `${growth}점 하락 ↓`;
          } else {
            scoreGrowthText = '0점 (유지)';
          }
        }

        const latestDateDisplay = latestRecord
          ? (latestRecord.month && latestRecord.day ? `${latestRecord.month}월 ${latestRecord.day}일` : latestRecord.rawDate || '기록 없음')
          : '기록 없음';

        const latestDateShort = latestRecord
          ? (latestRecord.month && latestRecord.day ? `${latestRecord.month}/${latestRecord.day}` : latestRecord.rawDate || '-')
          : '-';

        return {
          total,
          internalizedRate,
          internalizedCount,
          withFeedbackCount,
          peakDay: peakDayInfo,
          avgScore,
          maxScore,
          maxGrade,
          topGrade: maxGrade,
          initialScore,
          initialGrade,
          scoreGrowthText,
          latestDateDisplay,
          latestDateShort,
          latestSession: latestRecord ? latestRecord.session : '-',
          latestDate: latestRecord ? latestRecord.rawDate : '-',
          latestTitle: latestRecord ? latestRecord.bookTitle : '-',
          latestScore: latestRecord && latestRecord.totalScore !== null ? `${latestRecord.totalScore}점` : '-',
          latestGrade: latestRecord && latestRecord.grade ? latestRecord.grade : ''
        };
      }, [records, peakDayInfo, latestRecord]);

      const getCategoryTheme = (cat) => {
        switch (cat) {
          case '문학':
            return { bg: 'bg-indigo-50', text: 'text-indigo-700', border: 'border-indigo-200' };
          case '역사':
            return { bg: 'bg-amber-50', text: 'text-amber-700', border: 'border-amber-200' };
          case '과학':
            return { bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-200' };
          case '고전/문학':
          case '고전':
            return { bg: 'bg-purple-50', text: 'text-purple-700', border: 'border-purple-200' };
          default:
            return { bg: 'bg-sky-50', text: 'text-sky-700', border: 'border-sky-200' };
        }
      };

      const [formData, setFormData] = useState({
        session: '',
        date: '',
        category: '문학',
        bookTitle: '',
        author: '',
        summary: '',
        quote: '',
        studentThoughts: '',
        internalization: '',
        aiAnalysis: '',
        tutoringAdvice: '',
        spellingCorrection: '',
        kidFeedback: '',
        scoreA: '',
        scoreB: '',
        scoreC: '',
        scoreD: '',
        totalScore: '',
        grade: ''
      });

      const openAddModal = () => {
        const maxSession = records.reduce((max, r) => Math.max(max, r.sessionNum || 0), 0);
        const nextSessionNum = maxSession > 0 ? maxSession + 1 : records.length + 1;
        const today = new Date();
        const y = today.getFullYear();
        const m = String(today.getMonth() + 1).padStart(2, '0');
        const d = String(today.getDate()).padStart(2, '0');
        setFormData({
          session: `${nextSessionNum}회차`,
          date: `${y}-${m}-${d}`,
          category: '문학',
          bookTitle: '',
          author: '',
          summary: '',
          quote: '',
          studentThoughts: '',
          internalization: '',
          aiAnalysis: '',
          tutoringAdvice: '',
          spellingCorrection: '',
          kidFeedback: '',
          scoreA: '',
          scoreB: '',
          scoreC: '',
          scoreD: '',
          totalScore: '',
          grade: ''
        });
        setIsAddModalOpen(true);
      };

      const openEditModal = (rec) => {
        if (!rec) return;
        setFormData({
          session: rec.session || '',
          date: rec.rawDate || '',
          category: rec.category || '문학',
          bookTitle: rec.bookTitle || '',
          author: rec.author || '',
          summary: rec.summary || '',
          quote: rec.quote || '',
          studentThoughts: rec.studentThoughts || '',
          internalization: rec.internalization || '',
          aiAnalysis: rec.aiAnalysis || '',
          tutoringAdvice: rec.tutoringAdvice || '',
          spellingCorrection: rec.spellingCorrection || '',
          kidFeedback: rec.kidFeedback || '',
          scoreA: rec.scoreA !== null ? String(rec.scoreA) : '',
          scoreB: rec.scoreB !== null ? String(rec.scoreB) : '',
          scoreC: rec.scoreC !== null ? String(rec.scoreC) : '',
          scoreD: rec.scoreD !== null ? String(rec.scoreD) : '',
          totalScore: rec.totalScore !== null ? String(rec.totalScore) : '',
          grade: rec.grade || ''
        });
        setIsEditModalOpen(true);
      };

      const updateFormScores = (field, val) => {
        setFormData(prev => {
          const next = { ...prev, [field]: val };
          const a = parseFloat(field === 'scoreA' ? val : prev.scoreA) || 0;
          const b = parseFloat(field === 'scoreB' ? val : prev.scoreB) || 0;
          const c = parseFloat(field === 'scoreC' ? val : prev.scoreC) || 0;
          const d = parseFloat(field === 'scoreD' ? val : prev.scoreD) || 0;
          const hasAny = (field === 'scoreA' ? val : prev.scoreA) !== '' ||
                         (field === 'scoreB' ? val : prev.scoreB) !== '' ||
                         (field === 'scoreC' ? val : prev.scoreC) !== '' ||
                         (field === 'scoreD' ? val : prev.scoreD) !== '';
          if (hasAny) {
            const sum = Math.round((a + b + c + d) * 10) / 10;
            next.totalScore = String(sum);
            if (!prev.grade || ['S', 'A+', 'A', 'B+', 'B', 'C'].includes(prev.grade)) {
              next.grade = deriveGrade(sum);
            }
          }
          return next;
        });
      };

      const handleSaveAdd = () => {
        const fullTitleStr = `[${formData.category.trim()}] ${formData.bookTitle.trim()}`;
        const maxCols = Math.max(18, ...Object.values(colIndexes));
        const newRow = new Array(maxCols + 1).fill(null);
        newRow[colIndexes.session] = formData.session.trim();
        newRow[colIndexes.date] = formData.date.trim();
        newRow[colIndexes.title] = fullTitleStr;
        newRow[colIndexes.author] = formData.author.trim();
        newRow[colIndexes.summary] = formData.summary.trim();
        newRow[colIndexes.quote] = formData.quote.trim();
        newRow[colIndexes.studentThoughts] = formData.studentThoughts.trim();
        newRow[colIndexes.internalization] = formData.internalization.trim() || null;
        newRow[colIndexes.aiAnalysis] = formData.aiAnalysis.trim() || null;
        newRow[colIndexes.tutoringAdvice] = formData.tutoringAdvice.trim() || null;
        newRow[colIndexes.spellingCorrection] = formData.spellingCorrection.trim() || null;
        newRow[colIndexes.kidFeedback] = formData.kidFeedback.trim() || null;

        newRow[colIndexes.scoreA] = formData.scoreA !== '' ? parseFloat(formData.scoreA) : null;
        newRow[colIndexes.scoreB] = formData.scoreB !== '' ? parseFloat(formData.scoreB) : null;
        newRow[colIndexes.scoreC] = formData.scoreC !== '' ? parseFloat(formData.scoreC) : null;
        newRow[colIndexes.scoreD] = formData.scoreD !== '' ? parseFloat(formData.scoreD) : null;
        newRow[colIndexes.totalScore] = formData.totalScore !== '' ? parseFloat(formData.totalScore) : null;
        newRow[colIndexes.grade] = formData.grade.trim() || null;

        insertItem(undefined, newRow);
        setIsAddModalOpen(false);
      };

      const handleSaveEdit = () => {
        if (!selectedRecord) return;
        const fullTitleStr = `[${formData.category.trim()}] ${formData.bookTitle.trim()}`;
        const maxCols = Math.max(18, selectedRecord.originalRow.length, ...Object.values(colIndexes));
        const updatedRow = [...selectedRecord.originalRow];
        while (updatedRow.length < maxCols + 1) {
          updatedRow.push(null);
        }
        updatedRow[colIndexes.session] = formData.session.trim();
        updatedRow[colIndexes.date] = formData.date.trim();
        updatedRow[colIndexes.title] = fullTitleStr;
        updatedRow[colIndexes.author] = formData.author.trim();
        updatedRow[colIndexes.summary] = formData.summary.trim();
        updatedRow[colIndexes.quote] = formData.quote.trim();
        updatedRow[colIndexes.studentThoughts] = formData.studentThoughts.trim();
        updatedRow[colIndexes.internalization] = formData.internalization.trim() || null;
        updatedRow[colIndexes.aiAnalysis] = formData.aiAnalysis.trim() || null;
        updatedRow[colIndexes.tutoringAdvice] = formData.tutoringAdvice.trim() || null;
        updatedRow[colIndexes.spellingCorrection] = formData.spellingCorrection.trim() || null;
        updatedRow[colIndexes.kidFeedback] = formData.kidFeedback.trim() || null;

        updatedRow[colIndexes.scoreA] = formData.scoreA !== '' ? parseFloat(formData.scoreA) : null;
        updatedRow[colIndexes.scoreB] = formData.scoreB !== '' ? parseFloat(formData.scoreB) : null;
        updatedRow[colIndexes.scoreC] = formData.scoreC !== '' ? parseFloat(formData.scoreC) : null;
        updatedRow[colIndexes.scoreD] = formData.scoreD !== '' ? parseFloat(formData.scoreD) : null;
        updatedRow[colIndexes.totalScore] = formData.totalScore !== '' ? parseFloat(formData.totalScore) : null;
        updatedRow[colIndexes.grade] = formData.grade.trim() || null;

        updateItem(selectedRecord.index_, updatedRow);
        setIsEditModalOpen(false);
      };

      const handleDelete = (indexToDelete) => {
        deleteItem(indexToDelete);
        setDeleteConfirmIndex(null);
        if (selectedItemIndex === indexToDelete) {
          const remaining = records.filter(r => r.index_ !== indexToDelete);
          setSelectedItemIndex(remaining.length > 0 ? remaining[0].index_ : null);
        }
      };

      const clearFilters = () => {
        setActiveMonthFilter(null);
        setSelectedCategory('전체');
        setSearchQuery('');
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 flex flex-col antialiased font-sans">
          {/* Top Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3.5">
                <div className="w-11 h-11 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-sm shrink-0">
                  <GraduationCap className="w-6 h-6" />
                </div>
                <div>
                  <div className="flex items-center gap-2.5 flex-wrap">
                    <h1 className="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight">
                      독서 & 논술 지도 튜터링 대시보드
                    </h1>
                    <span className="px-2.5 py-0.5 text-xs sm:text-sm font-bold rounded-full bg-indigo-100 text-indigo-900">
                      학생 맞춤 코칭
                    </span>
                    {latestRecord && (
                      <span className="px-2.5 py-0.5 text-xs font-bold rounded-full bg-emerald-100 text-emerald-900 border border-emerald-300 flex items-center gap-1.5 shadow-xs">
                        <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                        최신 데이터: {stats.latestSession} ({stats.latestDate})
                        <span className="text-emerald-700 font-mono text-[11px] ml-0.5 hidden sm:inline">· 동기화 {lastSyncTime}</span>
                      </span>
                    )}
                  </div>
                  <p className="text-sm font-bold text-slate-700 mt-0.5">
                    일별·월별 독서 진도 및 4대 영역별 성취 점수·등급 성장 추이 시각화
                  </p>
                </div>
              </div>

              {/* Top Actions */}
              <div className="flex items-center gap-2.5 flex-wrap">
                <a
                  href="https://docs.google.com/spreadsheets/d/1cT7wCoT8aDh01ofDRb5Sh0ANHElVRZSro5TH1-IH6d0/edit?usp=sharing"
                  target="_blank"
                  rel="noopener noreferrer"
                  className="flex items-center gap-1.5 px-3.5 py-2 text-xs sm:text-sm font-bold rounded-lg text-emerald-800 bg-emerald-50 hover:bg-emerald-100 border border-emerald-300 shadow-xs transition-all active:scale-95 cursor-pointer"
                  title="구글 스프레드시트 원본 '독후감 이력관리' 새 탭에서 열기"
                >
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span>구글 시트 열기</span>
                  <ArrowUpRight className="w-4 h-4 text-emerald-600" />
                </a>

                <button
                  type="button"
                  onClick={handleManualSync}
                  disabled={isSyncing}
                  className="flex items-center gap-1.5 px-3.5 py-2 text-xs sm:text-sm font-bold rounded-lg text-indigo-800 bg-white hover:bg-indigo-50 border border-indigo-200 shadow-xs transition-all active:scale-95 cursor-pointer disabled:opacity-60"
                  title="구글 스프레드시트 최신 데이터 즉시 확인 및 실시간 동기화"
                >
                  <RefreshCw className={`w-4 h-4 text-indigo-600 ${isSyncing ? 'animate-spin' : ''}`} />
                  <span>{isSyncing ? '구글 시트 동기화 중...' : '데이터 동기화 (Sync)'}</span>
                </button>

                {selectedRecord && latestRecord && selectedRecord.index_ !== latestRecord.index_ && (
                  <button
                    onClick={() => setSelectedItemIndex(latestRecord.index_)}
                    className="flex items-center gap-1.5 px-3 py-2 text-xs sm:text-sm font-bold rounded-lg text-indigo-700 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 transition-colors cursor-pointer"
                    title="가장 최근 입력된 독후감 데이터로 바로 이동"
                  >
                    <ArrowUpRight className="w-4 h-4" />
                    <span>최신 기록({latestRecord.session}) 보기</span>
                  </button>
                )}
                {(activeMonthFilter || selectedCategory !== '전체' || searchQuery) && (
                  <button
                    onClick={clearFilters}
                    className="flex items-center gap-1.5 px-3 py-2 text-sm font-bold rounded-lg text-slate-800 bg-slate-100 hover:bg-slate-200 transition-colors"
                    title="모든 필터 초기화"
                  >
                    <RotateCcw className="w-4 h-4" />
                    <span>필터 초기화</span>
                  </button>
                )}
                <button
                  onClick={openAddModal}
                  className="flex items-center gap-2 px-4 py-2.5 text-sm font-bold rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 shadow-sm transition-all active:scale-95 cursor-pointer"
                >
                  <Plus className="w-4 h-4" />
                  <span>새 독후감 등록</span>
                </button>
              </div>
            </div>
          </header>

          {/* Sync Feedback Toast Banner */}
          {syncNotice && (
            <div className="bg-emerald-600 text-white text-xs sm:text-sm font-bold px-4 py-2 shadow-xs transition-all">
              <div className="max-w-7xl mx-auto flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <CheckCircle2 className="w-4 h-4 text-emerald-200 shrink-0" />
                  <span>{syncNotice}</span>
                </div>
                <button
                  onClick={() => setSyncNotice('')}
                  className="p-1 text-emerald-200 hover:text-white rounded transition-colors cursor-pointer"
                >
                  <X className="w-3.5 h-3.5" />
                </button>
              </div>
            </div>
          )}

          {/* Main Body Container */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-5 space-y-5">
            {/* KPI Stat Cards */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3.5">
              <div className="bg-white rounded-xl p-4 border border-slate-200 shadow-xs flex items-center gap-3.5">
                <div className="w-11 h-11 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center shrink-0">
                  <BookOpen className="w-6 h-6" />
                </div>
                <div>
                  <div className="text-xs sm:text-sm font-bold text-slate-700">누적 독후감 기록</div>
                  <div className="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">
                    {stats.total}<span className="text-xs sm:text-sm font-bold text-slate-600 ml-1.5">편 완독</span>
                  </div>
                </div>
              </div>

              <div className="bg-white rounded-xl p-4 border border-slate-200 shadow-xs flex items-center gap-3.5">
                <div className="w-11 h-11 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0">
                  <Trophy className="w-6 h-6" />
                </div>
                <div className="min-w-0 flex-1">
                  <div className="text-xs sm:text-sm font-bold text-slate-700 truncate">
                    오늘 / 최신 성취 ({stats.latestDateDisplay})
                  </div>
                  <div className="text-xl sm:text-2xl font-black text-slate-900 tracking-tight flex items-center gap-1.5">
                    <span>{stats.latestScore}</span>
                    {stats.latestGrade && (
                      <span className="px-2 py-0.5 text-xs font-black rounded-md bg-emerald-600 text-white">
                        {stats.latestGrade}등급
                      </span>
                    )}
                  </div>
                  <div className="text-[11px] font-bold text-slate-500 truncate mt-0.5">
                    {stats.latestSession} · {stats.latestTitle}
                  </div>
                </div>
              </div>

              <div className="bg-white rounded-xl p-4 border border-slate-200 shadow-xs flex items-center gap-3.5">
                <div className="w-11 h-11 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center shrink-0">
                  <Activity className="w-6 h-6" />
                </div>
                <div>
                  <div className="text-xs sm:text-sm font-bold text-slate-700">평균 획득 점수</div>
                  <div className="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">
                    {stats.avgScore}<span className="text-xs sm:text-sm font-bold text-slate-600 ml-1.5">점 / 100점</span>
                  </div>
                </div>
              </div>

              <div className="bg-white rounded-xl p-4 border border-slate-200 shadow-xs flex items-center gap-3.5">
                <div className="w-11 h-11 rounded-lg bg-purple-50 text-purple-600 flex items-center justify-center shrink-0">
                  <Lightbulb className="w-6 h-6" />
                </div>
                <div>
                  <div className="text-xs sm:text-sm font-bold text-slate-700">가치 내면화 작성률</div>
                  <div className="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">
                    {stats.internalizedRate}<span className="text-xs sm:text-sm font-bold text-slate-600 ml-1.5">% ({stats.internalizedCount}/{stats.total})</span>
                  </div>
                </div>
              </div>

    // --- Container Component with Live Google Sheets Auto-Sync ---
    function DashboardContainer() {
      const [data, setData] = useState(() => {
        try {
          const saved = localStorage.getItem('tutoring_reading_dashboard_data_v2');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {
          console.warn('Could not read from localStorage', e);
        }
        return INITIAL_REAL_DATA;
      });

      const [isServerLive, setIsServerLive] = useState(false);
      const [isSyncing, setIsSyncing] = useState(false);
      const [syncNotice, setSyncNotice] = useState('');
      const [lastSyncTime, setLastSyncTime] = useState(() => {
        const d = new Date();
        return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
      });

      const persistData = (nextData) => {
        setData(nextData);
        try {
          localStorage.setItem('tutoring_reading_dashboard_data_v2', JSON.stringify(nextData));
        } catch (e) {
          console.warn('Could not write to localStorage', e);
        }
      };

      const fetchServerData = async (forceSync = false) => {
        if (forceSync) setIsSyncing(true);
        try {
          const endpoint = forceSync ? '/api/sync' : '/api/data';
          const method = forceSync ? 'POST' : 'GET';
          let res = null;
          try {
            res = await fetch(endpoint, { method, cache: 'no-cache' });
          } catch (netErr) {
            // Static file fallback if API route is unreachable
            if (!forceSync) {
              res = await fetch('/reading_data.json', { cache: 'no-cache' });
            }
          }

          if (res && res.ok) {
            const json = await res.json();
            const serverRows = Array.isArray(json) ? json : (json.data || []);
            if (Array.isArray(serverRows) && serverRows.length > 0) {
              const curSig = JSON.stringify(data);
              const newSig = JSON.stringify(serverRows);
              if (curSig !== newSig) {
                persistData(serverRows);
              }
              setIsServerLive(true);
              const d = new Date();
              const nowStr = json.synced_at || `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
              setLastSyncTime(nowStr);

              if (forceSync) {
                const count = serverRows.length > 1 ? serverRows.length - 1 : serverRows.length;
                setSyncNotice(`구글 시트('독후감 이력관리') 동기화 완료: 총 ${count}건 갱신 (${nowStr})`);
                setTimeout(() => setSyncNotice(''), 3500);
              }
              return serverRows;
            }
          }
        } catch (err) {
          console.warn('Live sync fetch error:', err);
          setIsServerLive(false);
        } finally {
          if (forceSync) setIsSyncing(false);
        }
        return null;
      };

      // Auto-sync polling every 10s and on window focus
      useEffect(() => {
        fetchServerData(false);

        const intervalId = setInterval(() => {
          fetchServerData(false);
        }, 10000);

        const onFocus = () => {
          fetchServerData(false);
        };
        window.addEventListener('focus', onFocus);
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) fetchServerData(false);
        });

        return () => {
          clearInterval(intervalId);
          window.removeEventListener('focus', onFocus);
        };
      }, []);

      const updateItem = (index_, updatedRow) => {
        const next = data.map(item => item.index_ === index_ ? { ...item, row: updatedRow } : item);
        persistData(next);
      };

      const deleteItem = (indexToDelete) => {
        const next = data.filter(item => item.index_ !== indexToDelete);
        persistData(next);
      };

      const insertItem = (targetIndex, newRow) => {
        const maxIdx = data.reduce((max, d) => Math.max(max, d.index_ || 0), 0);
        const newItem = { index_: maxIdx + 1, row: newRow };
        const next = [...data, newItem];
        persistData(next);
      };

      const moveItem = (fromIdx, toIdx) => {
        console.log('moveItem', fromIdx, toIdx);
      };

      const followLink = (url) => {
        window.open(url, '_blank');
      };

      const handleResetDemoData = () => {
        if (confirm('구글 시트의 원본 데이터로 초기화하시겠습니까? 직접 수정한 내용은 리셋됩니다.')) {
          persistData(INITIAL_REAL_DATA);
          fetchServerData(true);
        }
      };

      return (
        <div className="relative">
          <App
            data={data}
            updateItem={updateItem}
            deleteItem={deleteItem}
            insertItem={insertItem}
            moveItem={moveItem}
            followLink={followLink}
            onManualSync={() => fetchServerData(true)}
            isLiveConnected={isServerLive}
            lastSyncTime={lastSyncTime}
            isSyncing={isSyncing}
            syncNotice={syncNotice}
          />

          {/* Floating Helper Toolbar */}
          <div className="fixed bottom-4 right-4 z-40 flex items-center gap-2 bg-white/90 backdrop-blur-md p-2 rounded-2xl shadow-lg border border-slate-200 text-xs font-bold">
            <a
              href="https://docs.google.com/spreadsheets/d/1cT7wCoT8aDh01ofDRb5Sh0ANHElVRZSro5TH1-IH6d0/edit?usp=sharing"
              target="_blank"
              rel="noopener noreferrer"
              className="px-3 py-1.5 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-800 transition-colors flex items-center gap-1.5 cursor-pointer"
              title="구글 스프레드시트 원본 '독후감 이력관리' 열기"
            >
              <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
              <span>구글 시트</span>
              <ArrowUpRight className="w-3.5 h-3.5" />
            </a>
            <span className="text-slate-300">|</span>
            <button
              onClick={() => fetchServerData(true)}
              disabled={isSyncing}
              className="px-3 py-1.5 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-700 transition-colors flex items-center gap-1.5 cursor-pointer disabled:opacity-60"
              title="구글 시트 즉시 동기화"
            >
              <RefreshCw className={`w-3.5 h-3.5 text-indigo-600 ${isSyncing ? 'animate-spin' : ''}`} />
              <span>{isSyncing ? '동기화 중...' : '시트 동기화'}</span>
            </button>
            <span className="text-slate-300">|</span>
            <button
              onClick={handleResetDemoData}
              className="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors flex items-center gap-1 cursor-pointer"
              title="원본 데이터로 리셋"
            >
              <RotateCcw className="w-3.5 h-3.5 text-slate-500" />
              <span>초기화</span>
            </button>
            <span className="text-slate-300">|</span>
            <span className="text-emerald-700 font-semibold px-2 py-1 bg-emerald-50 rounded-lg flex items-center gap-1">
              <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              {isServerLive ? '구글시트 실시간 연동 ON' : '웹 대시보드 동작 중'}
            </span>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DashboardContainer />);
  </script>
</body>
</html>
